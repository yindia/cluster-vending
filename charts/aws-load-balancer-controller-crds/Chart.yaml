apiVersion: v2
name: aws-load-balancer-controller-crds
description: >-
  The AWS Load Balancer Controller's CustomResourceDefinitions as templates, so
  Helm upgrades them (the upstream chart ships them in crds/, which Helm never
  upgrades). Installed by cluster-vending before the controller's chart, which
  then runs with skipCRDs.
type: application
# Same version as the upstream chart the CRDs come from: the release pins one
# version for the component, and its CRD chart is installed at that version.
version: 3.6.2
appVersion: v3.6.2
kubeVersion: ">=1.22.0-0"
keywords:
  - aws-load-balancer-controller
  - crds
sources:
  - https://github.com/aws/eks-charts/tree/master/stable/aws-load-balancer-controller
  - https://github.com/kubernetes-sigs/aws-load-balancer-controller/tree/v3.6.2
annotations:
  # files/ is copied unchanged from the upstream chart's crds/ directory:
  # helm pull aws-load-balancer-controller --repo https://aws.github.io/eks-charts --version 3.6.2
  cluster-vending.io/source-chart: https://aws.github.io/eks-charts aws-load-balancer-controller 3.6.2
  cluster-vending.io/source-files: crds/crds.yaml, crds/gateway-crds.yaml
  cluster-vending.io/source-sha256-crds: a4fcee6ec3fefe69be490b53b6a244b93bbdb1c927f4782dff2b59316581bb7f
  cluster-vending.io/source-sha256-gateway-crds: 3a4264e2a7cf132944fd095b04ce86299385f26ea31b1e89d0ac21761e1865a0
