{{- if .Values.controller.enabled }}
{{- $ctx := dict "root" . "component" "controller" }}
{{- $c := .Values.controller }}
# `cluster-vending controller` (config/manager/manager.yaml). Every setting
# is a flag or CV_* variable of the command (pkg/config/controller.go); the
# shared ones come from the settings file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cv.name" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cv.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      {{- include "cv.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- include "cv.platformChecksum" . | nindent 8 }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cv.selectorLabels" $ctx | nindent 8 }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cv.serviceAccountName" $ctx }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- include "cv.podPlacement" $ctx | nindent 6 }}
      containers:
      - name: manager
        image: {{ include "cv.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /cluster-vending
        - controller
        args:
        - --leader-elect={{ $c.leaderElect }}
        - --health-probe-addr=:8081
        - --metrics-addr={{ if $c.metrics.enabled }}:{{ $c.metrics.port }}{{ else }}0{{ end }}
        - --log-format={{ .Values.log.format }}
        - --log-level={{ .Values.log.level }}
        - --install-providers={{ $c.installProviders }}
        - --install-catalog={{ $c.installCatalog }}
        - --config=/etc/cluster-vending/platform.yaml
        env:
        # The leader election Lease, and the namespace of the controller's
        # own service account, which tenant namespaces bind.
        - name: CV_LEASE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CV_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        {{- with $c.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $c.extraEnvFrom }}
        envFrom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - name: health
          containerPort: 8081
          protocol: TCP
        {{- if $c.metrics.enabled }}
        - name: metrics
          containerPort: {{ $c.metrics.port }}
          protocol: TCP
        {{- end }}
        volumeMounts:
        - name: platform-config
          mountPath: /etc/cluster-vending
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          {{- toYaml $c.securityContext | nindent 10 }}
        livenessProbe:
          {{- toYaml $c.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml $c.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml $c.resources | nindent 10 }}
      volumes:
      - name: platform-config
        configMap:
          name: {{ include "cv.name" (dict "root" . "component" "platform") }}
      - name: tmp
        emptyDir: {}
{{- if $c.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cv.name" (dict "root" . "component" "controller-metrics") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cv.labels" $ctx | nindent 4 }}
spec:
  ports:
  - name: metrics
    port: {{ $c.metrics.port }}
    protocol: TCP
    targetPort: metrics
  selector:
    {{- include "cv.selectorLabels" $ctx | nindent 4 }}
{{- end }}
{{- end }}
