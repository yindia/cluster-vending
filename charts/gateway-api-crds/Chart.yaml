apiVersion: v2
name: gateway-api-crds
description: Platform-owned chart that vendors the Kubernetes Gateway API standard-channel CRDs (standard-install.yaml), unmodified.
type: application
# The chart version IS the vendored Gateway API bundle version, so a Release pin reads as the Gateway API version.
version: 1.6.1
appVersion: "v1.6.1"
# ValidatingAdmissionPolicy v1 (the bundle's safe-upgrades policy) is GA from Kubernetes 1.30.
kubeVersion: ">=1.30.0-0"
keywords:
  - gateway-api
  - crds
home: https://gateway-api.sigs.k8s.io
sources:
  - https://github.com/kubernetes-sigs/gateway-api
annotations:
  # Where files/standard-install.yaml comes from. To bump: download the new file, replace files/standard-install.yaml,
  # update these four annotations plus version/appVersion. Never edit the vendored file by hand.
  cluster-vending.io/vendored-source: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml
  cluster-vending.io/vendored-version: v1.6.1
  cluster-vending.io/vendored-channel: standard
  cluster-vending.io/vendored-sha256: 24d931f22abd8e40c973264319ead7cfa09d0fb7716b7ab1ee2ff174cb063a73
