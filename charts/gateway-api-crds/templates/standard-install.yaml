{{- /*
The CRDs are rendered from templates/, not shipped in crds/, because Helm installs crds/ once and never
upgrades or deletes it. As templates they are upgraded by `helm upgrade` when the vendored file changes.

The vendored file is read with .Files.Get, so it is not parsed as a template and stays byte-identical to
upstream (see the sha256 in Chart.yaml). The only change made at render time is one added annotation,
helm.sh/resource-policy: keep, on every object (the 10 CRDs, the safe-upgrades ValidatingAdmissionPolicy
and its binding). Without it, uninstalling this release would delete the CRDs and, with them, every
Gateway, HTTPRoute and waypoint on the cluster.
*/ -}}
{{- $channel := "    gateway.networking.k8s.io/channel: standard\n" -}}
{{- $keep := "    helm.sh/resource-policy: keep\n" -}}
{{- $manifest := .Files.Get "files/standard-install.yaml" -}}
{{- if not $manifest }}{{ fail "files/standard-install.yaml is missing or empty" }}{{ end -}}
{{- if not (contains $channel $manifest) }}{{ fail "files/standard-install.yaml has no standard-channel annotation; is it the standard-install.yaml bundle?" }}{{ end -}}
{{ $manifest | replace $channel (print $channel $keep) }}
