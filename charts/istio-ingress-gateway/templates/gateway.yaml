{{- $schemes := list "internal" "internet-facing" -}}
{{- if not (has .Values.loadBalancer.scheme $schemes) }}
{{- fail (printf "loadBalancer.scheme must be internal or internet-facing, got %q" .Values.loadBalancer.scheme) }}
{{- end }}
{{- $from := list "All" "Same" "None" -}}
{{- if not (has .Values.routesFrom $from) }}{{ fail "routesFrom must be All, Same or None" }}{{ end }}
{{- if not (has .Values.listenerSetsFrom $from) }}{{ fail "listenerSetsFrom must be All, Same or None" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  infrastructure:
    # istiod copies these onto the Service it generates (and the other generated objects).
    annotations:
      # NLB provisioned by the AWS Load Balancer Controller (the in-tree provider skips "external"), pods as IP targets.
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: {{ .Values.loadBalancer.scheme }}
      # Health check against Envoy's readiness endpoint (port 15021 is always on the generated Service).
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "15021"
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz/ready
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ .Values.name }}-options
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: {{ .Values.routesFrom }}
  # Tenants add hostnames, ports and TLS certificates from their own namespaces with a ListenerSet.
  allowedListeners:
    namespaces:
      from: {{ .Values.listenerSetsFrom }}
