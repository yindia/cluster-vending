# Name of the Gateway. istiod names the Deployment, Service, HPA and PDB "<name>-<gatewayClassName>".
name: ingress

# GatewayClass. "istio" is created by istiod and deploys an Envoy gateway automatically.
gatewayClassName: istio

loadBalancer:
  # internal (private subnets, reachable from the VPC only) or internet-facing (public subnets).
  # Changing it replaces the NLB, so its DNS name changes.
  scheme: internal

# Which namespaces may attach HTTPRoutes to the built-in HTTP listener (port 80): All, Same or None.
routesFrom: All

# Which namespaces may attach ListenerSets (their own hostnames, ports and TLS certificates): All, Same or None.
listenerSetsFrom: All

autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  minAvailable: 1

# Node selector and tolerations of the gateway pods; empty: none.
nodeSelector: {}
tolerations: []

# Resources of the istio-proxy container in the gateway pods.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 1Gi
