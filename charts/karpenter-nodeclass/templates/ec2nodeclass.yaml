{{- $nc := .Values.nodeClass -}}
{{- if not $nc.subnetSelectorTerms }}{{ fail "nodeClass.subnetSelectorTerms must have at least one term" }}{{ end }}
{{- if not $nc.securityGroupSelectorTerms }}{{ fail "nodeClass.securityGroupSelectorTerms must have at least one term" }}{{ end }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ $nc.name }}
  labels:
    {{- include "karpenter-nodeclass.labels" . | nindent 4 }}
spec:
  role: {{ required "nodeClass.role is required" $nc.role | quote }}
  amiSelectorTerms:
    - alias: {{ required "nodeClass.amiAlias is required" $nc.amiAlias | quote }}
  subnetSelectorTerms:
    {{- toYaml $nc.subnetSelectorTerms | nindent 4 }}
  securityGroupSelectorTerms:
    {{- toYaml $nc.securityGroupSelectorTerms | nindent 4 }}
  {{- with $nc.metadataOptions }}
  metadataOptions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $nc.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
