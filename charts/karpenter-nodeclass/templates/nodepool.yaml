{{- if .Values.nodePool.enabled }}
{{- $np := .Values.nodePool -}}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ $np.name }}
  labels:
    {{- include "karpenter-nodeclass.labels" . | nindent 4 }}
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ .Values.nodeClass.name }}
      {{- with $np.expireAfter }}
      expireAfter: {{ . | quote }}
      {{- end }}
      {{- with $np.requirements }}
      requirements:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with $np.limits }}
  limits:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $np.disruption }}
  disruption:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
