# Values for the karpenter-nodeclass companion chart.
# In the cluster-vending catalog, everything under nodeClass is locked by the platform
# (ComponentDefinition platformValues) and the nodePool knobs below are what a tenant may edit.

# -- EC2NodeClass (karpenter.k8s.aws/v1). Platform-owned.
nodeClass:
  # -- Name of the EC2NodeClass. The NodePool references it.
  name: default
  # -- IAM role nodes assume (spec.role). Karpenter creates and manages an instance profile for it.
  # Required. The platform sets this to the cluster's managed node group role.
  role: ""
  # -- AMI alias (spec.amiSelectorTerms[].alias). Format <family>@<version>, e.g. al2023@v20261107; pin
  # a release: al2023@latest replaces every node on each AMI release.
  amiAlias: al2023@v20261107
  # -- spec.subnetSelectorTerms. Required, at least one term.
  subnetSelectorTerms: []
  # - tags:
  #     karpenter.sh/discovery: my-cluster
  # -- spec.securityGroupSelectorTerms. Required, at least one term.
  securityGroupSelectorTerms: []
  # - tags:
  #     aws:eks:cluster-name: my-cluster
  # -- spec.metadataOptions. IMDSv2 only, hop limit 1 (pods off the host network cannot reach IMDS).
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  # -- spec.tags: extra tags propagated to EC2 resources Karpenter creates.
  tags: {}

# -- Default NodePool (karpenter.sh/v1).
nodePool:
  # -- Render the NodePool. With false, Karpenter is installed but provisions nothing.
  enabled: true
  # -- Name of the NodePool.
  name: default
  # -- spec.limits: total capacity the pool may provision (cpu, memory, nodes).
  limits:
    cpu: "100"
    memory: 400Gi
  # -- spec.template.spec.requirements.
  requirements:
    - key: kubernetes.io/arch
      operator: In
      values: ["amd64"]
    - key: kubernetes.io/os
      operator: In
      values: ["linux"]
    - key: karpenter.sh/capacity-type
      operator: In
      values: ["on-demand"]
    - key: karpenter.k8s.aws/instance-category
      operator: In
      values: ["c", "m", "r"]
    - key: karpenter.k8s.aws/instance-generation
      operator: Gt
      values: ["2"]
  # -- spec.disruption.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"
  # -- spec.template.spec.expireAfter: max node lifetime (duration like 720h, or Never).
  expireAfter: 720h
