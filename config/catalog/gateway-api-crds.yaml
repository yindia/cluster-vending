apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: gateway-api-crds
spec:
  description: Kubernetes Gateway API CRDs (standard channel), needed by Istio ambient waypoints and the Gateway API ingress.
  # A member of the istio bundle (istio.yaml): installed with it, by the
  # platform, with every cluster.
  management: Platform
  internal: true
  # Only the Helm release record lives here; every object in the chart is cluster-scoped. No pods run.
  namespace: gateway-system
  install:
    helm:
      # Platform-owned chart that vendors the upstream standard-install.yaml unmodified
      # (drafted in charts/gateway-api-crds). Chart version = Gateway API version.
      repository: oci://ghcr.io/yindia/cluster-vending/charts
      chart: gateway-api-crds
  # The chart has no values.
  platformValues: {}
