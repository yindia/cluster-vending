apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: karpenter
spec:
  description: Karpenter node autoscaler, launching EC2 nodes with the cluster's node group role and a platform EC2NodeClass and default NodePool.
  # Installed with every cluster by the platform; not a tenant's to enable.
  management: Platform
  namespace: kube-system
  install:
    helm:
      repository: oci://public.ecr.aws/karpenter
      chart: karpenter
      # Karpenter's CRDs as templates, installed and upgraded before the main
      # chart (which then runs with skipCRDs), at the same version.
      crds:
        repository: oci://public.ecr.aws/karpenter
        chart: karpenter-crd
      companions:
      - {name: karpenter-nodeclass, repository: oci://ghcr.io/yindia/cluster-vending/charts, chart: karpenter-nodeclass}
  cloudResources:
    iamRole:
      access: IRSA
      serviceAccounts: [{namespace: kube-system, name: karpenter}]
      # Official Karpenter v1.15.1 controller policy (website/content/en/v1.15/getting-started/
      # getting-started-with-karpenter/cloudformation.yaml): NodeLifecycle + IAMIntegration + EKSIntegration
      # + ZonalShift + ResourceDiscovery statements, verbatim except placeholders. The InterruptionPolicy
      # (SQS) statement is dropped: no interruption queue exists. PassRole targets the managed node group role.
      policy: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowScopedEC2InstanceAccessActions",
              "Effect": "Allow",
              "Resource": [
                "arn:aws:ec2:${region}::image/*",
                "arn:aws:ec2:${region}::snapshot/*",
                "arn:aws:ec2:${region}:*:security-group/*",
                "arn:aws:ec2:${region}:*:subnet/*",
                "arn:aws:ec2:${region}:*:capacity-reservation/*",
                "arn:aws:ec2:${region}:*:placement-group/*"
              ],
              "Action": [
                "ec2:RunInstances",
                "ec2:CreateFleet"
              ]
            },
            {
              "Sid": "AllowScopedEC2LaunchTemplateAccessActions",
              "Effect": "Allow",
              "Resource": "arn:aws:ec2:${region}:*:launch-template/*",
              "Action": [
                "ec2:RunInstances",
                "ec2:CreateFleet"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${cluster.name}": "owned"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.sh/nodepool": "*"
                }
              }
            },
            {
              "Sid": "AllowScopedEC2InstanceActionsWithTags",
              "Effect": "Allow",
              "Resource": [
                "arn:aws:ec2:${region}:*:fleet/*",
                "arn:aws:ec2:${region}:*:instance/*",
                "arn:aws:ec2:${region}:*:volume/*",
                "arn:aws:ec2:${region}:*:network-interface/*",
                "arn:aws:ec2:${region}:*:launch-template/*",
                "arn:aws:ec2:${region}:*:spot-instances-request/*"
              ],
              "Action": [
                "ec2:RunInstances",
                "ec2:CreateFleet",
                "ec2:CreateLaunchTemplate"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:RequestTag/eks:eks-cluster-name": "${cluster.name}"
                },
                "StringLike": {
                  "aws:RequestTag/karpenter.sh/nodepool": "*"
                }
              }
            },
            {
              "Sid": "AllowScopedResourceCreationTagging",
              "Effect": "Allow",
              "Resource": [
                "arn:aws:ec2:${region}:*:fleet/*",
                "arn:aws:ec2:${region}:*:instance/*",
                "arn:aws:ec2:${region}:*:volume/*",
                "arn:aws:ec2:${region}:*:network-interface/*",
                "arn:aws:ec2:${region}:*:launch-template/*",
                "arn:aws:ec2:${region}:*:spot-instances-request/*"
              ],
              "Action": "ec2:CreateTags",
              "Condition": {
                "StringEquals": {
                  "aws:RequestTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:RequestTag/eks:eks-cluster-name": "${cluster.name}",
                  "ec2:CreateAction": [
                    "RunInstances",
                    "CreateFleet",
                    "CreateLaunchTemplate"
                  ]
                },
                "StringLike": {
                  "aws:RequestTag/karpenter.sh/nodepool": "*"
                }
              }
            },
            {
              "Sid": "AllowScopedResourceTagging",
              "Effect": "Allow",
              "Resource": "arn:aws:ec2:${region}:*:instance/*",
              "Action": "ec2:CreateTags",
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${cluster.name}": "owned"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.sh/nodepool": "*"
                },
                "StringEqualsIfExists": {
                  "aws:RequestTag/eks:eks-cluster-name": "${cluster.name}"
                },
                "ForAllValues:StringEquals": {
                  "aws:TagKeys": [
                    "eks:eks-cluster-name",
                    "karpenter.sh/nodeclaim",
                    "Name"
                  ]
                }
              }
            },
            {
              "Sid": "AllowScopedDeletion",
              "Effect": "Allow",
              "Resource": [
                "arn:aws:ec2:${region}:*:instance/*",
                "arn:aws:ec2:${region}:*:launch-template/*"
              ],
              "Action": [
                "ec2:TerminateInstances",
                "ec2:RebootInstances",
                "ec2:DeleteLaunchTemplate"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${cluster.name}": "owned"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.sh/nodepool": "*"
                }
              }
            },
            {
              "Sid": "AllowPassingInstanceRole",
              "Effect": "Allow",
              "Resource": "${cluster.nodeRoleArn}",
              "Action": "iam:PassRole",
              "Condition": {
                "StringEquals": {
                  "iam:PassedToService": [
                    "ec2.amazonaws.com",
                    "ec2.amazonaws.com.cn"
                  ]
                }
              }
            },
            {
              "Sid": "AllowScopedInstanceProfileCreationActions",
              "Effect": "Allow",
              "Resource": "arn:aws:iam::${account.id}:instance-profile/*",
              "Action": [
                "iam:CreateInstanceProfile"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:RequestTag/eks:eks-cluster-name": "${cluster.name}",
                  "aws:RequestTag/topology.kubernetes.io/region": "${region}"
                },
                "StringLike": {
                  "aws:RequestTag/karpenter.k8s.aws/ec2nodeclass": "*"
                }
              }
            },
            {
              "Sid": "AllowScopedInstanceProfileTagActions",
              "Effect": "Allow",
              "Resource": "arn:aws:iam::${account.id}:instance-profile/*",
              "Action": [
                "iam:TagInstanceProfile"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:ResourceTag/topology.kubernetes.io/region": "${region}",
                  "aws:RequestTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:RequestTag/eks:eks-cluster-name": "${cluster.name}",
                  "aws:RequestTag/topology.kubernetes.io/region": "${region}"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.k8s.aws/ec2nodeclass": "*",
                  "aws:RequestTag/karpenter.k8s.aws/ec2nodeclass": "*"
                }
              }
            },
            {
              "Sid": "AllowScopedInstanceProfileActions",
              "Effect": "Allow",
              "Resource": "arn:aws:iam::${account.id}:instance-profile/*",
              "Action": [
                "iam:AddRoleToInstanceProfile",
                "iam:RemoveRoleFromInstanceProfile",
                "iam:DeleteInstanceProfile"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:ResourceTag/topology.kubernetes.io/region": "${region}"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.k8s.aws/ec2nodeclass": "*"
                }
              }
            },
            {
              "Sid": "AllowAPIServerEndpointDiscovery",
              "Effect": "Allow",
              "Resource": "arn:aws:eks:${region}:${account.id}:cluster/${cluster.name}",
              "Action": "eks:DescribeCluster"
            },
            {
              "Sid": "AllowZonalShiftStatusReadOnly",
              "Effect": "Allow",
              "Resource": "*",
              "Action": [
                "arc-zonal-shift:GetManagedResource"
              ],
              "Condition": {
                "StringEquals": {
                  "arc-zonal-shift:ResourceIdentifier": "arn:aws:eks:${region}:${account.id}:cluster/${cluster.name}"
                }
              }
            },
            {
              "Sid": "AllowRegionalReadActions",
              "Effect": "Allow",
              "Resource": "*",
              "Action": [
                "ec2:DescribeCapacityReservations",
                "ec2:DescribeImages",
                "ec2:DescribeInstances",
                "ec2:DescribeInstanceStatus",
                "ec2:DescribeInstanceTypeOfferings",
                "ec2:DescribeInstanceTypes",
                "ec2:DescribeLaunchTemplates",
                "ec2:DescribePlacementGroups",
                "ec2:DescribeSecurityGroups",
                "ec2:DescribeSpotPriceHistory",
                "ec2:DescribeSubnets"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": "${region}"
                }
              }
            },
            {
              "Sid": "AllowSSMReadActions",
              "Effect": "Allow",
              "Resource": "arn:aws:ssm:${region}::parameter/aws/service/*",
              "Action": "ssm:GetParameter"
            },
            {
              "Sid": "AllowPricingReadActions",
              "Effect": "Allow",
              "Resource": "*",
              "Action": "pricing:GetProducts"
            },
            {
              "Sid": "AllowUnscopedInstanceProfileListAction",
              "Effect": "Allow",
              "Resource": "*",
              "Action": "iam:ListInstanceProfiles"
            },
            {
              "Sid": "AllowInstanceProfileReadActions",
              "Effect": "Allow",
              "Resource": "arn:aws:iam::${account.id}:instance-profile/*",
              "Action": "iam:GetInstanceProfile"
            }
          ]
        }
  platformValues:
    serviceAccount:
      create: true
      name: karpenter
      annotations:
        eks.amazonaws.com/role-arn: ${iam.roleArn}
    settings:
      clusterName: ${cluster.name}
      clusterEndpoint: ${cluster.endpoint}
      # No SQS queue exists; empty disables interruption handling.
      interruptionQueue: ""
    # Sizing from the official install command (1 CPU / 1Gi, requests = limits).
    controller:
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
    # The controller runs on the default node pool (with the affinity below,
    # which keeps it off the nodes Karpenter launches).
    # The cluster's default node pool: its labels, and a toleration per taint.
    nodeSelector: ${system.nodeSelector}
    tolerations: ${system.tolerations}
    # Chart default already keeps Karpenter off Karpenter-launched nodes (karpenter.sh/nodepool DoesNotExist).
    # Locked here and narrowed to EKS managed node group nodes, as the migrating-from-CAS guide recommends.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: DoesNotExist
            - key: eks.amazonaws.com/nodegroup
              operator: Exists
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
    karpenter-nodeclass:
      nodeClass:
        name: default
        role: ${cluster.nodeRoleName}
        # Pinned EKS AMI release (awslabs/amazon-eks-ami v20261107, AL2023 for
        # Kubernetes 1.33 to 1.37). al2023@latest would replace every Karpenter
        # node on each AMI release; the platform bumps this pin by publishing a
        # new version of this definition instead.
        amiAlias: al2023@v20261107
        subnetSelectorTerms:
        - tags:
            karpenter.sh/discovery: ${cluster.name}
        securityGroupSelectorTerms:
        - tags:
            aws:eks:cluster-name: ${cluster.name}
        metadataOptions:
          httpEndpoint: enabled
          httpProtocolIPv6: disabled
          httpPutResponseHopLimit: 1
          httpTokens: required
      # The default NodePool (karpenter.sh/v1) that launches nodes for pending
      # pods: on-demand amd64 Linux, c/m/r generation 3 and newer.
      nodePool:
        enabled: true
        # Upper bound on everything this pool launches.
        limits:
          cpu: "100"
          memory: 400Gi
        requirements:
          - key: kubernetes.io/arch
            operator: In
            values: ["amd64"]
          - key: kubernetes.io/os
            operator: In
            values: ["linux"]
          - key: karpenter.sh/capacity-type
            operator: In
            values: ["on-demand"]
          - key: karpenter.k8s.aws/instance-category
            operator: In
            values: ["c", "m", "r"]
          - key: karpenter.k8s.aws/instance-generation
            operator: Gt
            values: ["2"]
        disruption:
          consolidationPolicy: WhenEmptyOrUnderutilized
          consolidateAfter: 1m
          # At most 10% of the nodes disrupted at once.
          budgets:
            - nodes: "10%"
        # Nodes are replaced after 30 days (new AMIs, patches).
        expireAfter: 720h
    # Fixed by the platform at the researched defaults.
    # Controller log verbosity: debug, info or error.
    logLevel: info
