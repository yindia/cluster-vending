# The component catalog this build ships: one ComponentDefinition per file.
# The controller creates the missing ones on startup (--install-catalog); an
# existing definition is never changed, so the platform team's edits stay.
# To manage the catalog yourself instead (--install-catalog=false):
#
#   kubectl apply -k config/catalog          # after the CRDs are installed
#
# Not part of config/default: its namePrefix would rename the definitions.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- aws-load-balancer-controller.yaml
- cluster-autoscaler.yaml
- gateway-api-crds.yaml
- gpu-operator.yaml
- istio.yaml
- istio-base.yaml
- istio-cni.yaml
- istio-ingress-gateway.yaml
- istiod.yaml
- karpenter.yaml
- kyverno.yaml
- kyverno-policies.yaml
- ztunnel.yaml
