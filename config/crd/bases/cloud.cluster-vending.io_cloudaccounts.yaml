---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: cloudaccounts.cloud.cluster-vending.io
spec:
  group: cloud.cluster-vending.io
  names:
    categories:
    - cluster-vending
    kind: CloudAccount
    listKind: CloudAccountList
    plural: cloudaccounts
    shortNames:
    - cvacct
    - cvaccount
    singular: cloudaccount
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.aws.accountID
      name: Account
      type: string
    - jsonPath: .status.networks
      name: Networks
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CloudAccount is a cloud account of a tenant (the tenant is the
          namespace). It owns the Networks created in it, and through them their
          Clusters: one account has many networks and clusters. It is not deleted
          while it owns a Network (CloudAccountFinalizer).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CloudAccount
            properties:
              accountName:
                description: |-
                  accountName is the account's human-readable name (AWS account name).
                  Informational only; not unique.
                maxLength: 128
                type: string
              aws:
                description: aws is set for an AWS account.
                properties:
                  accountID:
                    description: accountID is the 12-digit AWS account ID. Immutable.
                    pattern: ^[0-9]{12}$
                    type: string
                    x-kubernetes-validations:
                    - message: accountID is immutable
                      rule: self == oldSelf
                  role:
                    description: |-
                      role is the name (no path) of the IAM role the platform assumes in
                      the account, e.g. "cluster-vending-provisioner". The tenant creates
                      it, trusting the platform's management role. Empty until the account
                      is bootstrapped.
                    pattern: ^[\w+=,.@-]{1,64}$
                    type: string
                required:
                - accountID
                type: object
            type: object
            x-kubernetes-validations:
            - message: 'exactly one provider must be set: aws'
              rule: has(self.aws)
          status:
            description: status defines the observed state of CloudAccount
            properties:
              access:
                description: |-
                  access is the controller's last check that it can reach and act in
                  the account: the tenant role in every region the account's networks
                  use, and the calls the platform needs (docs/architecture.md#aws-access-and-accounts).
                properties:
                  attemptedAt:
                    description: |-
                      attemptedAt is the last check tried; later than checkedAt when it
                      failed for a transient reason.
                    format: date-time
                    type: string
                  checkedAt:
                    description: checkedAt is the last check that gave a verdict.
                    format: date-time
                    type: string
                  checks:
                    description: 'checks: each call of the check, per region.'
                    items:
                      description: |-
                        AccessResult is one region's or call's outcome; action is empty for a
                        region.
                      properties:
                        action:
                          type: string
                        message:
                          type: string
                        ok:
                          type: boolean
                        reason:
                          type: string
                        region:
                          type: string
                      required:
                      - ok
                      - region
                      type: object
                    maxItems: 200
                    type: array
                  message:
                    type: string
                  principalARN:
                    description: principalARN is who the calls were made as.
                    type: string
                  reason:
                    description: reason and message say what failed first.
                    type: string
                  regions:
                    description: 'regions: whether the tenant role could be used in
                      each region.'
                    items:
                      description: |-
                        AccessResult is one region's or call's outcome; action is empty for a
                        region.
                      properties:
                        action:
                          type: string
                        message:
                          type: string
                        ok:
                          type: boolean
                        reason:
                          type: string
                        region:
                          type: string
                      required:
                      - ok
                      - region
                      type: object
                    maxItems: 40
                    type: array
                  stale:
                    description: |-
                      stale: the last attempt failed transiently (throttling, the
                      network); verified and the results are from checkedAt.
                    type: boolean
                  verified:
                    description: 'verified: every region and check passed when last
                      checked.'
                    type: boolean
                required:
                - verified
                type: object
              conditions:
                description: 'conditions: Ready and Synced.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              identity:
                description: |-
                  identity is what the provider credential assumes in the account (AWS:
                  the role ARN).
                type: string
              inventory:
                description: |-
                  inventory lists the objects created for the account itself (its
                  ProviderConfig), in creation order.
                items:
                  description: |-
                    InventoryEntry is one Crossplane object the owner has in the management
                    cluster.
                  properties:
                    apiVersion:
                      description: apiVersion of the object.
                      type: string
                    carriedOver:
                      description: |-
                        carriedOver marks an object that came with an import and that no spec
                        field describes: it is never removed when the owner is rendered
                        again, and is deleted with the owner.
                      type: boolean
                    externalName:
                      description: |-
                        externalName is the cloud identifier of the resource the object
                        stands for (crossplane.io/external-name): what a rebuilt management
                        cluster needs to adopt the resource instead of creating a new one.
                        Empty until the provider created the resource.
                      type: string
                    goneAt:
                      description: |-
                        goneAt is when the object was first seen gone from the management
                        cluster after its owner's deletion was requested.
                      format: date-time
                      type: string
                    kind:
                      description: kind of the object.
                      type: string
                    name:
                      description: name of the object.
                      type: string
                    namespace:
                      description: |-
                        namespace of the object. Empty for a cluster-scoped object (the
                        tenant's namespace itself, recorded for its account).
                      type: string
                    recordedAt:
                      description: |-
                        recordedAt is when the object was first recorded as the owner's. An
                        object recorded a moment ago and not in the management cluster yet
                        is being created, not missing.
                      format: date-time
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              networks:
                description: |-
                  networks counts the Networks the account owns. The account cannot be
                  deleted while it is not zero.
                format: int32
                type: integer
              observedGeneration:
                description: observedGeneration is the generation the status reflects.
                format: int64
                type: integer
              phase:
                description: phase is the coarse state.
                enum:
                - Bootstrapping
                - Ready
                - Deleting
                - Failed
                type: string
              providerConfigName:
                description: |-
                  providerConfigName is the name of the account's provider credential
                  (AWS: the ProviderConfig) in this namespace: generated on the first
                  bootstrap, then fixed. The Crossplane objects of every network and
                  cluster of the account reference it.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
