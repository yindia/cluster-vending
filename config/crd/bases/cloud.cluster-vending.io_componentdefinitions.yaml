---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: componentdefinitions.cloud.cluster-vending.io
spec:
  group: cloud.cluster-vending.io
  names:
    kind: ComponentDefinition
    listKind: ComponentDefinitionList
    plural: componentdefinitions
    shortNames:
    - cvcompdef
    singular: componentdefinition
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.requires
      name: Requires
      type: string
    - jsonPath: .spec.cloudResources.iamRole.access
      name: IAM
      type: string
    - jsonPath: .spec.disabled
      name: Disabled
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ComponentDefinition is an operator-owned catalog entry: what a tenant
          may enable and how the platform installs it. Written by release-admin.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComponentDefinitionSpec is one entry of the catalog.
            properties:
              cloudResources:
                description: |-
                  cloudResources is what the platform creates in the tenant's account
                  for the component before installing it: an IAM role so far. Unset:
                  none.
                properties:
                  iamRole:
                    description: iamRole for the component's service accounts.
                    properties:
                      access:
                        default: IRSA
                        description: access is how the component's pods get the role.
                          Defaults to IRSA.
                        enum:
                        - IRSA
                        - PodIdentity
                        type: string
                      managedPolicyArns:
                        description: |-
                          managedPolicyArns are existing policies attached to the role: AWS
                          managed ones, or policies of the tenant account (account.id).
                        items:
                          pattern: ^arn:aws(-cn|-us-gov)?:iam::(aws|[0-9]{12}|\$\{account\.id\}):policy/[A-Za-z0-9+=,.@/_-]{1,512}$
                          type: string
                        maxItems: 10
                        type: array
                        x-kubernetes-list-type: set
                      policy:
                        description: |-
                          policy is an IAM policy document (JSON) the platform creates and
                          attaches to the role. It may use the placeholders of the definition
                          (account.id, cluster.name, ...), filled in per cluster; the iam.*
                          ones, which name this role and policy, are not available in it.
                          AWS limits a managed policy to 6144 characters without whitespace,
                          which the controller checks (condition Valid); the field allows more,
                          for the indentation of a readable document.
                        maxLength: 20480
                        type: string
                      serviceAccounts:
                        description: serviceAccounts that may use the role.
                        items:
                          description: |-
                            ComponentServiceAccount is a service account of the component in the
                            workload cluster.
                          properties:
                            name:
                              description: name of the service account.
                              maxLength: 253
                              pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                              type: string
                            namespace:
                              description: namespace of the service account.
                              pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                              type: string
                          required:
                          - name
                          - namespace
                          type: object
                        maxItems: 8
                        minItems: 1
                        type: array
                        x-kubernetes-list-map-keys:
                        - namespace
                        - name
                        x-kubernetes-list-type: map
                    required:
                    - serviceAccounts
                    type: object
                    x-kubernetes-validations:
                    - message: iamRole needs a policy or managedPolicyArns
                      rule: (has(self.policy) && size(self.policy) > 0) || (has(self.managedPolicyArns)
                        && size(self.managedPolicyArns) > 0)
                    - message: 'an IAM role takes at most 10 policies: the policy
                        and managedPolicyArns together'
                      rule: '(has(self.managedPolicyArns) ? size(self.managedPolicyArns)
                        : 0) + (has(self.policy) && size(self.policy) > 0 ? 1 : 0)
                        <= 10'
                type: object
              conflictsWithAddons:
                description: |-
                  conflictsWithAddons lists EKS add-ons the cluster must not have in
                  spec.aws.addons while this component is enabled. The names are the
                  add-ons AWSAddon.name accepts.
                items:
                  enum:
                  - vpc-cni
                  - coredns
                  - kube-proxy
                  - eks-pod-identity-agent
                  - aws-ebs-csi-driver
                  - aws-efs-csi-driver
                  - aws-fsx-csi-driver
                  - aws-mountpoint-s3-csi-driver
                  - snapshot-controller
                  - cert-manager
                  - metrics-server
                  - kube-state-metrics
                  type: string
                type: array
                x-kubernetes-list-type: set
              description:
                description: description shown to tenants.
                maxLength: 1024
                minLength: 1
                type: string
              disabled:
                description: |-
                  disabled switches the component off without deleting its definition:
                  a Platform component is not installed (clusters that have it remove
                  it), and a Tenant one cannot be enabled. What requires it, and the
                  members of a disabled bundle, are off with it. The platform team's
                  to set: a new build keeps it when it updates a shipped definition.
                type: boolean
              includes:
                description: |-
                  includes makes the definition a bundle: one component made of
                  several charts, each a definition of its own (internal: true) with
                  its chart, namespace, version pin and requires. Enabling the bundle
                  installs every member in requires order, each once the one before
                  is Ready; disabling removes them in reverse; the bundle is Ready
                  when every member is. A release that offers a bundle pins every
                  member. A bundle is not a member of another bundle.
                items:
                  pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                  type: string
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              install:
                description: |-
                  install is how the component reaches a workload cluster. Opaque to
                  tenants: the API never returns it. Exactly one of install and
                  includes is set.
                properties:
                  helm:
                    description: helm installs the component with provider-helm.
                    properties:
                      chart:
                        description: chart name in the repository (provider-helm forProvider.chart.name).
                        maxLength: 128
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9_.]*[a-z0-9])?$
                        type: string
                      companions:
                        description: |-
                          companions are charts the platform owns, installed in order after the
                          main chart is Ready (e.g. Karpenter's default node class).
                        items:
                          description: |-
                            HelmCompanion is a chart the platform owns, installed after the main
                            chart is Ready.
                          properties:
                            chart:
                              description: chart name in the repository (provider-helm
                                forProvider.chart.name).
                              maxLength: 128
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9_.]*[a-z0-9])?$
                              type: string
                            credentials:
                              description: 'credentials for a private repository.
                                Unset: a public one.'
                              properties:
                                secretRef:
                                  description: secretRef is the Secret holding them.
                                  properties:
                                    name:
                                      description: name of the Secret.
                                      maxLength: 253
                                      minLength: 1
                                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                                      type: string
                                    namespace:
                                      description: |-
                                        namespace of the Secret: the platform's own namespace, where the
                                        operator creates it. Never a tenant namespace.
                                      minLength: 1
                                      pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                                      type: string
                                  required:
                                  - name
                                  - namespace
                                  type: object
                                type:
                                  description: type of the Secret.
                                  enum:
                                  - BasicAuth
                                  - DockerConfigJSON
                                  type: string
                              required:
                              - secretRef
                              - type
                              type: object
                            insecureSkipTLSVerify:
                              description: |-
                                insecureSkipTLSVerify skips the check of the repository's TLS
                                certificate (provider-helm forProvider.insecureSkipTLSVerify). For
                                test registries only.
                              type: boolean
                            name:
                              description: name of the companion's Helm release.
                              pattern: ^[a-z0-9]([-a-z0-9]{0,51}[a-z0-9])?$
                              type: string
                            plainHTTP:
                              description: |-
                                plainHTTP fetches the chart over HTTP (provider-helm
                                forProvider.plainHTTP), oci:// only. For test registries only.
                              type: boolean
                            repository:
                              description: |-
                                repository is an https:// Helm repository URL or an oci:// registry
                                path (provider-helm forProvider.chart.repository).
                              maxLength: 512
                              pattern: ^(https|oci)://[^ ]+$
                              type: string
                          required:
                          - chart
                          - name
                          - repository
                          type: object
                          x-kubernetes-validations:
                          - message: plainHTTP is for oci:// registries
                            rule: '!has(self.plainHTTP) || !self.plainHTTP || self.repository.startsWith(''oci://'')'
                        maxItems: 8
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      crds:
                        description: |-
                          crds is a chart that holds only the component's
                          CustomResourceDefinitions, as templates (so Helm upgrades them; Helm
                          installs a chart's crds/ directory once and never upgrades it). It is
                          installed, and upgraded, before the main chart, at the same version
                          the release pins for the component; the main chart then runs with
                          skipCRDs (provider-helm Release forProvider.skipCRDs). It gets no
                          values. Unset: the main chart's own CRDs, if any, which are never
                          upgraded.
                        properties:
                          chart:
                            description: chart name in the repository (provider-helm
                              forProvider.chart.name).
                            maxLength: 128
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9_.]*[a-z0-9])?$
                            type: string
                          credentials:
                            description: 'credentials for a private repository. Unset:
                              a public one.'
                            properties:
                              secretRef:
                                description: secretRef is the Secret holding them.
                                properties:
                                  name:
                                    description: name of the Secret.
                                    maxLength: 253
                                    minLength: 1
                                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                                    type: string
                                  namespace:
                                    description: |-
                                      namespace of the Secret: the platform's own namespace, where the
                                      operator creates it. Never a tenant namespace.
                                    minLength: 1
                                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                                    type: string
                                required:
                                - name
                                - namespace
                                type: object
                              type:
                                description: type of the Secret.
                                enum:
                                - BasicAuth
                                - DockerConfigJSON
                                type: string
                            required:
                            - secretRef
                            - type
                            type: object
                          insecureSkipTLSVerify:
                            description: |-
                              insecureSkipTLSVerify skips the check of the repository's TLS
                              certificate (provider-helm forProvider.insecureSkipTLSVerify). For
                              test registries only.
                            type: boolean
                          plainHTTP:
                            description: |-
                              plainHTTP fetches the chart over HTTP (provider-helm
                              forProvider.plainHTTP), oci:// only. For test registries only.
                            type: boolean
                          repository:
                            description: |-
                              repository is an https:// Helm repository URL or an oci:// registry
                              path (provider-helm forProvider.chart.repository).
                            maxLength: 512
                            pattern: ^(https|oci)://[^ ]+$
                            type: string
                        required:
                        - chart
                        - repository
                        type: object
                        x-kubernetes-validations:
                        - message: plainHTTP is for oci:// registries
                          rule: '!has(self.plainHTTP) || !self.plainHTTP || self.repository.startsWith(''oci://'')'
                      credentials:
                        description: 'credentials for a private repository. Unset:
                          a public one.'
                        properties:
                          secretRef:
                            description: secretRef is the Secret holding them.
                            properties:
                              name:
                                description: name of the Secret.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                                type: string
                              namespace:
                                description: |-
                                  namespace of the Secret: the platform's own namespace, where the
                                  operator creates it. Never a tenant namespace.
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                                type: string
                            required:
                            - name
                            - namespace
                            type: object
                          type:
                            description: type of the Secret.
                            enum:
                            - BasicAuth
                            - DockerConfigJSON
                            type: string
                        required:
                        - secretRef
                        - type
                        type: object
                      insecureSkipTLSVerify:
                        description: |-
                          insecureSkipTLSVerify skips the check of the repository's TLS
                          certificate (provider-helm forProvider.insecureSkipTLSVerify). For
                          test registries only.
                        type: boolean
                      plainHTTP:
                        description: |-
                          plainHTTP fetches the chart over HTTP (provider-helm
                          forProvider.plainHTTP), oci:// only. For test registries only.
                        type: boolean
                      repository:
                        description: |-
                          repository is an https:// Helm repository URL or an oci:// registry
                          path (provider-helm forProvider.chart.repository).
                        maxLength: 512
                        pattern: ^(https|oci)://[^ ]+$
                        type: string
                    required:
                    - chart
                    - repository
                    type: object
                    x-kubernetes-validations:
                    - message: plainHTTP is for oci:// registries
                      rule: '!has(self.plainHTTP) || !self.plainHTTP || self.repository.startsWith(''oci://'')'
                type: object
                x-kubernetes-validations:
                - message: helm is the only install mechanism so far
                  rule: has(self.helm)
              internal:
                description: |-
                  internal marks a definition that is only installed as a member of a
                  bundle (includes): tenants cannot enable it by itself, and the
                  catalog they see does not list it.
                type: boolean
              management:
                default: Tenant
                description: |-
                  management says who controls the component. Platform: installed
                  with every cluster by the cluster's own reconcile, once the cluster
                  can be reached, with fixed values; no Component object exists for
                  it and the Component API refuses its name. Tenant (the default): a
                  tenant enables and disables it on a cluster (a Component).
                enum:
                - Platform
                - Tenant
                type: string
              namespace:
                description: |-
                  namespace in the workload cluster. Required with install; a bundle
                  has none (its members have theirs).
                pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                type: string
              platformValues:
                description: |-
                  platformValues are set by the platform team for every tenant, and
                  locked: every leaf path in them wins over the tenant's values, and
                  an enable or update whose overrides touch one is refused, naming the
                  path. Tenants never see them in the values file. Strings may use the
                  placeholders (${cluster.name}, ${iam.roleArn}, ...), filled in per
                  cluster by the controller.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              provider:
                default: aws
                description: |-
                  provider is the cloud the component is installed on: a cluster of
                  another provider never gets it, and a tenant cannot enable it there.
                  Every definition is for one cloud; the same component for another
                  cloud is another definition, named <name>-<provider> (kyverno-gcp).
                  Immutable. Defaults to aws, the cloud every definition was for
                  before this field: one stored without it reads as aws, so it stays
                  valid and nothing is uninstalled.
                enum:
                - aws
                - gcp
                - azure
                type: string
                x-kubernetes-validations:
                - message: provider is immutable; a definition for another cloud is
                    another definition
                  rule: self == oldSelf
              requires:
                description: requires lists other components that must be Ready first.
                items:
                  pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              upgradeOneMinorAtATime:
                description: |-
                  upgradeOneMinorAtATime: the component supports in-place upgrades of
                  one minor version at a time only (Istio). A channel does not move to
                  a release whose pin skips a minor of the component relative to the
                  release the channel offers now.
                type: boolean
              userValues:
                description: |-
                  userValues is the starting values file tenants pull (cluster-vending
                  component values <name>), edit and send with enable/update; only keys
                  a tenant may change. YAML kept as written, so the platform team's
                  comments survive as they do in a chart's values.yaml. The definition
                  is Valid only when it parses into an object, shares no path with
                  platformValues (neither the same leaf nor one inside the other) and
                  validates against valuesSchema. A tenant's keys equal to the file's
                  are not stored (pkg/component PruneUnchanged), so a later change to
                  the file reaches tenants who did not edit that key.
                maxLength: 65536
                type: string
              valuesSchema:
                description: |-
                  valuesSchema is a JSON Schema, written by the platform team, of what
                  a tenant may override; userValues must validate against it too.
                  Unset: no overrides are accepted (and userValues must be empty).
                type: object
                x-kubernetes-preserve-unknown-fields: true
              versionGroup:
                description: |-
                  versionGroup names components that are versions of one product (the
                  Istio charts, Kyverno and its policies): a release must pin every
                  member it pins, on each Kubernetes minor, at the same version. Unset:
                  none.
                pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                type: string
            required:
            - description
            - provider
            type: object
            x-kubernetes-validations:
            - message: exactly one of install and includes is set
              rule: has(self.install) != has(self.includes)
            - message: namespace is required with install
              rule: '!has(self.install) || has(self.__namespace__)'
            - message: 'a bundle (includes) is not internal: bundles do not nest'
              rule: '!has(self.includes) || !has(self.internal) || !self.internal'
          status:
            description: ComponentDefinitionStatus is written by the controller.
            properties:
              conditions:
                description: 'Conditions: Valid.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  describes.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a component definition is named as a DNS label
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$')
        - message: a component cannot require itself
          rule: '!has(self.spec.requires) || !(self.metadata.name in self.spec.requires)'
    served: true
    storage: true
    subresources:
      status: {}
