---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: components.cloud.cluster-vending.io
spec:
  group: cloud.cluster-vending.io
  names:
    kind: Component
    listKind: ComponentList
    plural: components
    shortNames:
    - cvcomp
    singular: component
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.cluster
      name: Cluster
      type: string
    - jsonPath: .spec.component
      name: Component
      type: string
    - jsonPath: .status.installedVersion
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Component is one catalog component enabled on one cluster of a tenant.
          It lives in the tenant namespace and is named <cluster name>-<component>.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'ComponentSpec is what a tenant asks for: one component on
              one cluster.'
            properties:
              clusterID:
                description: |-
                  clusterID is the cluster the component is installed into: the API's
                  Cluster.id. The object is owned by that Cluster.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
              component:
                description: component is the ComponentDefinition name, e.g. karpenter.
                pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                type: string
              values:
                description: |-
                  values are the tenant's overrides only, a JSON object of at most
                  64 KiB: what differs from the definition's userValues file. The
                  definition's platformValues and computed values are never copied
                  here, and may not be set. Not for secrets.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              version:
                description: |-
                  version pins a version on a manual cluster. Unset: the version the
                  release that applies to the cluster gives its Kubernetes minor.
                maxLength: 64
                type: string
            required:
            - clusterID
            - component
            type: object
            x-kubernetes-validations:
            - message: clusterID is immutable
              rule: self.clusterID == oldSelf.clusterID
            - message: component is immutable
              rule: self.component == oldSelf.component
          status:
            description: ComponentStatus is written by the controller only.
            properties:
              chart:
                description: |-
                  chart is the Helm release the phase is about, while the component
                  is not Ready.
                type: string
              cluster:
                description: |-
                  cluster is the cluster's name, resolved from spec.clusterID, for
                  people.
                type: string
              conditions:
                description: |-
                  Conditions: Valid (the request's checks hold now), Synced (the
                  platform's objects are applied), Ready (installed and healthy as far
                  as the install mechanism reports).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveValues:
                description: |-
                  effectiveValues are the merged values that were applied, with
                  platform-computed keys included and no secrets.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              failures:
                description: failures are its failed attempts in a row.
                format: int32
                type: integer
              helmState:
                description: |-
                  helmState is Helm's state of that release: deployed, failed,
                  uninstalling, pending-install, ...
                type: string
              installedVersion:
                description: installedVersion is what runs.
                type: string
              inventory:
                description: |-
                  inventory lists the objects the platform has for this component, in
                  creation order.
                items:
                  description: |-
                    InventoryEntry is one Crossplane object the owner has in the management
                    cluster.
                  properties:
                    apiVersion:
                      description: apiVersion of the object.
                      type: string
                    carriedOver:
                      description: |-
                        carriedOver marks an object that came with an import and that no spec
                        field describes: it is never removed when the owner is rendered
                        again, and is deleted with the owner.
                      type: boolean
                    externalName:
                      description: |-
                        externalName is the cloud identifier of the resource the object
                        stands for (crossplane.io/external-name): what a rebuilt management
                        cluster needs to adopt the resource instead of creating a new one.
                        Empty until the provider created the resource.
                      type: string
                    goneAt:
                      description: |-
                        goneAt is when the object was first seen gone from the management
                        cluster after its owner's deletion was requested.
                      format: date-time
                      type: string
                    kind:
                      description: kind of the object.
                      type: string
                    name:
                      description: name of the object.
                      type: string
                    namespace:
                      description: |-
                        namespace of the object. Empty for a cluster-scoped object (the
                        tenant's namespace itself, recorded for its account).
                      type: string
                    recordedAt:
                      description: |-
                        recordedAt is when the object was first recorded as the owner's. An
                        object recorded a moment ago and not in the management cluster yet
                        is being created, not missing.
                      format: date-time
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              lastError:
                description: lastError is the install mechanism's last error for that
                  release.
                type: string
              message:
                description: message explains the phase when it is not Ready.
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  describes.
                format: int64
                type: integer
              phase:
                description: 'phase: Pending, Installing, Ready, Degraded, Failed,
                  Deleting.'
                enum:
                - Pending
                - Installing
                - Ready
                - Degraded
                - Failed
                - Deleting
                type: string
              recoveries:
                description: |-
                  recoveries is how many times a stuck Helm release of the component
                  was recovered at this version.
                format: int32
                type: integer
              release:
                description: release the version came from (empty for a pinned version).
                type: string
              since:
                description: since is when the component entered its phase.
                format: date-time
                type: string
              targetVersion:
                description: targetVersion is what it is moving to.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a component is named <cluster name>-<component>
          rule: self.metadata.name.endsWith('-' + self.spec.component)
    served: true
    storage: true
    subresources:
      status: {}
