---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: releasechannels.cloud.cluster-vending.io
spec:
  group: cloud.cluster-vending.io
  names:
    kind: ReleaseChannel
    listKind: ReleaseChannelList
    plural: releasechannels
    shortNames:
    - cvch
    singular: releasechannel
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.release
      name: Release
      type: string
    - jsonPath: .status.kubernetesMinor
      name: Kubernetes
      type: string
    - jsonPath: .spec.promotion
      name: Promotion
      type: string
    - jsonPath: .spec.paused
      name: Paused
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Offering")].status
      name: Offering
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ReleaseChannel says which release a channel (alpha, beta, stable)
          offers and how it rolls out. Beta follows alpha and stable follows beta.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReleaseChannelSpec is the operator's settings for one channel.
            properties:
              paused:
                description: 'Paused: no cluster starts a new release; clusters in
                  progress finish.'
                type: boolean
              policy:
                description: Policy of the rollout through the channel's tiers.
                properties:
                  maxFailed:
                    default: 1
                    description: MaxFailed failures in a tier before the channel halts.
                    format: int32
                    minimum: 0
                    type: integer
                  maxInProgress:
                    default: 5
                    description: 'MaxInProgress clusters applying at once per tier
                      (Tier0: always 1).'
                    format: int32
                    minimum: 1
                    type: integer
                  soak:
                    default: 24h
                    description: Soak is the healthy time after a tier before the
                      next one starts.
                    type: string
                  soakPerTier:
                    additionalProperties:
                      type: string
                    description: SoakPerTier overrides Soak for a tier (Tier0, Tier1,
                      Tier2).
                    maxProperties: 3
                    type: object
                type: object
              promotion:
                default: Automatic
                description: |-
                  Promotion: Automatic takes each release the upstream channel
                  completed; Manual and Pinned offer spec.release.
                enum:
                - Automatic
                - Manual
                - Pinned
                type: string
              release:
                description: Release offered by a Manual or Pinned channel.
                pattern: ^([0-9]{4}-[0-9]{2}-[a-z]|shipped-[0-9a-f]{8})$
                type: string
            type: object
            x-kubernetes-validations:
            - message: spec.release is the release of a Pinned or Manual channel;
                an Automatic channel takes its upstream's
              rule: '!has(self.release) || self.promotion != ''Automatic'''
            - message: a Pinned or Manual channel names its spec.release
              rule: self.promotion == 'Automatic' || has(self.release)
          status:
            description: ReleaseChannelStatus is written by the controller.
            properties:
              conditions:
                description: 'Conditions: Offering.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              history:
                description: 'History: the releases the channel offered, newest first,
                  at most 20.'
                items:
                  description: ChannelHistoryEntry is one release a channel offered.
                  properties:
                    from:
                      description: From is when the channel started offering it.
                      format: date-time
                      type: string
                    reason:
                      description: Reason the channel offered it (promotion, pinned).
                      type: string
                    release:
                      type: string
                    to:
                      description: To is when it stopped; unset for the release offered
                        now.
                      format: date-time
                      type: string
                  required:
                  - from
                  - release
                  type: object
                maxItems: 20
                type: array
              kubernetesMinor:
                description: |-
                  KubernetesMinor is the minor that release puts on this channel: the
                  minor its automatic clusters run. Empty when it puts none.
                type: string
              release:
                description: |-
                  Release the channel offers now: spec.release, or for an Automatic
                  channel the release its upstream offers (until rollouts exist, a
                  release counts as completed upstream as soon as the upstream offers
                  it).
                type: string
              stage:
                description: 'Stage is the tier being rolled out (rollouts: later).'
                enum:
                - Tier0
                - Tier1
                - Tier2
                type: string
              tiers:
                description: 'Tiers is the progress per tier (rollouts: later).'
                items:
                  description: TierStatus is the progress of the offered release in
                    one tier.
                  properties:
                    completedAt:
                      format: date-time
                      type: string
                    done:
                      format: int32
                      type: integer
                    failed:
                      format: int32
                      type: integer
                    held:
                      format: int32
                      type: integer
                    inProgress:
                      format: int32
                      type: integer
                    tier:
                      description: |-
                        ClusterTier is how sensitive a cluster is. Within a release channel a
                        release reaches Tier2 clusters first, then Tier1, then Tier0. Stored
                        only for now: nothing acts on it yet.
                      enum:
                      - Tier0
                      - Tier1
                      - Tier2
                      type: string
                    total:
                      format: int32
                      type: integer
                  required:
                  - tier
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: channels are alpha, beta and stable
          rule: self.metadata.name in ['alpha', 'beta', 'stable']
        - message: 'alpha has no upstream channel: it is Pinned or Manual to a release'
          rule: self.metadata.name != 'alpha' || self.spec.promotion != 'Automatic'
    served: true
    storage: true
    subresources:
      status: {}
