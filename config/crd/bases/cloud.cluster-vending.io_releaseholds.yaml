---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: releaseholds.cloud.cluster-vending.io
spec:
  group: cloud.cluster-vending.io
  names:
    kind: ReleaseHold
    listKind: ReleaseHoldList
    plural: releaseholds
    shortNames:
    - cvhold
    singular: releasehold
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterID
      name: Cluster-ID
      type: string
    - jsonPath: .spec.tenantID
      name: Tenant
      type: string
    - jsonPath: .spec.channel
      name: Channel
      type: string
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .status.clusters
      name: Clusters
      type: integer
    - jsonPath: .status.name
      name: Cluster
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .spec.release
      name: Release
      type: string
    - jsonPath: .spec.until
      name: Until
      type: date
    - jsonPath: .status.conditions[?(@.type=="Resolved")].status
      name: Resolved
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ReleaseHold keeps clusters out of rollouts: one cluster on a named
          release (a lock) or where it is (a freeze), or a tenant's or a channel's
          clusters where they are. Only the operator holds a cluster; users see it
          as a pause of upgrades (admin pause --only upgrades).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ReleaseHoldSpec keeps clusters out of rollouts (AdminService.PauseReconcile
              with only_upgrades): one cluster, a tenant's clusters, or a release
              channel's (every tier, or one). Exactly one of clusterID, tenantID and
              channel is set; tier only with channel.
            properties:
              by:
                description: By is who asked for it (AdminService.PauseReconcile sets
                  it).
                maxLength: 256
                type: string
              channel:
                description: |-
                  Channel holds every cluster on the release channel (alpha, beta,
                  stable), those that join it later too; with Tier, only that tier's.
                enum:
                - alpha
                - beta
                - stable
                type: string
                x-kubernetes-validations:
                - message: channel is immutable; create another hold
                  rule: self == oldSelf
              clusterID:
                description: ClusterID is the held cluster's ID (the API's Cluster.id).
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
                x-kubernetes-validations:
                - message: clusterID is immutable; create another hold
                  rule: self == oldSelf
              reason:
                description: Reason, shown on the cluster's status.
                maxLength: 512
                minLength: 1
                type: string
              release:
                description: |-
                  Release, when set, keeps the cluster on exactly this release (a
                  lock); unset, the cluster stays on what it has now (a freeze).
                pattern: ^([0-9]{4}-[0-9]{2}-[a-z]|shipped-[0-9a-f]{8})$
                type: string
              tenantID:
                description: TenantID holds every cluster of the tenant, those created
                  later too.
                pattern: ^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: tenantID is immutable; create another hold
                  rule: self == oldSelf
              tier:
                description: Tier narrows Channel to one tier.
                enum:
                - Tier0
                - Tier1
                - Tier2
                type: string
                x-kubernetes-validations:
                - message: tier is immutable; create another hold
                  rule: self == oldSelf
              until:
                description: Until, when set, ends the hold by itself.
                format: date-time
                type: string
            required:
            - reason
            type: object
            x-kubernetes-validations:
            - message: set exactly one of clusterID, tenantID and channel
              rule: '[has(self.clusterID), has(self.tenantID), has(self.channel)].filter(x,
                x).size() == 1'
            - message: tier needs channel
              rule: '!has(self.tier) || has(self.channel)'
          status:
            description: ReleaseHoldStatus is written by the controller.
            properties:
              clusters:
                description: Clusters is how many clusters the hold matches now.
                format: int32
                type: integer
              conditions:
                description: 'Conditions: Resolved.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              name:
                type: string
              namespace:
                description: |-
                  Namespace and Name of the Cluster object the ID resolved to (for
                  people; the hold follows the ID). Empty for a hold of a tenant or a
                  channel.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
