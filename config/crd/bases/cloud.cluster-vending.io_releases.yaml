---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: releases.cloud.cluster-vending.io
spec:
  group: cloud.cluster-vending.io
  names:
    kind: Release
    listKind: ReleaseList
    plural: releases
    shortNames:
    - cvrel
    singular: release
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.content.renderVersion
      name: Render
      type: integer
    - jsonPath: .spec.withdrawn
      name: Withdrawn
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    - jsonPath: .status.channels
      name: Channels
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Release locks what clusters run: the renderer version and, per supported
          Kubernetes minor, the components the platform installs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReleaseSpec is a published release.
            properties:
              content:
                description: |-
                  Content is what the release locks: immutable, publish a new release
                  to change a version.
                properties:
                  kubernetes:
                    description: |-
                      Kubernetes: the supported minors, consecutive: one per channel, and
                      those still supported on no channel.
                    items:
                      description: KubernetesRelease is what clusters on one supported
                        Kubernetes minor run.
                      properties:
                        channel:
                          description: |-
                            Channel is the channel whose clusters run this minor. A release puts
                            either no minor on a channel, or exactly one on each of alpha, beta
                            and stable, alpha's the newest. A minor on no channel is still
                            supported; its users are warned to move off it. Unset: none.
                          enum:
                          - alpha
                          - beta
                          - stable
                          type: string
                        components:
                          description: Components the platform installs on this minor,
                            at these versions.
                          items:
                            description: |-
                              ComponentPin is one component the platform installs itself (Helm or
                              Argo CD) at a fixed version, on one Kubernetes minor.
                            properties:
                              name:
                                description: Name of the component.
                                pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                                type: string
                              values:
                                description: |-
                                  values are Helm values the release sets for the component on this
                                  Kubernetes minor (cluster-autoscaler's image tag follows the
                                  minor). They are merged over the definition's platformValues and
                                  locked the same way: a tenant who touches one of their paths is
                                  refused. Placeholders are allowed. Unset: none.
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                              version:
                                description: |-
                                  Version installed, e.g. the chart version. A component's CRD chart
                                  (ComponentDefinition install.helm.crds) is installed at this version
                                  too: there is no separate pin.
                                maxLength: 64
                                minLength: 1
                                type: string
                            required:
                            - name
                            - version
                            type: object
                          maxItems: 64
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        default:
                          description: |-
                            Default marks the minor a new cluster on no channel gets when it
                            names none. A cluster on a channel gets the channel's minor.
                          type: boolean
                        endOfSupport:
                          description: EndOfSupport is when this minor stops being
                            supported.
                          format: date-time
                          type: string
                        minor:
                          description: Minor, e.g. "1.37".
                          pattern: ^1\.[0-9]{2}$
                          type: string
                        upgradeTo:
                          description: |-
                            UpgradeTo moves automatic clusters on this minor to the next one
                            (one minor at a time). Unset: they stay.
                          pattern: ^1\.[0-9]{2}$
                          type: string
                      required:
                      - endOfSupport
                      - minor
                      type: object
                    maxItems: 6
                    minItems: 3
                    type: array
                    x-kubernetes-list-map-keys:
                    - minor
                    x-kubernetes-list-type: map
                  renderVersion:
                    description: |-
                      RenderVersion is the renderer version clusters are brought to
                      (crossplaneaws.RenderVersion); not newer than the controller's.
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - kubernetes
                - renderVersion
                type: object
                x-kubernetes-validations:
                - message: release content is immutable; publish a new release
                  rule: self == oldSelf
                - message: exactly one minor is the default
                  rule: self.kubernetes.exists_one(k, has(k.default) && k.default)
              notes:
                description: Notes for operators and tenants.
                maxLength: 4096
                type: string
              withdrawn:
                description: 'Withdrawn: no channel may offer it any more. Cannot
                  be undone.'
                type: boolean
            required:
            - content
            type: object
            x-kubernetes-validations:
            - message: a withdrawn release stays withdrawn
              rule: '!(has(oldSelf.withdrawn) && oldSelf.withdrawn) || (has(self.withdrawn)
                && self.withdrawn)'
          status:
            description: ReleaseStatus is written by the controller.
            properties:
              channels:
                description: Channels offering the release now.
                items:
                  type: string
                type: array
              conditions:
                description: 'Conditions: Valid, InUse.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              holds:
                description: Holds naming the release (their names).
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a release is named YYYY-MM-<letter>, e.g. 2026-11-a (shipped-<8
            hex digits> is the controller's own)
          rule: self.metadata.name.matches('^([0-9]{4}-[0-9]{2}-[a-z]|shipped-[0-9a-f]{8})$')
    served: true
    storage: true
    subresources:
      status: {}
