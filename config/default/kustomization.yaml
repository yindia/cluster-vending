# The controller in the management cluster: its CRDs, RBAC and Deployment.
#
#   make deploy-manifests            # render, nothing is applied
#
# The image is the one `make docker-build` builds; set it under images:
# below or with `kustomize edit set image controller=<image>:<tag>`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The platform's own namespace.
namespace: cluster-vending-system

# Prepended to every name: the Deployment is
# cluster-vending-controller-manager.
namePrefix: cluster-vending-

resources:
- ../crd
- ../rbac
- ../manager
# [PROMETHEUS] A ServiceMonitor; needs the metrics component below and the
# Prometheus Operator's CRDs.
#- ../prometheus
# [NETWORK POLICY] Restrict the metrics port to namespaces labelled
# metrics=enabled.
#- ../network-policy

# [METRICS] Off by default, as the command's own default is. Uncomment to
# serve them (plain HTTP, unauthenticated) on :8080 behind a Service.
#components:
#- ../metrics

# [NO IRSA] For a management cluster without IRSA: the providers
# authenticate with AWS keys in a Secret you create, then assume the tenant
# roles (see ../local-credentials). Not for production.
#components:
#- ../local-credentials

# [IRSA] The controller's AWS access in production: the IAM role of its
# service account. PLACEHOLDER, replace it. The role must be allowed to
# assume the tenant roles (sts:AssumeRole), and every tenant role's trust
# policy must name it. With the management role itself here, the tenant
# roles need to trust one role only. For local testing there is no
# annotation: export AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY and run
# `cluster-vending controller` (docs/architecture.md#controller-settings).
patches:
- target:
    kind: ServiceAccount
    name: controller-manager
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/cluster-vending-controller

images:
- name: controller
  newName: ghcr.io/yindia/cluster-vending
  newTag: latest
