# Internal only: the API server is its one caller (network_policy.yaml);
# Prometheus scrapes the metrics port.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-live
    app.kubernetes.io/managed-by: kustomize
  name: live
  namespace: system
spec:
  ports:
  - name: http
    port: 8090
    protocol: TCP
    targetPort: http
  - name: metrics
    port: 8091
    protocol: TCP
    targetPort: metrics
  selector:
    app.kubernetes.io/name: cluster-vending-live
