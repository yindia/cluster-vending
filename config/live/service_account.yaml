# The live reader's identity in the management cluster. No IAM role: it makes
# no AWS call (the EKS tokens in the live kubeconfigs are minted by the
# Crossplane provider's ClusterAuth).
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-live
    app.kubernetes.io/managed-by: kustomize
  name: live
  namespace: system
