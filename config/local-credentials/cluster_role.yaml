# The controller copies the credentials Secret's key into each tenant
# namespace, next to the account's ProviderConfig (a namespaced
# ProviderConfig reads its Secret from its own namespace), and deletes the
# copy with the account. Tenant namespaces are created as accounts are
# onboarded, so this is cluster-wide. Only with this component (no IRSA);
# the base controller and server roles have no Secret access. Kept in step
# with the code by config/credentials_test.go.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-controller
    app.kubernetes.io/managed-by: kustomize
  name: provider-credentials-copier
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-controller
    app.kubernetes.io/managed-by: kustomize
  name: provider-credentials-copier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-credentials-copier
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
