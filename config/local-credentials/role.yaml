# The controller may read the one credentials Secret in its own namespace,
# the source of the copies in the tenant namespaces (cluster_role.yaml).
# Kept in step with the code by config/credentials_test.go.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-controller
    app.kubernetes.io/managed-by: kustomize
  name: provider-credentials-reader
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - aws-local-credentials
  verbs:
  - get
