# Only namespaces labelled metrics=enabled reach the metrics port (plain
# HTTP, see ../metrics). The probes port stays open: the kubelet reaches it
# from the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-controller
    app.kubernetes.io/managed-by: kustomize
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cluster-vending-controller
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          metrics: enabled
    ports:
    - port: 8080
      protocol: TCP
  - ports:
    - port: 8081
      protocol: TCP
