# The live reader's metrics port (../live: CV_LIVE_METRICS_ADDR).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: live-metrics-monitor
  namespace: system
  labels:
    app.kubernetes.io/name: cluster-vending-live
spec:
  endpoints:
  - path: /metrics
    port: metrics
    scheme: http
    interval: 30s
    scrapeTimeout: 10s
    relabelings:
    - targetLabel: cluster_vending_role
      replacement: live
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-vending-live
