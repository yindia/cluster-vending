# Prometheus Operator ServiceMonitor for the controller's metrics: plain
# HTTP on the Service of ../metrics, which must be enabled too.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cluster-vending-controller
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
  - path: /metrics
    port: metrics
    scheme: http
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cluster-vending-controller
