# Get on Secrets, bound to nothing here. The controller binds itself to
# this role in each tenant namespace (a RoleBinding the cloud account's
# reconcile applies), so it can get the kubeconfig Secrets of that
# tenant's workload clusters, for the read-only scan for deprecated API
# versions, and the Secrets of no other namespace. RBAC cannot select
# Secrets by a name suffix, so a tenant namespace is the narrowest scope.
# The controller's own role only has the bind verb on this role's name
# (role.yaml); the name, with ../default's namePrefix, must stay
# cluster-vending-kubeconfig-reader (reconcile.KubeconfigReaderRole). Kept
# in step with the code by config/deploy_test.go.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-controller
    app.kubernetes.io/managed-by: kustomize
  name: kubeconfig-reader
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
