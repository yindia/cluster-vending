resources:
# Everything is bound to this service account in the deployment namespace.
- service_account.yaml
# Generated by controller-gen from the +kubebuilder:rbac markers in
# pkg/controller (make controller-apis): the controller's
# own kinds, their status and finalizers. Do not edit by hand.
- role.yaml
- role_binding.yaml
# Hand-written: what the reconcilers do in the management cluster (the
# Crossplane providers they install, the provider kinds the platform
# renders, tenant namespaces, the CRDs of the platform's own kinds). No
# Secrets. Kept in step with the code by config/deploy_test.go.
- platform_role.yaml
- platform_role_binding.yaml
# Get on Secrets, bound by the controller in tenant namespaces only (the
# kubeconfig Secrets of workload clusters); never bound cluster-wide.
- kubeconfig_reader_role.yaml
# Leader election: Leases and events in the controller's namespace.
- leader_election_role.yaml
- leader_election_role_binding.yaml
# Helper roles for people, not used by the controller: admin, editor and
# viewer of each kind.
- cluster_admin_role.yaml
- cluster_editor_role.yaml
- cluster_viewer_role.yaml
- network_admin_role.yaml
- network_editor_role.yaml
- network_viewer_role.yaml
- cloudaccount_admin_role.yaml
- cloudaccount_editor_role.yaml
- cloudaccount_viewer_role.yaml
# For people managing releases (docs/design/release-admin.md): the
# operator writes, others read.
- release_admin_role.yaml
- release_viewer_role.yaml
