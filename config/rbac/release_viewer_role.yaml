# Read the release objects: which releases exist, what each channel
# offers, which clusters are held.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-controller
    app.kubernetes.io/managed-by: kustomize
  name: release-viewer
rules:
- apiGroups:
  - cloud.cluster-vending.io
  resources:
  - releases
  - releasechannels
  - releaseholds
  - releases/status
  - releasechannels/status
  - releaseholds/status
  verbs:
  - get
  - list
  - watch
