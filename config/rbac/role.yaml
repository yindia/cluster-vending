---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - cloud.cluster-vending.io
  resources:
  - cloudaccounts
  - clusters
  - components
  - networks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloud.cluster-vending.io
  resources:
  - cloudaccounts/finalizers
  - clusters/finalizers
  - components/finalizers
  - networks/finalizers
  - releases/finalizers
  verbs:
  - update
- apiGroups:
  - cloud.cluster-vending.io
  resources:
  - cloudaccounts/status
  - clusters/status
  - componentdefinitions/status
  - components/status
  - networks/status
  - releasechannels/status
  - releaseholds/status
  - releases/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - cloud.cluster-vending.io
  resources:
  - componentdefinitions
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - cloud.cluster-vending.io
  resources:
  - releasechannels
  - releases
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloud.cluster-vending.io
  resources:
  - releaseholds
  verbs:
  - get
  - list
  - watch
