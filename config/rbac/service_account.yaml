# The controller's identity. In production its AWS access is IRSA: the
# eks.amazonaws.com/role-arn annotation, set by ../default (a placeholder
# there) to an IAM role that may assume the tenant roles. Nothing else
# gives the controller AWS credentials in a cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-controller
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager
  namespace: system
