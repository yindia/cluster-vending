# EKS cluster prod-eks in network prod of tenant acme: the same cluster as
# examples/cluster.yaml.
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: Cluster
metadata:
  # The EKS cluster's name.
  name: prod-eks
  namespace: tenant-acme
spec:
  displayName: Prod EKS
  tags:
    env: prod
    team: platform
  region: us-east-1
  network:
    # The Network that owns this cluster (cloud_v1alpha1_network.yaml).
    networkRef:
      name: prod
  controlPlane:
    endpointAccess:
      publicAccessCIDRs:
        - 0.0.0.0/0
  defaultNodePool:
    instanceTypes:
      - m7i-flex.large
    diskSizeGB: 30
    scaling:
      minSize: 2
      maxSize: 3
  access:
    # IAM role/user ARNs; the creator is admin already.
    adminPrincipals: []
  # Stored only for now: a release reaches Alpha, then Beta, then Stable,
  # and within a channel Tier2, then Tier1, then Tier0. Unset tier is Tier0.
  releaseChannel: Stable
  aws:
    upgradePolicy:
      supportType: STANDARD
    addons:
      - name: metrics-server
      - name: kube-state-metrics
