# The component catalog (docs/architecture.md#components-and-the-catalog), written by the
# release-admin role. Chart versions are not here: each release pins them
# per Kubernetes minor.
#
# Values, later wins: userValues (the commented file tenants pull, edit and
# send back) < the tenant's edits < platformValues (locked: a tenant who
# touches one of their paths is refused) < computed values (a later step).
# valuesSchema is written by hand and says what a tenant may set.
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: kyverno
spec:
  provider: aws
  description: Policy engine. Validates, mutates and generates Kubernetes resources.
  namespace: kyverno
  install:
    helm:
      repository: https://kyverno.github.io/kyverno
      chart: kyverno
  platformValues:
    features:
      policyExceptions:
        enabled: true
  userValues: |
    admissionController:
      # Admission webhook replicas, 1 to 5. Three survive a zone outage.
      replicas: 3
  valuesSchema:
    type: object
    additionalProperties: false
    properties:
      admissionController:
        type: object
        properties:
          replicas: {type: integer, minimum: 1, maximum: 5}
      features:
        type: object
---
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: kyverno-policies
spec:
  provider: aws
  description: The Kubernetes Pod Security Standards as Kyverno policies.
  namespace: kyverno
  requires:
  - kyverno
  install:
    helm:
      repository: https://kyverno.github.io/kyverno
      chart: kyverno-policies
  platformValues:
    failurePolicy: Ignore
  userValues: |
    # baseline, restricted or privileged.
    podSecurityStandard: baseline
    # Audit reports violations; Enforce refuses them.
    validationFailureAction: Audit
  valuesSchema:
    type: object
    additionalProperties: false
    properties:
      podSecurityStandard: {type: string, enum: [baseline, restricted, privileged]}
      validationFailureAction: {type: string, enum: [Audit, Enforce]}
---
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: karpenter
spec:
  provider: aws
  description: Node autoscaling. Launches EC2 instances for pending pods.
  namespace: kube-system
  # Sequence 0 is the node provisioner's: the shipped Platform karpenter
  # declares role: NodeProvisioner, which puts it first; a definition named
  # karpenter without the role must say 0 (`controller --check`).
  sequence: 0
  # An IRSA role (the default access): the cluster needs spec.aws.irsa. The
  # ${...} placeholders are filled in per cluster. No interruption queue
  # yet: only an IAM role and policy can be declared so far.
  cloudResources:
    iamRole:
      serviceAccounts:
      - {namespace: kube-system, name: karpenter}
      policy: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {"Sid": "Compute", "Effect": "Allow", "Resource": "*",
             "Action": ["ec2:CreateFleet", "ec2:CreateLaunchTemplate", "ec2:CreateTags", "ec2:DeleteLaunchTemplate",
                        "ec2:RunInstances", "ec2:TerminateInstances", "ec2:Describe*", "pricing:GetProducts", "ssm:GetParameter"]},
            {"Sid": "PassNodeRole", "Effect": "Allow", "Action": "iam:PassRole", "Resource": "${cluster.nodeRoleArn}"},
            {"Sid": "InstanceProfiles", "Effect": "Allow", "Resource": "*",
             "Action": ["iam:CreateInstanceProfile", "iam:TagInstanceProfile", "iam:AddRoleToInstanceProfile",
                        "iam:RemoveRoleFromInstanceProfile", "iam:DeleteInstanceProfile", "iam:GetInstanceProfile"]},
            {"Sid": "Cluster", "Effect": "Allow", "Action": "eks:DescribeCluster",
             "Resource": "arn:aws:eks:${region}:${account.id}:cluster/${cluster.name}"}
          ]
        }
  install:
    helm:
      repository: oci://public.ecr.aws/karpenter
      chart: karpenter
  # Locked for every tenant. The ${...} placeholders are filled in per
  # cluster by the controller.
  platformValues:
    settings:
      clusterName: "${cluster.name}"
      clusterEndpoint: "${cluster.endpoint}"
    serviceAccount:
      name: karpenter
      # IRSA: the platform does not annotate service accounts itself; each
      # chart has its own key for it.
      annotations:
        eks.amazonaws.com/role-arn: "${iam.roleArn}"
    controller:
      resources:
        requests: {cpu: 250m, memory: 512Mi}
  # The file tenants pull (cluster-vending component template karpenter),
  # edit and send back. Comments stay; keys left as they are here are not
  # stored, so a later change to this file reaches those tenants.
  userValues: |
    # Controller replicas, 1 to 3. Two keep Karpenter up while its node drains.
    replicas: 2
    # error, info or debug.
    logLevel: info
    settings:
      # How long Karpenter collects pending pods before it launches nodes.
      batchMaxDuration: 10s
      # featureGates:
      #   spotToSpotConsolidation: true
  valuesSchema:
    type: object
    additionalProperties: false
    properties:
      replicas: {type: integer, minimum: 1, maximum: 3}
      logLevel: {type: string, enum: [error, info, debug]}
      settings:
        type: object
        additionalProperties: false
        properties:
          featureGates: {type: object, additionalProperties: {type: boolean}}
          batchMaxDuration: {type: string}
---
# A chart in a private OCI registry (ECR). The operator keeps a
# kubernetes.io/dockerconfigjson Secret fresh in the platform namespace (ECR
# tokens last 12 hours); the definition only names it. No userValues and no
# valuesSchema: tenants change nothing.
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: internal-dashboards
spec:
  provider: aws
  description: The platform team's Grafana dashboards and alerts for workload clusters.
  namespace: monitoring
  install:
    helm:
      repository: oci://444455556666.dkr.ecr.us-east-1.amazonaws.com/charts
      chart: internal-dashboards
      credentials:
        type: DockerConfigJSON
        secretRef:
          namespace: cluster-vending-system
          name: ecr-charts-pull
---
# IRSA with a policy the tenant account already has (created once per
# account, e.g. from the controller's iam_policy.json). The chart's own key
# carries the role ARN.
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: aws-load-balancer-controller
spec:
  provider: aws
  description: Provisions AWS load balancers for Services and Ingresses.
  namespace: kube-system
  install:
    helm:
      repository: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
  cloudResources:
    iamRole:
      access: IRSA
      serviceAccounts:
      - {namespace: kube-system, name: aws-load-balancer-controller}
      managedPolicyArns:
      - "arn:aws:iam::${account.id}:policy/AWSLoadBalancerControllerIAMPolicy"
  platformValues:
    clusterName: "${cluster.name}"
    region: "${region}"
    vpcId: "${network.vpcId}"
    serviceAccount:
      name: aws-load-balancer-controller
      # IRSA: the platform does not annotate service accounts itself; this
      # chart takes the role ARN here.
      annotations:
        eks.amazonaws.com/role-arn: "${iam.roleArn}"
  userValues: |
    # Controller replicas, 1 to 3.
    replicaCount: 2
    # Attach AWS WAFv2 web ACLs to ALBs from Ingress annotations.
    enableWafv2: false
  valuesSchema:
    type: object
    additionalProperties: false
    properties:
      replicaCount: {type: integer, minimum: 1, maximum: 3}
      enableShield: {type: boolean}
      enableWaf: {type: boolean}
      enableWafv2: {type: boolean}
