# Network prod of tenant acme: the same network as examples/network.yaml.
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: Network
metadata:
  name: prod
  namespace: tenant-acme
spec:
  tier: Tier0
  # The CloudAccount that owns this network (cloud_v1alpha1_cloudaccount.yaml).
  accountRef:
    name: aws-111122223333
  displayName: Prod network
  tags:
    env: prod
    team: platform
  region: us-east-1
  layout:
    cidrBlock: 10.1.0.0/16
    natGatewayMode: PerZone
    subnets:
      - {role: Public, cidrBlock: 10.1.0.0/24, zoneID: use1-az1}
      - {role: Public, cidrBlock: 10.1.1.0/24, zoneID: use1-az2}
      - {role: Private, cidrBlock: 10.1.16.0/20, zoneID: use1-az1}
      - {role: Private, cidrBlock: 10.1.32.0/20, zoneID: use1-az2}
