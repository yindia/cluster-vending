                    {{`{{`}}- $owned = true }}
                    {{`{{`}}- end }}
                    {{`{{`}}- end }}
                    {{`{{`}}- if $owned }}
                    {{`{{`}}- range $key := $.tenant.spec.data.naas.namespaceKeys }}
                    {{`{{`}}- if eq $.namespace.metadata.name (printf "%s-%s" $.tenant.metadata.name $key) }}
                    {{`{{`}}- range $binding := $.tenant.spec.data.naas.accessBindings }}
                    {{`{{`}}- if or (eq $binding.role "naas-workload-admin") (eq $binding.role "naas-workload-viewer") }}
