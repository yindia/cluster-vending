                    subjects:
                    - apiGroup: rbac.authorization.k8s.io
                      kind: Group
                      name: {{`{{`}} $binding.group | printf "%q" }}
                    {{`{{`}}- end }}
                    {{`{{`}}- end }}
                    {{`{{`}}- end }}
                    {{`{{`}}- end }}
                    {{`{{`}}- end }}
                    {{`{{`}}- end }}
                policy:
