# A release as an operator publishes it, with the content of the release
# the controller ships (pkg/controller DefaultRelease): the three newest
# Kubernetes minors and, on each, the versions of the shipped catalog
# (config/catalog). A pin's values are locked Helm values for that minor:
# the cluster autoscaler's image must be of the cluster's Kubernetes minor.
#
# The controller creates its own copy, named shipped-<hash of the content>
# and labelled cloud.cluster-vending.io/shipped. Yours is named
# YYYY-MM-<letter>; point a channel at it to offer it.
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: Release
metadata:
  name: 2026-11-a
spec:
  notes: "The shipped versions, with our end-of-support dates."
  content:
    renderVersion: 4
    kubernetes:
      - minor: "1.37"
        default: true
        endOfSupport: "2028-01-31T00:00:00Z"
        components:
          - {name: aws-load-balancer-controller, version: "3.6.2"}
          - {name: cluster-autoscaler, version: "9.60.0", values: {image: {tag: v1.37.0}}}
          - {name: gateway-api-crds, version: "1.6.1"}
          - {name: gpu-operator, version: "v26.7.2"}
          - {name: istio-base, version: "1.32.0"}
          - {name: istio-cni, version: "1.32.0"}
          - {name: istio-ingress-gateway, version: "0.1.0"}
          - {name: istiod, version: "1.32.0"}
          - {name: karpenter, version: "1.15.1"}
          - {name: karpenter-nodeclass, version: "0.1.0"}
          - {name: kyverno, version: "3.10.0"}
          - {name: kyverno-policies, version: "3.10.0"}
          - {name: ztunnel, version: "1.32.0"}
      - minor: "1.36"
        upgradeTo: "1.37"
        endOfSupport: "2027-09-30T00:00:00Z"
        components:
          - {name: aws-load-balancer-controller, version: "3.6.2"}
          - {name: cluster-autoscaler, version: "9.60.0", values: {image: {tag: v1.36.2}}}
          - {name: gateway-api-crds, version: "1.6.1"}
          - {name: gpu-operator, version: "v26.7.2"}
          - {name: istio-base, version: "1.32.0"}
          - {name: istio-cni, version: "1.32.0"}
          - {name: istio-ingress-gateway, version: "0.1.0"}
          - {name: istiod, version: "1.32.0"}
          - {name: karpenter, version: "1.15.1"}
          - {name: karpenter-nodeclass, version: "0.1.0"}
          - {name: kyverno, version: "3.10.0"}
          - {name: kyverno-policies, version: "3.10.0"}
          - {name: ztunnel, version: "1.32.0"}
      - minor: "1.35"
        upgradeTo: "1.36"
        endOfSupport: "2027-05-31T00:00:00Z"
        components:
          - {name: aws-load-balancer-controller, version: "3.6.2"}
