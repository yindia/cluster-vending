# A release as an operator publishes it, with the content of the release
# the controller ships (pkg/controller DefaultRelease): the three newest
# Kubernetes minors and, on each, the versions of the shipped catalog
# (pkg/catalog/definitions). A pin's values are locked Helm values for that minor.
#
# The controller creates its own copy, named shipped-<hash of the content>
# and labelled cloud.cluster-vending.io/shipped. Yours is named
# YYYY-MM-<letter>; point a channel at it to offer it.
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: Release
metadata:
  name: 2026-11-a
spec:
  notes: "The shipped versions, with our end-of-support dates."
  content:
    kubernetes:
    - channel: alpha
      components:
      - name: aws-load-balancer-controller
        version: 3.6.2
      - name: capsule
        values:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      cluster-vending.io/platform-component: capsule
                  topologyKey: kubernetes.io/hostname
                weight: 100
          certManager:
            generateCertificates: true
          crds:
            inline: false
            install: true
          extraManifests:
          - apiVersion: policy/v1
            kind: PodDisruptionBudget
            metadata:
              name: capsule-platform
            spec:
              minAvailable: 1
              selector:
                matchLabels:
                  cluster-vending.io/platform-component: capsule
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              annotations:
                cloud.cluster-vending.io/naas-bootstrap-revision: sha256:b423503d52b7b5e006dcbabe41f1c85671518da8eb707bcdc05e97ac6b12cacd
              name: naas-workload-editor
            rules:
            - apiGroups:
              - apps
              resources:
              - deployments
              - statefulsets
              verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
            - apiGroups:
              - batch
              resources:
              - jobs
              - cronjobs
              verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
            - apiGroups:
              - ""
              resources:
              - services
              - configmaps
              - persistentvolumeclaims
              verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
            - apiGroups:
              - ""
              resources:
              - pods
              - events
              verbs:
              - get
              - list
              - watch
          - apiVersion: capsule.clastix.io/v1beta2
            kind: GlobalTenantResource
            metadata:
              annotations:
                cloud.cluster-vending.io/naas-bootstrap-revision: sha256:b423503d52b7b5e006dcbabe41f1c85671518da8eb707bcdc05e97ac6b12cacd
              name: naas-namespace-bootstrap
            spec:
              resources:
              - generators:
                - missingKey: error
                  template: |
                    {{`{{`}}- range $key := $.tenant.spec.data.naas.namespaceKeys }}
                    ---
                    apiVersion: v1
                    kind: Namespace
                    metadata:
                      name: {{`{{`}} printf "%s-%s" $.tenant.metadata.name $key | printf "%q" }}
                      ownerReferences:
                        - apiVersion: capsule.clastix.io/v1beta2
                          kind: Tenant
                          name: {{`{{`}} printf "%q" $.tenant.metadata.name }}
                          uid: {{`{{`}} printf "%q" $.tenant.metadata.uid }}
                      labels:
                        capsule.clastix.io/tenant: {{`{{`}} printf "%q" $.tenant.metadata.name }}
                        cloud.cluster-vending.io/tenant: {{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant" | printf "%q" }}
                        cloud.cluster-vending.io/subtenant-id: {{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id" | printf "%q" }}
                        cloud.cluster-vending.io/naas-profile: restricted-ambient-v1
                        cloud.cluster-vending.io/naas-ready: {{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/access-ready" | printf "%q" }}
                        istio.io/dataplane-mode: ambient
                        pod-security.kubernetes.io/enforce: restricted
                        pod-security.kubernetes.io/enforce-version: {{`{{`}} printf "%q" $.tenant.spec.data.naas.pssVersion }}
                        pod-security.kubernetes.io/audit: restricted
                        pod-security.kubernetes.io/audit-version: {{`{{`}} printf "%q" $.tenant.spec.data.naas.pssVersion }}
                        pod-security.kubernetes.io/warn: restricted
                        pod-security.kubernetes.io/warn-version: {{`{{`}} printf "%q" $.tenant.spec.data.naas.pssVersion }}
                    {{`{{`}}- end }}
                policy:
                  creation: Owner
                  deletion: Orphan
                  force: false
                  protect: true
              resyncPeriod: 60s
              scope: Tenant
              serviceAccount:
                name: provisioner
                namespace: naas-system
              settings: {}
              tenantSelector:
                matchLabels:
                  cloud.cluster-vending.io/naas-profile: restricted-ambient-v1
          - apiVersion: capsule.clastix.io/v1beta2
            kind: GlobalTenantResource
            metadata:
              annotations:
                cloud.cluster-vending.io/naas-bootstrap-revision: sha256:b423503d52b7b5e006dcbabe41f1c85671518da8eb707bcdc05e97ac6b12cacd
              name: naas-isolation-baseline
            spec:
              resources:
              - generators:
                - missingKey: error
                  template: |
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata:
                      name: naas-deny-by-default
                      namespace: '{{`{{`}} $.namespace.metadata.name }}'
                      labels:
                        cloud.cluster-vending.io/tenant: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
                          }}'
                        cloud.cluster-vending.io/subtenant-id: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
                          }}'
                    spec:
                      podSelector: {}
                      policyTypes:
                      - Ingress
                      - Egress
                      ingress: []
                      egress: []
                    ---
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata:
                      name: naas-allow-subtenant-hbone
                      namespace: '{{`{{`}} $.namespace.metadata.name }}'
                      labels:
                        cloud.cluster-vending.io/tenant: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
                          }}'
                        cloud.cluster-vending.io/subtenant-id: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
                          }}'
                    spec:
                      podSelector: {}
                      policyTypes:
                      - Ingress
                      - Egress
                      ingress:
                      - from:
                        - namespaceSelector:
                            matchLabels:
                              capsule.clastix.io/tenant: '{{`{{`}} $.tenant.metadata.name }}'
                        ports:
                        - protocol: TCP
                          port: 15008
                      egress:
                      - to:
                        - namespaceSelector:
                            matchLabels:
                              capsule.clastix.io/tenant: '{{`{{`}} $.tenant.metadata.name }}'
                        ports:
                        - protocol: TCP
                          port: 15008
                    ---
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata:
                      name: naas-allow-cluster-dns
                      namespace: '{{`{{`}} $.namespace.metadata.name }}'
                      labels:
                        cloud.cluster-vending.io/tenant: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
                          }}'
                        cloud.cluster-vending.io/subtenant-id: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
                          }}'
                    spec:
                      podSelector: {}
                      policyTypes:
                      - Egress
                      egress:
                      - to:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: kube-system
                          podSelector:
                            matchLabels:
                              k8s-app: kube-dns
                        ports:
                        - protocol: UDP
                          port: 53
                        - protocol: TCP
                          port: 53
                    ---
                    apiVersion: security.istio.io/v1
                    kind: PeerAuthentication
                    metadata:
                      name: naas-require-mtls
                      namespace: '{{`{{`}} $.namespace.metadata.name }}'
                      labels:
                        cloud.cluster-vending.io/tenant: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
                          }}'
                        cloud.cluster-vending.io/subtenant-id: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
                          }}'
                    spec:
                      mtls:
                        mode: STRICT
                    ---
                    apiVersion: security.istio.io/v1
                    kind: AuthorizationPolicy
                    metadata:
                      name: naas-allow-owned-namespaces
                      namespace: '{{`{{`}} $.namespace.metadata.name }}'
                      labels:
                        cloud.cluster-vending.io/tenant: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
                          }}'
                        cloud.cluster-vending.io/subtenant-id: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
                          }}'
                    spec:
                      action: ALLOW
                      rules:
                      - from:
                        - source:
                            namespaces:
                      {{`{{`}}- range $key := $.tenant.spec.data.naas.namespaceKeys }}
                            - {{`{{`}} printf "%s-%s" $.tenant.metadata.name $key | printf "%q" }}
                    {{`{{`}}- end }}
                    ---
                    apiVersion: v1
                    kind: LimitRange
                    metadata:
                      name: naas-container-defaults
                      namespace: '{{`{{`}} $.namespace.metadata.name }}'
                      labels:
                        cloud.cluster-vending.io/tenant: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
                          }}'
                        cloud.cluster-vending.io/subtenant-id: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
                          }}'
                    spec:
                      limits:
                      - type: Container
                        defaultRequest:
                          cpu: 250m
                          memory: 256Mi
                          ephemeral-storage: 1Gi
                        default:
                          memory: 256Mi
                          ephemeral-storage: 2Gi
                    ---
                    apiVersion: v1
                    kind: ServiceAccount
                    metadata:
                      name: app
                      namespace: '{{`{{`}} $.namespace.metadata.name }}'
                      labels:
                        cloud.cluster-vending.io/tenant: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
                          }}'
                        cloud.cluster-vending.io/subtenant-id: '{{`{{`}} index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
                          }}'
                    automountServiceAccountToken: false
