apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ReleaseChannel
metadata:
  name: alpha
spec:
  promotion: Pinned
  release: 2026-11-a
---
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ReleaseChannel
metadata:
  name: beta
spec:
  promotion: Automatic
  policy:
    releaseSoak: 168h   # takes alpha's release after 7 days
---
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ReleaseChannel
metadata:
  name: stable
spec:
  promotion: Automatic
  policy:
    releaseSoak: 336h   # takes beta's release after 14 days
