# Optional runtime for a provider-helm the platform did not install (one on the
# empty `default` DeploymentRuntimeConfig). It sets only Helm's poll and
# reconcile rate; it does not adopt the platform's replica/resource settings or
# change the AWS providers. For an already customized runtime, merge the poll
# setting into that profile instead, preserving its other package-runtime
# arguments and identity settings. After creating, explicitly point
# Provider/provider-helm runtimeConfigRef here.
#
# Spec changes reach provider-helm through its watch at once; the poll is how
# soon a Release's status (a failed install, drift) reaches the platform
# (Releases render wait: false; docs/architecture.md#helm-operations). Each
# poll is a remote Helm status call per Release.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: cluster-vending-helm-observation
  labels:
    app.kubernetes.io/managed-by: cluster-vending
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              args: ["--poll=30s", "--max-reconcile-rate=100"]
