# Opt-in OIDC authentication (no roles). Customize platform.yaml for your issuer before use.
# It replaces the base's platform-config with the same nodeGroups plus the
# auth section (the server reads one --config file).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cluster-vending-system
resources:
- ../base
configMapGenerator:
- name: platform-config
  behavior: replace
  files:
  - platform.yaml
