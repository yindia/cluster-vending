# Opt-in JWT authentication. Customize server.yaml for your issuer before use.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cluster-vending-system
resources:
- ../base
configMapGenerator:
- name: cluster-vending-server-auth
  files:
  - server.yaml
patches:
- path: deployment.yaml
