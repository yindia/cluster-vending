# The platform file of ../../node-groups with the auth section added: the
# server reads one --config. Keep nodeGroups equal to that file (config/ tests
# check it); the controller reads that one.
#
# Public verification settings only: no client secrets, passwords or tokens.
# Replace the HTTPS issuer, API audience and exact tenant/group grants before
# deployment. Unassigned users receive no tenant or platform grant.
auth:
  mode: required
  issuers:
  - name: keycloak
    issuer: https://login.example.com/realms/platform
    audiences: [cv-api]
    usernameClaim: preferred_username
    rolesClaim: groups
  rules:
  - match: {issuer: keycloak, role: tenant-acme-admin}
    grant: {role: TenantAdmin, tenants: [acme]}
  - match: {issuer: keycloak, role: tenant-acme-viewer}
    grant: {role: TenantViewer, tenants: [acme]}

nodeGroups:
  # The default EKS managed node group: runs Karpenter, cluster-autoscaler,
  # CoreDNS and every platform and tenant component.
  system:
    # New clusters only: instanceType, capacityType, diskSizeGiB.
    instanceType: t3.medium
    # In place, on every cluster. minSize is also the size at creation (at
    # least 2: Karpenter runs two replicas); maxSize is at least minSize.
    minSize: 2
    maxSize: 6
    capacityType: ON_DEMAND
    diskSizeGiB: 0
  # What tenants may create as their own node groups.
  karpenter:
    # An empty list restricts nothing.
    instanceFamilies: [t3]
    instanceTypes: []
    defaults:
      architectures: [AMD64]
      capacityTypes: [ON_DEMAND]
