# The API server (`cluster-vending serve`) in the management cluster. It
# keeps its state as CloudAccount, Network and Cluster objects in the
# tenants' namespaces: no database. It only stores the desired state:
# deploy the controller (config/default) with it, which installs the kinds
# the server waits for, installs the providers and reconciles.
#
#   make deploy-manifests          # render, nothing is applied
#
# DEV-ONLY ON ITS OWN: this base runs auth mode none, so it accepts
# anonymous callers for every tenant (any pod that reaches the Service can
# freeze the platform or delete any cluster), and `serve` logs an INSECURE
# warning at start. Deploy ../auth, the production overlay: the same
# objects with auth mode required (`make deploy-manifests` renders that one).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The platform's own namespace.
namespace: cluster-vending-system
namePrefix: cluster-vending-

resources:
- namespace.yaml
- service_account.yaml
- role.yaml
- role_binding.yaml
- deployment.yaml
- service.yaml
# The live reader the node lists and node totals are read through
# (PROP-02 5.5): its own Deployment, Service and NetworkPolicy.
- ../../live

# The node group layout is the file of ../../node-groups, the same one the
# controller reads: a ConfigMap mounted at /etc/cluster-vending.
components:
- ../../node-groups

# The server's settings, as the CV_* environment variables of its flags
# (pkg/config). Edit here or patch in an overlay.
configMapGenerator:
- name: server-config
  literals:
  - CV_HTTP_ADDR=:8080
  - CV_LOG_FORMAT=json
  - CV_LOG_LEVEL=info
  # The live reader (../../live), by its Service. Never set
  # CV_LIVE_ALLOW_WITHOUT_AUTH here: live reads need authentication.
  - CV_LIVE_URL=http://cluster-vending-live:8090
  # Nothing of AWS: the server validates requests and stores the desired
  # state. The controller (../../default) installs the providers, looks the
  # cloud up and reconciles; it is the one with AWS settings and an IAM role.

images:
- name: server
  newName: ghcr.io/yindia/cluster-vending
  newTag: latest
