# The API server (`cluster-vending serve`) in the management cluster. It
# keeps its state as CloudAccount, Network and Cluster objects in the
# tenants' namespaces: no database. It only stores the desired state:
# deploy the controller (config/default) with it, which installs the kinds
# the server waits for, installs the providers and reconciles.
#
#   make deploy-manifests          # render, nothing is applied
#
# Authentication is opt-in: this base accepts anonymous callers for every
# tenant. Use ../auth for an example with required JWT authentication.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The platform's own namespace.
namespace: cluster-vending-system
namePrefix: cluster-vending-

resources:
- namespace.yaml
- service_account.yaml
- role.yaml
- role_binding.yaml
- deployment.yaml
- service.yaml

# The server's settings, as the CV_* environment variables of its flags
# (pkg/config). Edit here or patch in an overlay.
configMapGenerator:
- name: server-config
  literals:
  - CV_HTTP_ADDR=:8080
  - CV_LOG_FORMAT=json
  - CV_LOG_LEVEL=info
  # Machines user node groups may use (the controller needs the same
  # values: ../../manager). Empty: no restriction.
  - CV_NODE_GROUP_INSTANCE_FAMILIES=m7i,m7a,m7g,c7i,c7a,c7g,r7i,r7a,r7g
  # Nothing of AWS: the server validates requests and stores the desired
  # state. The controller (../../default) installs the providers, looks the
  # cloud up and reconciles; it is the one with AWS settings and an IAM role.

images:
- name: server
  newName: ghcr.io/yindia/cluster-vending
  newTag: latest
