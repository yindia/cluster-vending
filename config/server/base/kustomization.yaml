# The API server (`cluster-vending serve`) in the management cluster. This
# base does not say where the server keeps its state: use one of the
# overlays.
#
#   ../overlays/kubernetes-store   custom resources in the management cluster,
#                                  no database (--store=kubernetes); deploy the
#                                  controller (config/default) with it
#   ../overlays/postgres           an external Postgres (--store=database); the
#                                  server is then the reconciler too and gets
#                                  the controller's settings, role and AWS access
#
#   make deploy-manifests          # render both, nothing is applied
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The platform's own namespace.
namespace: cluster-vending-system
namePrefix: cluster-vending-

resources:
- namespace.yaml
- service_account.yaml
- role.yaml
- role_binding.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
- deployment.yaml
- service.yaml

# The server's settings, as the CV_* environment variables of its flags
# (pkg/config). Edit here or patch in an overlay.
configMapGenerator:
- name: server-config
  literals:
  - CV_HTTP_ADDR=:8080
  - CV_LOG_FORMAT=json
  - CV_LOG_LEVEL=info
  - CV_LEADER_ELECT=true
  # Nothing of AWS: the server validates requests and stores the desired
  # state. The controller (../../default) installs the providers, looks the
  # cloud up and reconciles; it is the one with AWS settings and an IAM role.

images:
- name: server
  newName: ghcr.io/yindia/cluster-vending
  newTag: latest
