# Leader election of the background loop: a Lease in the server's own
# namespace (pkg/kube/manager.go).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-server
    app.kubernetes.io/managed-by: kustomize
  name: server-leader-election-role
  namespace: system
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
