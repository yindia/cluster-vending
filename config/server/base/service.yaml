# The base API accepts anonymous callers; ../auth opts into required JWT auth.
# Restrict access to the base Service, including from other cluster workloads.
# External exposure also needs TLS; h2c is needed upstream for gRPC.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-server
    app.kubernetes.io/managed-by: kustomize
  name: server
  namespace: system
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
    appProtocol: kubernetes.io/h2c
  selector:
    app.kubernetes.io/name: cluster-vending-server
