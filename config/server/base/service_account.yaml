# Annotate with the IAM role of the server's own AWS lookups (IRSA,
# eks.amazonaws.com/role-arn) in an overlay: imports and name checks read
# AWS with the server's credentials when an account's ProviderConfig names
# no Secret (pkg/reconcile/access.go).
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-server
    app.kubernetes.io/managed-by: kustomize
  name: server
  namespace: system
