# The server's identity. It carries no IAM role annotation and must not:
# the server makes no AWS call (the controller does, with its own service
# account). Only the postgres overlay, where the server is the reconciler
# too, gives it one.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-server
    app.kubernetes.io/managed-by: kustomize
  name: server
  namespace: system
