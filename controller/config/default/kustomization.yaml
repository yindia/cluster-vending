# The controller in the management cluster: its CRDs, RBAC and Deployment.
#
#   make deploy-manifests            # render, nothing is applied
#
# The image is the one `make docker-build` builds; set it under images:
# below or with `kustomize edit set image controller=<image>:<tag>`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The platform's own namespace.
namespace: cluster-vending-system

# Prepended to every name: the Deployment is
# cluster-vending-controller-manager.
namePrefix: cluster-vending-

resources:
- ../crd
- ../rbac
- ../manager
# [PROMETHEUS] A ServiceMonitor; needs the metrics component below and the
# Prometheus Operator's CRDs.
#- ../prometheus
# [NETWORK POLICY] Restrict the metrics port to namespaces labelled
# metrics=enabled.
#- ../network-policy

# [METRICS] Off by default, as the command's own default is. Uncomment to
# serve them (plain HTTP, unauthenticated) on :8080 behind a Service.
#components:
#- ../metrics

images:
- name: controller
  newName: ghcr.io/yindia/cluster-vending
  newTag: latest
