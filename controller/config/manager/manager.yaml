# The controller manager: `cluster-vending controller` (cmd/controller.go).
# Its settings are the flags of that command (pkg/config/controller.go);
# every one can also be given as a CV_* environment variable.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cluster-vending-controller
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: cluster-vending-controller
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cluster-vending-controller
  # More than one replica is fine: leader election lets one reconcile.
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: cluster-vending-controller
    spec:
      securityContext:
        # The "restricted" Pod Security Standard.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        # Set by the kustomization's images: (make deploy-manifests IMAGE=...).
        image: controller:latest
        command:
        - /cluster-vending
        - controller
        args:
        - --leader-elect=true
        - --health-probe-addr=:8081
        # Metrics are off unless the ../metrics component turns them on.
        - --metrics-addr=0
        - --log-format=json
        env:
        # The leader election Lease lives in the controller's own namespace
        # (--lease-namespace), whatever namespace the kustomization sets.
        - name: CV_LEASE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        # Sized for an idle manager; revisit once the reconcilers do work
        # (the server's informer cache for ~100 clusters is the reference).
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
