# The API inside the cluster. It has no authentication of its own: expose
# it outside only behind something that does (an ingress or gateway with
# auth); h2c is needed for gRPC.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: cluster-vending-server
    app.kubernetes.io/managed-by: kustomize
  name: server
  namespace: system
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
    appProtocol: kubernetes.io/h2c
  selector:
    app.kubernetes.io/name: cluster-vending-server
