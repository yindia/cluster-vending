# PER-SUBTENANT REQUEST: THE ONLY REMOTE KIND OUR CONTROLLER CREATES/UPDATES.
# Target: selected WORKLOAD cluster. Design example only; nothing applied.
# The management cluster's future service creates this Capsule Tenant, not the
# Namespace, Istio policies, NetworkPolicies, limits, accounts or RoleBindings.
# Install namespace-as-a-service.bootstrap.yaml ONCE beforehand in this cluster.
# Capsule's GlobalTenantResource controllers render all of those child objects.
#
# data.naas is platform-owned input to the shared templates. Names, identity
# mapping and policy version are validated/resolved by the future service.
# Keep access-ready=false until the management observer verifies the generated
# baseline AND the cluster's qualified isolation/readiness checks. It then updates
# this same Tenant label to true; Capsule generates access bindings afterwards.
# Readiness does not become true automatically from Tenant creation or GTR Ready.
# Namespace keys are initially append-only; removal needs a separate safe lifecycle.
# No management-cluster SubTenant implementation is introduced by this example.
apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: st-00000000000040008000000000000021
  labels:
    cloud.cluster-vending.io/tenant: acme
    cloud.cluster-vending.io/subtenant-id: 00000000-0000-4000-8000-000000000021
    cloud.cluster-vending.io/naas-profile: restricted-ambient-v1
    cloud.cluster-vending.io/access-ready: 'false'
spec:
  preventDeletion: true
  forceTenantPrefix: true
  permissions:
    allowOwnerPromotion: false
  owners:
  - kind: ServiceAccount
    name: system:serviceaccount:naas-system:provisioner
    clusterRoles:
    - naas-workload-editor
  namespaceOptions:
    quota: 3
  rules:
  - quota:
    - name: budget
      hard:
        requests.cpu: '4'
        requests.memory: 8Gi
        limits.memory: 8Gi
        requests.ephemeral-storage: 20Gi
        limits.ephemeral-storage: 40Gi
        requests.storage: 100Gi
        persistentvolumeclaims: '10'
        pods: '30'
        services: '20'
        secrets: '40'
  - enforce:
      action: allow
      services:
        types:
        - ClusterIP
  - enforce:
      action: deny
      services:
        externalIPs: {}
  - enforce:
      action: allow
      metadata:
      - apiGroups:
        - v1
        kinds:
        - Namespace
        labels:
          pod-security.kubernetes.io/enforce:
            managed: restricted
            required: true
            values:
            - exact:
              - restricted
          pod-security.kubernetes.io/enforce-version:
            managed: v1.35
            required: true
            values:
            - exact:
              - v1.35
          pod-security.kubernetes.io/audit:
            managed: restricted
            required: true
            values:
            - exact:
              - restricted
          pod-security.kubernetes.io/audit-version:
            managed: v1.35
            required: true
            values:
            - exact:
              - v1.35
          pod-security.kubernetes.io/warn:
            managed: restricted
            required: true
            values:
            - exact:
              - restricted
          pod-security.kubernetes.io/warn-version:
            managed: v1.35
            required: true
            values:
            - exact:
              - v1.35
          istio.io/dataplane-mode:
            managed: ambient
            required: true
            values:
            - exact:
              - ambient
  data:
    naas:
      namespaceKeys:
      - app
      developerGroup: oidc:acme:subtenant:00000000-0000-4000-8000-000000000021:developers
      pssVersion: v1.35
