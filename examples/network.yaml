# Step 2 of the walkthrough (README.md): a network in tenant acme's account.
#
#   cluster-vending network create -f examples/network.yaml [--wait]
#
# Replace spec.bootstrapId with the BOOTSTRAP_ID that `bootstrap create -f
# examples/cloudaccount.yaml` returned. The answer has the network's id:
# the NETWORK_ID that examples/cluster.yaml refers to.
apiVersion: cluster-vending.io/v1
kind: Network
metadata:
  name: prod                 # prefix of the network's resource names
  tenant: acme
  displayName: Prod network
  labels: {env: prod, team: platform}   # filtering, and AWS tags on every resource
spec:
  region: us-west-1
  bootstrapId: 00000000-0000-0000-0000-000000000001   # BOOTSTRAP_ID
  # layout is optional: default 10.0.0.0/16, 3 zones, one NAT gateway.
  layout:
    cidrBlock: 10.1.0.0/16
    natGatewayMode: NAT_GATEWAY_MODE_PER_ZONE
    subnets:
      - {role: SUBNET_ROLE_PUBLIC,  cidrBlock: 10.1.0.0/24,  zoneId: usw1-az1}
      - {role: SUBNET_ROLE_PUBLIC,  cidrBlock: 10.1.1.0/24,  zoneId: usw1-az3}
      - {role: SUBNET_ROLE_PRIVATE, cidrBlock: 10.1.16.0/20, zoneId: usw1-az1}
      - {role: SUBNET_ROLE_PRIVATE, cidrBlock: 10.1.32.0/20, zoneId: usw1-az3}
