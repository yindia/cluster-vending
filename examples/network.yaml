# go run ./main.go network create -f examples/network.yaml [--wait]
apiVersion: cluster-vending.io/v1
kind: Network
metadata:
  name: prod                 # prefix of the network's resource names
  tenant: acme
  displayName: Prod network
  labels: {env: prod, team: platform}   # filtering, and AWS tags on every resource
spec:
  region: us-east-1
  bootstrapId: 00000000-0000-0000-0000-000000000000   # bootstrap list
  # layout is optional: default 10.0.0.0/16, 3 zones, one NAT gateway.
  layout:
    cidrBlock: 10.1.0.0/16
    natGatewayMode: NAT_GATEWAY_MODE_PER_ZONE
    subnets:
      - {role: SUBNET_ROLE_PUBLIC,  cidrBlock: 10.1.0.0/24,  zoneId: use1-az1}
      - {role: SUBNET_ROLE_PUBLIC,  cidrBlock: 10.1.1.0/24,  zoneId: use1-az2}
      - {role: SUBNET_ROLE_PRIVATE, cidrBlock: 10.1.16.0/20, zoneId: use1-az1}
      - {role: SUBNET_ROLE_PRIVATE, cidrBlock: 10.1.32.0/20, zoneId: use1-az2}
