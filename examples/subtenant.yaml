# Create a SubTenant on a cluster with spec.naas: true (examples/cluster.yaml).
# Replace metadata.clusterId with that cluster's ID, then either:
#   - console: the cluster's SubTenants -> Create SubTenant -> Paste YAML; or
#   - CLI:     cluster-vending subtenant create -f examples/subtenant.yaml --wait
#
# This is the UI/API manifest envelope, not a native Kubernetes CR.
# SubTenantService.CreateSubTenant generates the allocation ID and resolves the
# canonical parent names/UIDs. The UI supplies a stable request UUID for retries;
# the CLI derives it from the request, so creating the same file again returns
# the same SubTenant. To edit, add metadata.id and run subtenant update -f.
#
# The controller creates one Capsule Tenant on the cluster; Capsule creates the
# namespaces, quota and policies. `subtenant get` shows them as they appear.
# Deleting a SubTenant never deletes user data: non-empty namespaces block it.
apiVersion: cluster-vending.io/v1
kind: SubTenant
metadata:
  tenant: acme
  clusterId: 01a1e418-bddd-77b4-8b4f-c7de9131a16b  # replace with CLUSTER_ID
  # id: <SUBTENANT_ID>  # edit only; allocation identity is assigned on create
spec:
  # Immutable canonical name, unique within this workload cluster (1-35 DNS chars).
  name: payments
  # Default true, including when omitted. Disable explicitly before deleting.
  deletionProtection: true
  displayName: Payments
  # Logical keys, not physical namespace names. Use 1-64 unique lowercase DNS
  # labels, each at most 27 characters. Keys may be added but not removed/renamed.
  namespaceKeys: [app]
  # The supported baseline is fixed; arbitrary policies/Helm values are refused.
  policyProfile: restricted-ambient-v1
  quota:
    # Shared budget across this SubTenant, not one copy per namespace.
    # 1-64; must cover every namespace key above.
    namespaceCount: 3
    hard:
      requests.cpu: "4"
      requests.memory: 3Gi
      limits.memory: 3Gi
      requests.ephemeral-storage: 10Gi
      limits.ephemeral-storage: 10Gi
      requests.storage: 10Gi
      persistentvolumeclaims: "10"
      pods: "30"
      services: "20"
      secrets: "40"
      # Other supported quota keys: limits.cpu, configmaps.
      # Values are nonnegative Kubernetes quantities; object counts are integral.
  # Omitted/empty access grants no developer access. Groups are exact values
  # of the cluster's OIDC groups claim (the cluster needs OIDC configured).
  # Access opens only once the cluster's runtime qualification is current
  # (PROP-05); until then the SubTenant is Ready with AccessReady false.
  # access:
  #   adminGroups: [payments-admins]
  #   viewerGroups: [payments-readers]
# Parent cluster/tenant references and physical namespace names are assigned by
# the platform. Do not supply status, generation, etag, credentials, or UID refs.
# Disabling NaaS or deleting the cluster is blocked while SubTenants remain.
