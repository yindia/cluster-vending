# Optional OIDC: uncomment this auth block to enable API and UI login
# (`make keycloak` starts the local issuer). Authentication only: any user
# who can log in may call everything, for every tenant; there are no roles.
# auth:
#     mode: required
#     issuers:
#         - name: keycloak
#           issuer: http://localhost:18080/realms/cluster-vending
#           audiences:
#             - cv-api
#           usernameClaim: preferred_username
aws-management-role-arn: arn:aws:iam::642299167759:role/cluster-vending-provisioner
context: kind-cluster-vending
http-addr: 127.0.0.1:8080
log-format: text
log-level: debug
provider-credentials-secret: tenant-acme/aws-e919d8e2-credentials
# The live reader (`make run-live`): `serve` reads node lists and node totals
# through it. allowWithoutAuth lets it run with auth.mode none; local
# development only, never in a deployment (PROP-02 7.5).
live:
  url: http://127.0.0.1:8090
  addr: 127.0.0.1:8090
  allowWithoutAuth: true
# The controller's own settings (`make run-controller` reads this same file;
# `serve` ignores them). Its AWS credentials are never here: export
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (and AWS_SESSION_TOKEN) in the
# shell that runs it.
# One local controller: no leader election Lease, which a killed controller
# would leave behind for the next start to wait out.
leader-elect: false
health-probe-addr: 127.0.0.1:8081
automatic-upgrades: true
# Local testing only: act with the Secret's keys directly, without assuming
# the account's tenant role. Needs provider-credentials-secret.
skip-tenant-role: true
# Sub-tenant access (PROP-05 6.2): the OIDC groups a sub-tenant may name in
# adminGroups and viewerGroups. Exact values, or a prefix ending in "*";
# deniedGroups are checked first. Empty (the default): no group may be named
# and sub-tenant access stays closed. The API server refuses a group outside
# the list, and the controller closes access for a group that left it, so
# keep this section the same in the server's and the controller's file.
# qualifierImage runs the naas-qualifier Job (pkg/naas/cmd/access-qualification);
# without it no Job runs and only an operator-written record qualifies a cluster.
# naas:
#   allowedGroups:
#     - "cv-subtenant-*"
#   deniedGroups:
#     - "cv-platform-operators"
#   qualifierImage: registry.example.com/cluster-vending-qualifier:v0.1.0
#   probeImage: busybox:1.36.1
# The node group layout: one section for both processes, because they read
# this one file (docs/architecture.md#node-groups-configuration). Flags and
# CV_* variables win over single values.
nodeGroups:
  # The bootstrap group, the default EKS managed node group: runs Karpenter,
  # CoreDNS and the EBS CSI controller (and, until PROP-03 phase 3, every
  # platform and tenant component). Tainted node.cluster-vending.io/pool=system.
  system:
    # New clusters only; an existing cluster keeps its instance types (EKS
    # cannot change them in place). A list of one architecture and one
    # vCPU/memory class, so a capacity shortage of one type does not block creation.
    instanceTypes: [t3.medium]
    # The fixed size, at least 2: Karpenter runs two replicas with
    # anti-affinity. Applies to every cluster, in place. (maxSize is
    # deprecated: a value still set is warned about.)
    minSize: 2
    # New clusters only: ON_DEMAND or SPOT.
    capacityType: ON_DEMAND
    # New clusters only, in GiB; 0: EKS's default.
    diskSizeGiB: 0
  # The platform pool, the Karpenter NodePool and EC2NodeClass "platform-pool"
  # (built and empty until PROP-03 phase 3 places components on it).
  platform:
    instanceFamilies: [t3]             # testing default; production: m7i, m6i (PROP-03 4.6)
    instanceSizes: [large, xlarge, 2xlarge]
    architectures: [AMD64]          # one per pool
    capacityTypes: [ON_DEMAND]      # SPOT is refused in this version
    limits:
      cpu: 128
      memory: 512Gi
    consolidationPolicy: WhenEmpty  # or WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    expireAfter: 336h
    terminationGracePeriod: 1h
    disruptionBudget: 1             # nodes disrupted at once
    maxPods: 0                      # 0: Karpenter's default for the shape
  # What users may create as their own node groups (Karpenter NodePools).
  karpenter:
    # Families (and, below, types) user groups may use; an empty list
    # restricts nothing. t3 is x86 and burstable.
    instanceFamilies: [t3]
    instanceTypes: []
    # Applied to a user group that leaves them unset.
    defaults:
      architectures: [AMD64]
      capacityTypes: [ON_DEMAND]
