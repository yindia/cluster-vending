# Optional OIDC: uncomment this auth block to enable API and UI login
# (`make keycloak` starts the local issuer). Authentication only: any user
# who can log in may call everything, for every tenant; there are no roles.
# auth:
#     mode: required
#     issuers:
#         - name: keycloak
#           issuer: http://localhost:18080/realms/cluster-vending
#           audiences:
#             - cv-api
#           usernameClaim: preferred_username
aws-management-role-arn: arn:aws:iam::111122223333:role/cluster-vending-provisioner
context: kind-cluster-vending
http-addr: 127.0.0.1:8080
log-format: text
log-level: debug
provider-credentials-secret: tenant-acme/aws-e919d8e2-credentials
# The live reader (`make run-live`): `serve` reads node lists and node totals
# through it. allowWithoutAuth lets it run with auth.mode none; local
# development only, never in a deployment (PROP-02 7.5).
live:
  url: http://127.0.0.1:8090
  addr: 127.0.0.1:8090
  # /metrics only, apart from the internal endpoint (the chart's 8091).
  metricsAddr: 127.0.0.1:8091
  allowWithoutAuth: true
# The controller's own settings (`make run-controller` reads this same file;
# `serve` ignores them). Its AWS credentials are never here: export
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (and AWS_SESSION_TOKEN) in the
# shell that runs it.
# One local controller: no leader election Lease, which a killed controller
# would leave behind for the next start to wait out.
leader-elect: false
health-probe-addr: 127.0.0.1:8081
# The controller's Prometheus metrics (docs/local-development.md#metrics).
metrics-addr: 127.0.0.1:8082
automatic-upgrades: true
# Local testing only: act with the Secret's keys directly, without assuming
# the account's tenant role. Needs provider-credentials-secret.
skip-tenant-role: true
# The node group layout: one section for both processes, because they read
# this one file (docs/architecture.md#node-groups-configuration). Flags and
# CV_* variables win over single values.
nodeGroups:
  # Every cluster has exactly these two node groups, the platform's; tenants
  # define none. A change of instanceTypes, capacityType, amiType or
  # diskSizeGiB replaces each cluster's system group (EKS cannot change them
  # in place): the new group is created first and the old one retired once
  # the new one is Ready, rolled out like a code change.
  #
  # The system group, the default EKS managed node group: runs Karpenter and
  # the EKS add-ons only. Tainted node.cluster-vending.io/pool=system.
  system:
    # A list of one architecture and one vCPU/memory class, so a capacity
    # shortage of one type does not block creation.
    instanceTypes: [t3.medium]
    # The static size (min = max = desired), 3 by default, at least 2: Karpenter runs two
    # replicas with anti-affinity. Nothing autoscales the group. Changed in
    # place. (maxSize is ignored: a value still set is warned about.)
    minSize: 3
    # ON_DEMAND or SPOT.
    capacityType: ON_DEMAND
    # The EKS AMI type, of the instance types' architecture:
    # AL2023_x86_64_STANDARD, AL2023_ARM_64_STANDARD, BOTTLEROCKET_x86_64 or
    # BOTTLEROCKET_ARM_64.
    amiType: AL2023_x86_64_STANDARD
    # In GiB; 0: EKS's default.
    diskSizeGiB: 0
  # The platform pool, the Karpenter NodePool and EC2NodeClass
  # "platform-pool": where every other platform and tenant component runs.
  platform:
    instanceFamilies: [t3]             # testing default; production: m7i, m6i (PROP-03 4.6)
    instanceSizes: [large, xlarge, 2xlarge]
    architectures: [AMD64]          # one per pool
    capacityTypes: [ON_DEMAND]      # SPOT is refused in this version
    limits:
      cpu: 128
      memory: 512Gi
    consolidationPolicy: WhenEmpty  # or WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    expireAfter: 336h
    terminationGracePeriod: 1h
    disruptionBudget: 1             # nodes disrupted at once
    maxPods: 0                      # 0: Karpenter's default for the shape

# How the Crossplane providers run: one DeploymentRuntimeConfig each
# (cluster-vending-aws-<service>, cluster-vending-helm), server-side applied
# by the controller on every start (--install-providers), so a change here
# reaches the running providers; a field an operator set by hand under
# another field manager is kept. defaults apply to every provider, an
# override to one, field by field over the defaults. Without the section:
# these values, the platform's (docs/architecture.md#provider-runtime).
providers:
  defaults:
    # One active replica (leader election); 2 or more for hot standbys.
    replicas: 1
    # How often each resource is checked for drift.
    poll: 10m
    # Reconciles a second at most (AWS API throttling punishes more).
    maxReconcileRate: 10
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  overrides:
    # Most resources and the largest schemas; EC2's change rarely. At most
    # 30m: the network's observation bound is derived from it.
    provider-aws-ec2:
      poll: 30m
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: "2", memory: 2Gi}
    provider-aws-eks:
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {cpu: "2", memory: 2Gi}
    # A few resources per cluster each.
    provider-aws-kms:
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {cpu: 500m, memory: 768Mi}
    provider-aws-sqs:
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {cpu: 500m, memory: 768Mi}
    provider-aws-cloudwatchevents:
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {cpu: 500m, memory: 768Mi}
    provider-aws-cloudwatchlogs:
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {cpu: 500m, memory: 768Mi}
    provider-aws-s3:
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {cpu: 500m, memory: 768Mi}
    # Reads workload clusters only; spec changes reach it through its watch.
    provider-helm:
      poll: 30s
      maxReconcileRate: 100
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
