# Settings for `make run-controller`: the controller against the kind
# cluster from hack/start.sh. Flags and CV_* environment variables win over
# this file.
#
# Its own AWS credentials are never here: export AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY (and AWS_SESSION_TOKEN for temporary keys) in the
# shell that runs it. Every lookup assumes the tenant role of the account it
# reads, so that role must trust the IAM user or role of those keys.
context: kind-cluster-vending
log-format: text
log-level: debug
# One local controller: no leader election Lease. With it, a controller
# that was killed leaves the Lease behind and the next start waits for it
# to expire.
leader-elect: false
health-probe-addr: 127.0.0.1:8081
# The IAM role the Crossplane AWS providers would run as with IRSA; the
# management account is taken from it. PLACEHOLDER: on kind there is no
# IRSA, the providers use the Secret below, and this only has to be a valid
# role ARN of the management account.
aws-management-role-arn: arn:aws:iam::642299167759:role/cluster-vending-provisioner
# Kind has no IRSA: the providers authenticate with the AWS keys in this
# Secret (an AWS shared credentials file under the key, default
# "credentials"), then assume each account's tenant role. Create it once
# (docs/controller.md, "Local run"), then uncomment:
provider-credentials-secret: tenant-acme/aws-e919d8e2-credentials
# Local testing only: act with the Secret's keys directly, without assuming
# the account's tenant role (for an account whose organization policy
# forbids assuming roles). Needs provider-credentials-secret.
automatic-upgrades: true
skip-tenant-role: true

# The node group layout: the same section in the server's and the
# controller's file, so they cannot drift (docs/controller.md). Flags and
# CV_* variables win over single values.
nodeGroups:
  # The default EKS managed node group: runs Karpenter, CoreDNS, every
  # platform component, the tenant's components and the EKS add-on
  # controllers, tainted node.cluster-vending.io/pool=system:NoSchedule.
  system:
    # New clusters only; an existing cluster keeps its instance type (EKS
    # cannot change it in place, the node group would be replaced).
    instanceType: t3.medium
    # Desired = min = max, no autoscaler; at least 2 (Karpenter runs two
    # replicas with anti-affinity). Resizes existing clusters in place.
    size: 2
    # New clusters only: ON_DEMAND or SPOT.
    capacityType: ON_DEMAND
    # New clusters only, in GiB; 0: EKS's default.
    diskSizeGiB: 0
  # What users may create as their own node groups (Karpenter NodePools).
  karpenter:
    # Families (and, below, types) user groups may use; an empty list
    # restricts nothing. t3 is x86 and burstable.
    instanceFamilies: [t3]
    instanceTypes: []
    # Applied to a user group that leaves them unset.
    defaults:
      architectures: [AMD64]
      capacityTypes: [ON_DEMAND]
