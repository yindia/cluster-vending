# The demo's account (hack/demo/demo.tape). __ACCOUNT_ID__ is replaced
# from $DEMO_ACCOUNT_ID when the demo runs; nothing real is committed.
apiVersion: cluster-vending.io/v1
kind: CloudAccount
metadata:
  name: demo
  tenant: demo
spec:
  aws:
    accountId: "__ACCOUNT_ID__"
    role: cluster-vending-provisioner   # the role the CloudFormation stack creates
