# The demo's cluster (hack/demo/demo.tape): created on Kubernetes 1.36 on
# the alpha channel (1.37) with automatic upgrades, so the controller
# upgrades it to 1.37 by itself. __NETWORK_ID__ is the id `network create`
# returns.
apiVersion: cluster-vending.io/v1
kind: Cluster
metadata:
  name: demo-__RUN__-eks
  tenant: __TENANT__
  displayName: Demo EKS
  labels: {env: demo}
spec:
  region: __REGION__
  network:
    networkId: __NETWORK_ID__
  controlPlane:
    kubernetesVersion: "1.36"           # one minor behind alpha's 1.37
    endpointAccess:
      publicAccessCidrs: ["0.0.0.0/0"]
  defaultNodePool:
    instanceTypes: [t3.medium]
    diskSizeGb: 30
    scalingConfig: {minSize: 2, maxSize: 3}
  releaseChannel: RELEASE_CHANNEL_ALPHA  # alpha offers 1.37
  upgradeMode: UPGRADE_MODE_AUTOMATIC    # follow the channel's minor
  tier: CLUSTER_TIER_2                   # upgraded first
  access:
    adminPrincipals: []
  aws:                                   # the cloud (required): AWS settings of the EKS cluster
    irsa: true                           # the IAM OIDC provider: the platform components' IAM roles need it (default for a new cluster)
    upgradePolicy:
      supportType: AWS_SUPPORT_TYPE_STANDARD
