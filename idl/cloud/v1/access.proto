syntax = "proto3";

package cloud.v1;

import "buf/validate/validate.proto";
import "cloud/v1/options.proto";

// AccessSpec controls who can use the Kubernetes API. On a cluster the
// platform creates, its own provisioning identity is an admin (AWS:
// accessConfig.bootstrapClusterCreatorAdminPermissions = true); it is not
// listed here. An imported cluster keeps the value it had (EKS cannot
// change it).
message AccessSpec {
  // Principals granted cluster-admin, in the provider's native form. Mutable;
  // removing a principal revokes its access.
  //   AWS   IAM role or user ARN, e.g. "arn:aws:iam::111122223333:role/ops".
  //         One AccessEntry (type STANDARD) plus one AccessPolicyAssociation
  //         (AmazonEKSClusterAdminPolicy, accessScope.type = cluster) each.
  //         Needs authenticationMode API or API_AND_CONFIG_MAP.
  //   GCP   IAM member, e.g. "group:platform@example.com": a cluster-admin
  //         ClusterRoleBinding (groups via authenticatorGroupsConfig).
  //   Azure Entra ID group object ID:
  //         azureActiveDirectoryRoleBasedAccessControl.adminGroupObjectIds.
  repeated string admin_principals = 1 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 2048
      }
    }
  }];

  // AWS: EKS access entries beyond the admins, each a principal with the
  // access policies it gets. Mutable: entries and policies are added,
  // removed and changed without touching the cluster. A principal listed
  // here must not be in admin_principals. Needs authenticationMode API or
  // API_AND_CONFIG_MAP.
  //   AWS   one AccessEntry each, plus one AccessPolicyAssociation per
  //         policy
  repeated AccessEntry access_entries = 2 [(buf.validate.field).repeated.max_items = 50];

  option (buf.validate.message).cel = {
    id: "access_entries.unique"
    message: "access_entries principals must be unique"
    expression: "this.access_entries.map(e, e.principal_arn).unique()"
  };
}

// AccessEntryType is AccessEntry.type: what kind of principal the entry is
// for. Only STANDARD entries take access policies; the node types let
// self-managed nodes of that kind join the cluster.
enum AccessEntryType {
  // Server default: STANDARD.
  ACCESS_ENTRY_TYPE_UNSPECIFIED = 0;
  ACCESS_ENTRY_TYPE_STANDARD = 1 [(crossplane) = {aws: "STANDARD"}];
  ACCESS_ENTRY_TYPE_EC2_LINUX = 2 [(crossplane) = {aws: "EC2_LINUX"}];
  ACCESS_ENTRY_TYPE_EC2_WINDOWS = 3 [(crossplane) = {aws: "EC2_WINDOWS"}];
  ACCESS_ENTRY_TYPE_FARGATE_LINUX = 4 [(crossplane) = {aws: "FARGATE_LINUX"}];
  ACCESS_ENTRY_TYPE_EC2 = 5 [(crossplane) = {aws: "EC2"}];
  ACCESS_ENTRY_TYPE_HYBRID_LINUX = 6 [(crossplane) = {aws: "HYBRID_LINUX"}];
  ACCESS_ENTRY_TYPE_HYPERPOD_LINUX = 7 [(crossplane) = {aws: "HYPERPOD_LINUX"}];
}

// AccessEntry is one EKS access entry.
message AccessEntry {
  option (buf.validate.message).cel = {
    id: "access_entry.policies_standard_only"
    message: "only STANDARD access entries take policies"
    expression: "size(this.policies) == 0 || this.type == 0 || this.type == 1"
  };
  option (buf.validate.message).cel = {
    id: "access_entry.unique_policies"
    message: "an access entry lists each policy once"
    expression: "this.policies.map(p, p.policy_arn).unique()"
  };

  // IAM role or user ARN (AccessEntry.principalArn). Service-linked roles
  // are refused: EKS manages their entries.
  string principal_arn = 1 [(buf.validate.field).string = {
    pattern: "^arn:aws[a-z-]*:iam::[0-9]{12}:(role|user)/[A-Za-z0-9+=,.@_/-]+$"
    not_contains: ":role/aws-service-role/"
  }];

  // AccessEntry.type. Defaults to STANDARD.
  AccessEntryType type = 2 [(buf.validate.field).enum.defined_only = true];

  // The access policies of the entry (AccessPolicyAssociation).
  repeated AccessPolicy policies = 3 [(buf.validate.field).repeated.max_items = 20];
}

// AccessPolicyScope is AccessPolicyAssociation.accessScope.type.
enum AccessPolicyScope {
  // Server default: CLUSTER.
  ACCESS_POLICY_SCOPE_UNSPECIFIED = 0;
  // The whole cluster.
  ACCESS_POLICY_SCOPE_CLUSTER = 1 [(crossplane) = {aws: "cluster"}];
  // The namespaces listed in AccessPolicy.namespaces.
  ACCESS_POLICY_SCOPE_NAMESPACE = 2 [(crossplane) = {aws: "namespace"}];
}

// AccessPolicy associates an EKS access policy with an access entry.
message AccessPolicy {
  option (buf.validate.message).cel = {
    id: "access_policy.namespaces"
    message: "namespaces are required for scope NAMESPACE and only allowed there"
    expression: "(this.scope == 2) == (size(this.namespaces) > 0)"
  };

  // EKS access policy ARN, e.g.
  // "arn:aws:eks::aws:cluster-access-policy/AmazonEKSViewPolicy".
  string policy_arn = 1 [(buf.validate.field).string.pattern = "^arn:aws[a-z-]*:eks::aws:cluster-access-policy/[A-Za-z0-9]+$"];

  // Defaults to CLUSTER.
  AccessPolicyScope scope = 2 [(buf.validate.field).enum.defined_only = true];

  // Kubernetes namespaces the policy applies to (scope NAMESPACE).
  repeated string namespaces = 3 [(buf.validate.field).repeated = {
    max_items: 50
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 63
      }
    }
  }];
}
