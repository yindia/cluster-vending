syntax = "proto3";

package cloud.v1;

import "buf/validate/validate.proto";
import "cloud/v1/cluster.proto";
import "google/protobuf/timestamp.proto";

// PauseKind is what a pause stops.
enum PauseKind {
  PAUSE_KIND_UNSPECIFIED = 0;
  // Everything: the platform and the Crossplane providers do not act on
  // what is paused (AdminService.PauseReconcile).
  PAUSE_KIND_EVERYTHING = 1;
  // Automatic changes only (AdminService.Freeze): no Kubernetes upgrade,
  // release move, add-on upgrade or code change starts; the clusters are
  // reconciled, repaired and updated as users ask.
  PAUSE_KIND_AUTOMATIC_CHANGES = 2;
}

// PauseRecord is one pause as an operator asked for it: what it covers,
// what it stops, who asked, when, why and until when.
message PauseRecord {
  // What it covers, for people: "tenant acme", "network <id>", "cluster
  // <id>", "channel beta", "channel beta tier 0".
  string target = 1;
  // The target's fields: a tenant (with a network or cluster ID for one of
  // them), or a channel with an optional tier.
  string tenant_id = 2;
  string network_id = 3;
  string cluster_id = 4;
  ReleaseChannel channel = 5;
  ClusterTier tier = 6;
  PauseKind kind = 7;
  string by = 8;
  google.protobuf.Timestamp since = 9;
  // When it ends by itself; unset: at a resume only.
  google.protobuf.Timestamp until = 10;
  string reason = 11;
  // How many clusters it covers now: a freeze of a channel (or a tenant)
  // covers the clusters that join it later too; a full pause by channel
  // covers the clusters that matched when it was asked.
  int32 clusters = 12;
}

message ListPausesRequest {}

message ListPausesResponse {
  // Every pause and freeze in effect, full pauses first, each by target.
  repeated PauseRecord pauses = 1;
}

// FreezeRequest names what a freeze covers: nothing set is the platform
// (every cluster and network); else a tenant, or a release channel with an
// optional tier.
message FreezeRequest {
  option (buf.validate.message).cel = {
    id: "freeze.one_target"
    message: "set tenant_id or channel, not both (neither: the platform)"
    expression: "size(this.tenant_id) == 0 || this.channel == 0"
  };
  option (buf.validate.message).cel = {
    id: "freeze.tier_channel"
    message: "tier needs channel"
    expression: "this.tier == 0 || this.channel != 0"
  };

  // Why, shown on every frozen cluster ("the platform is frozen: <reason>").
  string reason = 1 [(buf.validate.field).string.max_len = 512];
  // Freeze only this tenant's clusters (and their networks), those
  // created later too.
  string tenant_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      max_len: 56
      pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
    }
  ];
  // Freeze only the clusters on this channel, those that join it later
  // too.
  ReleaseChannel channel = 3 [(buf.validate.field).enum.defined_only = true];
  // Only the channel's clusters of this tier (no tier: tier 0).
  ClusterTier tier = 4 [(buf.validate.field).enum.defined_only = true];
  // When the freeze ends by itself; unset: at an unfreeze only. In the
  // future.
  google.protobuf.Timestamp until = 5;
}

message FreezeResponse {
  // How many clusters it holds now.
  int32 clusters = 1;
}

message UnfreezeRequest {
  // The freeze, named as it was asked for (FreezeRequest): none of
  // tenant_id and channel is the platform's.
  string tenant_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      max_len: 56
      pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
    }
  ];
  ReleaseChannel channel = 4 [(buf.validate.field).enum.defined_only = true];
  ClusterTier tier = 5 [(buf.validate.field).enum.defined_only = true];
  // Set: let this cluster through (and its network), the freeze stays.
  // Not with network_id. Neither: lift the freeze.
  string cluster_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Set: let this network through, the freeze stays.
  string network_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  option (buf.validate.message).cel = {
    id: "unfreeze.one_target"
    message: "set cluster_id or network_id, not both"
    expression: "this.cluster_id == '' || this.network_id == ''"
  };
  option (buf.validate.message).cel = {
    id: "unfreeze.freeze_target"
    message: "set tenant_id or channel, not both (neither: the platform)"
    expression: "size(this.tenant_id) == 0 || this.channel == 0"
  };
  option (buf.validate.message).cel = {
    id: "unfreeze.tier_channel"
    message: "tier needs channel"
    expression: "this.tier == 0 || this.channel != 0"
  };
}

message UnfreezeResponse {
  // What happened, for people: "the platform is not frozen any more", or
  // "cluster <id> is let through; 3 clusters are let through".
  string note = 1;
}
