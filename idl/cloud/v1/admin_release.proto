syntax = "proto3";

package cloud.v1;

import "buf/validate/validate.proto";
import "cloud/v1/cluster.proto";
import "cloud/v1/conditions.proto";
import "cloud/v1/freeze.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// The platform's release configuration as the operators read it
// (AdminService): the releases, the channels that offer them, the
// rollout of each channel's Kubernetes minor and the holds that keep
// clusters out of it. Read-only: the objects are written with kubectl or
// from Git (docs/architecture.md#releases-channels-and-rollouts).

// Release is a published release: what clusters run, per Kubernetes minor.
message Release {
  // The Release object's name, e.g. shipped-1aed928c.
  string name = 1;
  // Shipped: the controller created it from its build.
  bool shipped = 2;
  // Valid: the release's checks passed; invalid_reason says why not.
  bool valid = 3;
  string invalid_reason = 4;
  // Withdrawn: no channel may offer it any more.
  bool withdrawn = 5;
  // The channels offering it now.
  repeated ReleaseChannel channels = 6;
  // The holds naming it.
  repeated string holds = 7;
  google.protobuf.Timestamp create_time = 8;
  // The supported Kubernetes minors, newest first. GetRelease only.
  repeated ReleaseMinor kubernetes = 9;
  // Notes for operators and tenants. GetRelease only.
  string notes = 10;
  // The release order: a higher serial is a newer release. 0: the release
  // predates serials (older than any that has one).
  int64 serial = 11;
}

// ReleaseMinor is what clusters on one Kubernetes minor run.
message ReleaseMinor {
  // e.g. "1.37".
  string minor = 1;
  // The channel whose clusters run it; UNSPECIFIED: none.
  ReleaseChannel channel = 2;
  // The minor a new cluster on no channel gets.
  bool default = 3;
  // The minor its automatic clusters move to next, if any.
  string upgrade_to = 4;
  google.protobuf.Timestamp end_of_support = 5;
  // Ending: offered but on no channel; its users are warned to move off.
  bool ending = 6;
  // The components the platform installs on it.
  repeated ReleaseComponent components = 7;
}

// ReleaseComponent is a component the platform installs, at its version.
message ReleaseComponent {
  string name = 1;
  string version = 2;
  // The Helm values the release locks for it on this minor; unset: none.
  google.protobuf.Struct values = 3;
}

// ReleaseChannelInfo is a channel's settings and what it offers.
message ReleaseChannelInfo {
  ReleaseChannel channel = 1;
  // AUTOMATIC, MANUAL or PINNED, as the object spells it.
  string promotion = 2;
  // The release a Manual or Pinned channel names (spec.release).
  string pinned_release = 3;
  // The release it offers now (status.release).
  string release = 4;
  // The Kubernetes minor that release puts on the channel.
  string kubernetes_minor = 5;
  // Paused: no cluster starts.
  bool paused = 6;
  RolloutPolicy policy = 7;
  // The tier the rollout is at: 2, then 1, then 0.
  ClusterTier rollout_tier = 8;
  RolloutSummary rollout = 9;
  // The releases it offered, newest first. GetReleaseChannel only.
  repeated ChannelHistoryEntry history = 10;
  repeated Condition conditions = 11;
  google.protobuf.Timestamp create_time = 12;
  // The release an Automatic channel takes once its release soak ends;
  // unset when it waits for none.
  PendingRelease pending = 13;
  // The rollout of the channel's release to its clusters' components
  // (release moves), tier 2 first; unset when none is planned.
  ChangeRollout release_moves = 14;
  // The rollout of code changes (a new controller build rendering the
  // clusters' objects differently), tier 2 first; unset when none is
  // planned.
  ChangeRollout code_changes = 15;
}

// ChangeRollout is a rollout of something other than the Kubernetes minor
// (release moves, code changes) to a channel's clusters, planned like it.
message ChangeRollout {
  // What the clusters move to: a release; empty for code changes.
  string target = 1;
  // The clusters (namespace/name) that may start now.
  repeated string admitted = 2;
  // Why no (more) cluster starts; when halted, why it halted.
  string waiting = 3;
  bool halted = 4;
  // Every member has it.
  bool done = 5;
  // Tier 2 first.
  repeated RolloutTier tiers = 6;
  // Clusters kept back by their own checks: the gate's code and message.
  repeated BlockedMember blocked = 7;
}

// BlockedMember is a cluster a rollout keeps back, and why.
message BlockedMember {
  // namespace/name.
  string cluster = 1;
  string gate = 2;
  string reason = 3;
}

// PendingRelease is the release an Automatic channel waits to take.
message PendingRelease {
  string release = 1;
  // When the upstream channel started offering it.
  google.protobuf.Timestamp since = 2;
  // When the release soak ends and the channel takes it.
  google.protobuf.Timestamp until = 3;
}

// RolloutPolicy is how a channel's rollout moves through the tiers.
message RolloutPolicy {
  // Clusters upgrading at once per tier (tier 0: always 1).
  int32 max_in_progress = 1;
  // Failures in a tier before the channel halts.
  int32 max_failed = 2;
  // Healthy time after a tier before the next one starts, e.g. "24h0m0s".
  string soak = 3;
  // soak per tier, by tier: "Tier0", "Tier1", "Tier2".
  map<string, string> soak_per_tier = 4;
  // How long the upstream channel must have offered a release before an
  // Automatic channel takes it, e.g. "168h0m0s"; empty: the default
  // (beta 7 days, stable 14).
  string release_soak = 5;
}

// ChannelHistoryEntry is one release a channel offered.
message ChannelHistoryEntry {
  string release = 1;
  google.protobuf.Timestamp from = 2;
  // Unset for the release offered now.
  google.protobuf.Timestamp to = 3;
  string reason = 4;
}

// RolloutState is a cluster's place in a rollout.
enum RolloutState {
  ROLLOUT_STATE_UNSPECIFIED = 0;
  // Waiting for its turn.
  ROLLOUT_STATE_PENDING = 1;
  // Upgrading now.
  ROLLOUT_STATE_IN_PROGRESS = 2;
  // Runs the channel's minor.
  ROLLOUT_STATE_SUCCEEDED = 3;
  // Its upgrade failed.
  ROLLOUT_STATE_FAILED = 4;
  // Kept back by its own gates (reason); it does not hold the rollout.
  ROLLOUT_STATE_BLOCKED = 5;
}

// RolloutTier counts one tier's clusters by state.
message RolloutTier {
  ClusterTier tier = 1;
  int32 pending = 2;
  int32 in_progress = 3;
  int32 succeeded = 4;
  int32 failed = 5;
  int32 blocked = 6;
}

// RolloutSummary is what a channel's rollout does now.
message RolloutSummary {
  // The minor the channel's clusters move to.
  string target_minor = 1;
  // Automatic upgrades are off: the rollout is planned and reported only.
  bool report_only = 2;
  // Why no (more) cluster starts; when halted, why it halted.
  string waiting = 3;
  bool halted = 4;
  // Every cluster runs the minor, or is kept back by its own gates.
  bool done = 5;
  // The clusters (namespace/name) that start now, or would.
  repeated string would_start = 6;
  // Tier 2 first.
  repeated RolloutTier tiers = 7;
}

// RolloutMember is one cluster of a channel's rollout.
message RolloutMember {
  ClusterTier tier = 1;
  string tenant_id = 2;
  string cluster_id = 3;
  string cluster_name = 4;
  // The version it runs.
  string current_version = 5;
  // The minor it moves to next (one minor at a time), or runs once there.
  string target_version = 6;
  RolloutState state = 7;
  // When it entered its state; unset when unknown.
  google.protobuf.Timestamp since = 8;
  // Why it is blocked: the gate's code (MANUAL, MAINTENANCE_WINDOW, ...)
  // and its message for people.
  string gate = 9;
  string reason = 10;
}

// Rollout is a channel's rollout of its Kubernetes minor.
message Rollout {
  ReleaseChannel channel = 1;
  // The release the channel offers.
  string release = 2;
  // The tier the rollout is at: 2, then 1, then 0.
  ClusterTier rollout_tier = 3;
  RolloutPolicy policy = 4;
  bool paused = 5;
  RolloutSummary summary = 6;
  // The channel's clusters in the rollout, tier 2 first.
  repeated RolloutMember members = 7;
  // How the rollout proceeds from now, per tier and batch, as the
  // controller plans it.
  RolloutPlan plan = 8;
}

// RolloutPlan is a channel's rollout laid out per tier and batch: the
// tiers in rollout order (2, 1, 0), each tier's clusters in batches of at
// most max_in_progress (tier 0: one), finished ones by when they ended,
// then the batch upgrading or next and the queued ones by name.
message RolloutPlan {
  // A tier is rolling (or soaking toward): rolling_tier, at batch of
  // batches (1-based).
  bool rolling = 1;
  ClusterTier rolling_tier = 2;
  int32 batch = 3;
  int32 batches = 4;
  bool done = 5;
  bool halted = 6;
  repeated RolloutTierPlan tiers = 7;
}

// RolloutTierState is where a tier is in the rollout.
enum RolloutTierState {
  ROLLOUT_TIER_STATE_UNSPECIFIED = 0;
  // None of its clusters waits or upgrades.
  ROLLOUT_TIER_STATE_DONE = 1;
  // Its clusters are upgraded, a batch at a time.
  ROLLOUT_TIER_STATE_ROLLING = 2;
  // It is next, and waits for the tier before it to soak.
  ROLLOUT_TIER_STATE_SOAKING = 3;
  // A tier before it is not done (or the rollout halted).
  ROLLOUT_TIER_STATE_NOT_STARTED = 4;
  // More of its clusters failed than max_failed: the channel halted.
  ROLLOUT_TIER_STATE_HALTED = 5;
}

// RolloutTierPlan is one tier of a rollout plan.
message RolloutTierPlan {
  ClusterTier tier = 1;
  RolloutTierState state = 2;
  int32 total = 3;
  int32 done = 4;
  int32 in_progress = 5;
  int32 failed = 6;
  int32 blocked = 7;
  // Failures it may have before the channel halts.
  int32 max_failed = 8;
  // Clusters upgraded at once.
  int32 batch_size = 9;
  // When its last upgrade ended, and when the next tier may start
  // (that plus its soak); unset while none ended.
  google.protobuf.Timestamp finished_time = 10;
  google.protobuf.Timestamp soak_until = 11;
  repeated RolloutBatch batches = 12;
  // Index in batches of the batch upgrading or next; -1 when all are
  // finished.
  int32 current = 13;
  // Clusters blocked by their own gate: in no batch; one joins the batch
  // being filled when its gate clears.
  repeated RolloutPlanCluster waits = 14;
}

// RolloutBatch is clusters upgraded together.
message RolloutBatch {
  repeated RolloutPlanCluster clusters = 1;
}

// RolloutPlanCluster is a cluster in a rollout plan.
message RolloutPlanCluster {
  string tenant_id = 1;
  string cluster_name = 2;
  string cluster_id = 3;
  RolloutState state = 4;
  // The step its upgrade is at (ControlPlane, NodesAndAddons, ...) while
  // in progress.
  string phase = 5;
  // When it entered its state; unset when unknown.
  google.protobuf.Timestamp since = 6;
  // Why it waits (blocked) or failed.
  string reason = 7;
}

message ListReleasesRequest {
  // Maximum results per page. Defaults to 50; values above 200 are coerced
  // to 200.
  int32 page_size = 1 [(buf.validate.field).int32.gte = 0];
  // next_page_token from a previous call.
  string page_token = 2;
}

message ListReleasesResponse {
  // Newest first.
  repeated Release releases = 1;
  // Empty when there are no more results.
  string next_page_token = 2;
}

message GetReleaseRequest {
  // The Release object's name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];
}

message GetReleaseResponse {
  Release release = 1;
}

// The three channels: no pagination.
message ListReleaseChannelsRequest {}

message ListReleaseChannelsResponse {
  // alpha, beta, stable.
  repeated ReleaseChannelInfo channels = 1;
}

message GetReleaseChannelRequest {
  ReleaseChannel channel = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message GetReleaseChannelResponse {
  ReleaseChannelInfo channel = 1;
  // The channel's Kubernetes rollout planned now, the way the controller
  // plans it (pkg/rollout), from what the management cluster holds: per
  // tier and batch, with every cluster in it, tier 2 first.
  Rollout rollout = 2;
  Freeze freeze = 3;
}
