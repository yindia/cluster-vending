syntax = "proto3";

package cloud.v1;

import "buf/validate/validate.proto";
import "cloud/v1/admin_release.proto";

// AdminService holds operations of the platform's operators, not of
// tenants. Where the server authenticates, its RPCs need the platform
// admin role, whatever tenant the request names; with auth.mode none,
// expose it to administrators only.
service AdminService {
  // Pauses a tenant, one of its networks or one of its clusters, e.g. to
  // upgrade the Crossplane providers (docs/runbooks/provider-upgrade.md).
  // Two things happen:
  //
  //   - the pause is recorded on the tenant's cloud accounts, networks and
  //     clusters (on the one network or cluster), with who paused, when
  //     and why. The
  //     platform's controller does not act on a paused resource: it
  //     creates, changes and deletes nothing of it in the cloud or in its
  //     workload cluster, and only observes it. An update or a delete
  //     asked for meanwhile is stored and done after the resume. What is
  //     created in a paused tenant is paused from the start.
  //   - every managed resource of the scope, and the Helm releases of its
  //     platform components, get the crossplane.io/paused annotation, so
  //     the providers neither change nor delete their cloud resources.
  //
  // A network's pause is the network's alone: its clusters are not paused
  // and keep running. What of a cluster needs the network to change (new
  // subnet tags, say) waits until the network is resumed; deleting one of
  // its clusters is not held.
  //
  // A paused account, network or cluster has the condition Paused and
  // status.pause. Idempotent: a resource paused already keeps who paused
  // it, and records each scope it was paused at.
  rpc PauseReconcile(PauseReconcileRequest) returns (PauseReconcileResponse);

  // Removes the pause (PauseReconcile). A tenant's resume removes the
  // tenant's pause from everything it has, except a network or cluster
  // also paused on its own, which stays paused with the providers' pause
  // on its managed resources. A resume of one network or cluster ends its
  // pause whatever else holds it, so it runs again in a paused tenant
  // (the rest of the tenant stays paused). The controller then observes
  // each resource and applies what changed meanwhile, once. Idempotent.
  rpc ResumeReconcile(ResumeReconcileRequest) returns (ResumeReconcileResponse);

  // Lists the releases, newest first: valid or not, shipped or published,
  // and the channels and holds naming them. Read-only.
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one release with what it offers per Kubernetes minor: the
  // channel, default, upgrade target, end of support, whether it is
  // ending (on no channel), and the components with their versions and
  // locked values. NOT_FOUND when there is no such release.
  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists the three channels: what each offers, its Kubernetes minor, its
  // rollout policy and where its rollout is.
  rpc ListReleaseChannels(ListReleaseChannelsRequest) returns (ListReleaseChannelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one channel, with the releases it offered and its conditions.
  rpc GetReleaseChannel(GetReleaseChannelRequest) returns (GetReleaseChannelResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists each channel's rollout of its Kubernetes minor: the stage, the
  // counts per tier, which clusters start (or would) and why none does.
  rpc ListRollouts(ListRolloutsRequest) returns (ListRolloutsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one channel's rollout cluster by cluster, tier 2 first: what
  // each runs, the minor it moves to, its state and why it is blocked.
  // Planned the way the controller plans it (pkg/rollout), from what the
  // management cluster holds now.
  rpc GetRollout(GetRolloutRequest) returns (GetRolloutResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists the release holds: the clusters kept out of rollouts, and until
  // when.
  rpc ListReleaseHolds(ListReleaseHoldsRequest) returns (ListReleaseHoldsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message PauseReconcileRequest {
  option (buf.validate.message).cel = {
    id: "scope.one"
    message: "set at most one of cluster_id and network_id"
    expression: "size(this.cluster_id) == 0 || size(this.network_id) == 0"
  };

  // The tenant whose managed resources are paused.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];

  // Only this cluster's managed resources (Cluster.id); empty: all the
  // tenant's, networks included.
  string cluster_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  // Why, shown with the pause (status.pause.reason). Optional.
  string reason = 3 [(buf.validate.field).string.max_len = 256];

  // Only this network (Network.id): the network row and its own managed
  // resources, not its clusters. Not with cluster_id.
  string network_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message PauseReconcileResponse {
  // Managed resources that are paused now (already paused ones included).
  int32 resources = 1;
}

message ResumeReconcileRequest {
  option (buf.validate.message).cel = {
    id: "scope.one"
    message: "set at most one of cluster_id and network_id"
    expression: "size(this.cluster_id) == 0 || size(this.network_id) == 0"
  };

  // The tenant whose managed resources are resumed.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];

  // Only this cluster's managed resources (Cluster.id); empty: all the
  // tenant's.
  string cluster_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  // Only this network (Network.id): the network row and its own managed
  // resources, not its clusters. Not with cluster_id.
  string network_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message ResumeReconcileResponse {
  // Managed resources that are reconciled again now.
  int32 resources = 1;
}
