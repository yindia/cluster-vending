syntax = "proto3";

package cloud.v1;

import "cloud/v1/admin_freeze.proto";
import "cloud/v1/admin_release.proto";

// AdminService holds operations of the platform's operators, not of
// tenants. Where the server authenticates, its RPCs need the platform
// admin role, whatever tenant the request names; with auth.mode none,
// expose it to administrators only.
service AdminService {
  // Freezes the selected scope (the whole platform by default). For held resources:
  //
  //   - the platform's controllers apply no changes: no
  //     create, update, delete, repair or component install is applied,
  //     and no automatic change starts (Kubernetes upgrades, release
  //     moves, add-on upgrades, code changes from a new controller
  //     build). What users ask for meanwhile is stored and applied after
  //     the unfreeze (or once that cluster or network is let through).
  //   - affected Crossplane managed resources and the Helm
  //     releases of the platform components, get crossplane.io/paused,
  //     so the providers act on nothing either, even while the
  //     controller is down.
  //
  // Freezing again changes the reason and until, and keeps what was let
  // through. The call can be repeated: what is paused already is left.
  rpc Freeze(FreezeRequest) returns (FreezeResponse);

  // Resumes a cluster, a network with all its clusters, or an entire tenant.
  // A cluster exception leaves its shared network frozen. Broader scoped
  // unfreezes clear nested freezes. With no target, clears every freeze.
  // Resumed resources continue through their normal rollout gates.
  rpc Unfreeze(UnfreezeRequest) returns (UnfreezeResponse);

  rpc GetFreeze(GetFreezeRequest) returns (GetFreezeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists the releases, newest first: valid or not, shipped or published,
  // and the channels and holds naming them. Read-only.
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one release with what it offers per Kubernetes minor: the
  // channel, default, upgrade target, end of support, whether it is
  // ending (on no channel), and the components with their versions and
  // locked values. NOT_FOUND when there is no such release.
  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists the three channels: what each offers, its Kubernetes minor, its
  // rollout policy and where its rollout is.
  rpc ListReleaseChannels(ListReleaseChannelsRequest) returns (ListReleaseChannelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns one channel, with the releases it offered, its conditions,
  // its release moves, and its Kubernetes rollout planned now: tier by
  // tier and batch by batch, each cluster with what it runs, the minor it
  // moves to, its state and why it is blocked.
  rpc GetReleaseChannel(GetReleaseChannelRequest) returns (GetReleaseChannelResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
