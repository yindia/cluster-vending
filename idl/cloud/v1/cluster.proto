syntax = "proto3";

package cloud.v1;

import "buf/validate/validate.proto";
import "cloud/v1/access.proto";
import "cloud/v1/aws.proto";
import "cloud/v1/code_change.proto";
import "cloud/v1/component.proto";
import "cloud/v1/conditions.proto";
import "cloud/v1/control_plane.proto";
import "cloud/v1/deprecation.proto";
import "cloud/v1/events.proto";
import "cloud/v1/freeze.proto";
import "cloud/v1/import.proto";
import "cloud/v1/managed_resource.proto";
import "cloud/v1/network.proto";
import "cloud/v1/node_group.proto";
import "cloud/v1/node_pool.proto";
import "cloud/v1/recommendation.proto";
import "google/protobuf/timestamp.proto";

// Cluster is a managed Kubernetes cluster owned by exactly one tenant.
message Cluster {
  // Tenant that owns the cluster. Output only: set by the server from the
  // request's tenant_id.
  string tenant_id = 1;

  // Output only. Assigned by the server on create (UUID); every other call
  // refers to the cluster by it.
  string id = 2;

  // Name chosen by the client: DNS-label safe. It is the cloud cluster's
  // name (AWS: the EKS cluster name) and the Cluster object's, unique per
  // tenant: CreateCluster fails with ALREADY_EXISTS when another cluster of
  // the tenant has it. A cluster of the name that the platform did not
  // create is found by the controller before anything is created: the new
  // cluster becomes FAILED. The cluster's other cloud and Kubernetes resources are
  // named "<name>-<hash8>-...". Immutable.
  string name = 11 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
    pattern: "^[a-z]([a-z0-9-]{0,38}[a-z0-9])?$"
  }];

  // Human-friendly name. Mutable.
  string display_name = 3 [(buf.validate.field).string.max_len = 128];

  // Labels, for grouping and filtering, and applied as tags to every cloud
  // resource of the cluster (next to the platform's own ownership tags,
  // hence 40, below AWS's 50). Mutable: an update re-tags the resources.
  // Keys and values follow the AWS tag rules; keys starting with "aws:"
  // are refused for AWS (the server checks: the cloud is the network's
  // account).
  //   AWS   forProvider.tags
  //   GCP   forProvider.resourceLabels / labels
  //   Azure forProvider.tags
  map<string, string> labels = 4 [(buf.validate.field).map = {
    max_pairs: 40
    keys: {
      string: {
        min_len: 1
        max_len: 128
        pattern: "^[A-Za-z0-9 _.:/=+@-]+$"
      }
    }
    values: {
      string: {
        max_len: 256
        pattern: "^[A-Za-z0-9 _.:/=+@-]*$"
      }
    }
  }];

  // Desired state.
  ClusterSpec spec = 5 [(buf.validate.field).required = true];

  // Observed state. Output only; ignored on create and update.
  ClusterStatus status = 6;

  // Incremented by the server on every spec change. Output only.
  int64 generation = 7;

  // Opaque version token for optimistic concurrency. Output only. Pass it
  // back on UpdateCluster / DeleteCluster to reject stale writes.
  string etag = 8;

  // Output only.
  google.protobuf.Timestamp create_time = 9;
  // Output only.
  google.protobuf.Timestamp update_time = 10;
}

// ClusterSpec is the desired state of a cluster.
//
// It is one provider-neutral contract: region, network, control_plane,
// default_node_pool and tags mean the same thing on every cloud and each
// field documents its Crossplane mapping per provider. The `provider` oneof
// selects the cloud and carries only settings that have no cross-cloud
// equivalent. Provider-specific constraints on the common fields are the
// CEL rules below, keyed by provider.
message ClusterSpec {
  // --- AWS constraints on the common fields ---
  // Network layout rules live on NetworkSpec: a cluster only references a
  // Network.
  option (buf.validate.message).cel = {
    id: "aws.region"
    message: "region must be an AWS region, e.g. us-east-1"
    expression: "!has(this.aws) || this.region.matches('^[a-z]{2}(-gov|-iso[a-z]?)?-[a-z]+-[0-9]+$')"
  };
  option (buf.validate.message).cel = {
    id: "aws.instance_types"
    message: "AWS instance types look like m6i.large"
    expression: "!has(this.aws) || !has(this.default_node_pool) || this.default_node_pool.instance_types.all(t, t.matches('^[a-z][a-z0-9-]*[.][a-z0-9]+$'))"
  };

  option (buf.validate.message).cel = {
    id: "aws.admin_principals"
    message: "AWS admin principals must be IAM role or user ARNs, not service-linked roles (role/aws-service-role/...: EKS manages their access entries)"
    expression: "!has(this.aws) || this.access.admin_principals.all(p, p.matches('^arn:aws[a-z-]*:iam::[0-9]{12}:(role|user)/[A-Za-z0-9+=,.@_/-]+$') && !p.contains(':role/aws-service-role/'))"
  };
  option (buf.validate.message).cel = {
    id: "aws.admin_access_auth_mode"
    message: "admin_principals need authentication_mode API or API_AND_CONFIG_MAP (EKS access entries)"
    expression: "!has(this.aws) || size(this.access.admin_principals) == 0 || this.aws.access_config.authentication_mode != 3"
  };

  option (buf.validate.message).cel = {
    id: "aws.no_pod_cidr"
    message: "AWS pods take IPs from the VPC subnets (VPC CNI); network.pod_cidr must be empty"
    expression: "!has(this.aws) || this.network.pod_cidr == ''"
  };
  option (buf.validate.message).cel = {
    id: "aws.zone_ids"
    message: "AWS clusters need at least two zone_ids (EKS), given as zone IDs like use1-az1"
    expression: "!has(this.aws) || size(this.network.zone_ids) == 0 || (size(this.network.zone_ids) >= 2 && this.network.zone_ids.all(z, z.matches('^[a-z]+[0-9]-az[0-9]+$')))"
  };
  option (buf.validate.message).cel = {
    id: "aws.service_cidr_size"
    message: "EKS service_cidr must be /12 to /24"
    expression: "!has(this.aws) || this.network.service_cidr == '' || this.network.service_cidr.matches('/(1[2-9]|2[0-4])$')"
  };

  option (buf.validate.message).cel = {
    id: "public_access_cidrs_required"
    message: "control_plane.endpoint_access.public_access_cidrs needs at least one CIDR allowed to reach the public API endpoint (0.0.0.0/0 for any)"
    expression: "has(this.control_plane) && has(this.control_plane.endpoint_access) && (size(this.control_plane.endpoint_access.public_access_cidrs) > 0 || (has(this.control_plane.endpoint_access.endpoint_public_access) && !this.control_plane.endpoint_access.endpoint_public_access))"
  };

  option (buf.validate.message).cel = {
    id: "aws.access_entries_auth_mode"
    message: "access_entries need authentication_mode API or API_AND_CONFIG_MAP (EKS access entries)"
    expression: "!has(this.aws) || size(this.access.access_entries) == 0 || this.aws.access_config.authentication_mode != 3"
  };
  option (buf.validate.message).cel = {
    id: "aws.access_entries_not_admins"
    message: "a principal is either in admin_principals or in access_entries, not both"
    expression: "this.access.access_entries.all(e, !(e.principal_arn in this.access.admin_principals))"
  };

  // --- Constraints for every non-AWS provider ---
  option (buf.validate.message).cel = {
    id: "node_groups.unique_names"
    message: "node group names must be unique"
    expression: "this.node_groups.all(g, this.node_groups.exists_one(h, h.name == g.name))"
  };
  option (buf.validate.message).cel = {
    id: "oidc_aws_only"
    message: "only AWS takes access.oidc"
    expression: "has(this.aws) || !has(this.access.oidc)"
  };
  option (buf.validate.message).cel = {
    id: "single_instance_type"
    message: "only AWS accepts more than one instance type"
    expression: "has(this.aws) || !has(this.default_node_pool) || size(this.default_node_pool.instance_types) == 1"
  };

  // Region the cluster runs in. Immutable.
  //   AWS   forProvider.region, e.g. "us-east-1"
  //   GCP   forProvider.location (region), e.g. "us-central1"
  //   Azure forProvider.location, e.g. "eastus"
  string region = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z0-9-]+$"
  }];

  // Where the cluster runs: a platform Network, by id, plus the cluster's
  // pod and service ranges. Immutable.
  ClusterNetwork network = 2 [(buf.validate.field).required = true];

  // Control plane settings. Optional; every field has a default.
  ControlPlaneSpec control_plane = 3;

  // The default managed node group: the platform's system group, which runs
  // Karpenter and CoreDNS. Optional: when omitted the platform fills it.
  // Its taints, labels and scaling are managed by the platform; UpdateCluster
  // refuses a change to them (FAILED_PRECONDITION).
  NodePoolSpec default_node_pool = 4;

  // Cloud tags are the cluster's labels (Cluster.labels).
  reserved 5;
  reserved "tags";

  // Who administers the cluster. Mutable.
  AccessSpec access = 6;

  // existing_cluster was an import mode that was never implemented;
  // clusters built outside the platform are imported with
  // ClusterService.ImportCluster and TakeOverCluster. A binary request
  // that still carries field 7 is refused (UNIMPLEMENTED); JSON drops it.
  reserved 7;
  reserved "existing_cluster";

  // Which platform releases the cluster receives: how early it gets a new
  // version of what the platform runs on its clusters. It is not the
  // Kubernetes version (control_plane.kubernetes_version). Each cluster
  // can follow its own channel while inheriting its network's tier.
  ReleaseChannel release_channel = 8 [(buf.validate.field).enum.defined_only = true];

  // Legacy field: set NetworkSpec.tier instead. Nonzero values are
  // rejected on create/update. The inherited tier is in ClusterStatus.tier.
  ClusterTier tier = 9 [
    deprecated = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // Whether platform releases move the cluster (UpgradeMode). Unset is
  // stored as UPGRADE_MODE_MANUAL. Mutable, like release_channel.
  UpgradeMode upgrade_mode = 13 [(buf.validate.field).enum.defined_only = true];

  // When the platform may start an automatic upgrade of the cluster.
  // Unset: at any time. Only the start of an upgrade must fall inside the
  // window; an upgrade that started runs to its end. Mutable, like
  // upgrade_mode; changing it changes no cloud resource.
  MaintenanceWindow maintenance_window = 14;

  // Enable namespace-as-a-service through the platform-managed Capsule installation.
  // Unset defaults to false. Mutable: true installs Capsule; false removes its
  // managed Helm installation. Existing tenant workloads and CRDs may remain.
  // cert-manager is an external prerequisite and is not installed by this flag.
  optional bool naas = 15;

  // User node groups: further Karpenter NodePools, each with its own
  // EC2NodeClass (docs/architecture.md#node-layout). At most 20. One
  // update-mask path: the list is compared whole.
  repeated NodeGroupSpec node_groups = 16 [(buf.validate.field).repeated.max_items = 20];

  // The cloud the cluster runs on. Exactly one must be set, even if empty
  // (e.g. `aws: {}`).
  oneof provider {
    option (buf.validate.oneof).required = true;

    AwsClusterSpec aws = 10;
    // Kept for future providers. Not `reserved`: un-reserving later would be
    // a breaking change for buf.
    //   GcpClusterSpec   gcp   = 11;  (release channel, image type, ...)
    //   AzureClusterSpec azure = 12;  (sku tier, upgrade channels, ...)
  }
}

// ReleaseChannel is how early a cluster receives a platform release. A
// release goes to the channels in order: ALPHA, then BETA, then STABLE.
// Within a channel it goes to the clusters tier by tier (ClusterTier).
enum ReleaseChannel {
  // Not chosen: an automatic cluster (UPGRADE_MODE_AUTOMATIC) follows
  // STABLE; a manual cluster follows no channel. Kept unset in the stored
  // spec, so a later choice of mode decides.
  RELEASE_CHANNEL_UNSPECIFIED = 0;
  // First to receive a release: clusters that exist to find its problems.
  RELEASE_CHANNEL_ALPHA = 1;
  // Receives a release once it went through ALPHA.
  RELEASE_CHANNEL_BETA = 2;
  // Receives a release last, once it went through BETA.
  RELEASE_CHANNEL_STABLE = 3;
}

// ClusterTier is how sensitive a cluster is: how much depends on it. The
// lower the number, the more sensitive. Within a release channel a release
// reaches the least sensitive clusters first: tier 2, then tier 1, then
// tier 0.
enum ClusterTier {
  // Not chosen: the cluster counts as tier 0, the most sensitive, so one
  // nobody classified is the last of its channel to receive a release. A
  // created cluster is stored as CLUSTER_TIER_0.
  CLUSTER_TIER_UNSPECIFIED = 0;
  // Most sensitive: receives a release of its channel last.
  CLUSTER_TIER_0 = 1;
  // Receives a release of its channel after tier 2 and before tier 0.
  CLUSTER_TIER_1 = 2;
  // Least sensitive: receives a release of its channel first.
  CLUSTER_TIER_2 = 3;
}

// UpgradeMode is whether platform releases move a cluster.
// MaintenanceWindow is a weekly time when an upgrade of the cluster may
// start, in UTC: every day in days, from start for duration. A window may
// run past midnight: Saturday 23:00 for 4h is open until Sunday 03:00.
message MaintenanceWindow {
  option (buf.validate.message).cel = {
    id: "maintenance_window.duration"
    message: "duration must be from 1h to 24h, written like 4h, 90m or 1h30m"
    expression: "this.duration.matches('^([0-9]+h)?([0-9]+m)?$') && this.duration != '' && duration(this.duration) >= duration('1h') && duration(this.duration) <= duration('24h')"
  };

  // The days the window opens on. Empty: every day.
  repeated Weekday days = 1 [(buf.validate.field).repeated = {
    unique: true
    max_items: 7
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];

  // When the window opens, "HH:MM" in UTC, e.g. "02:00".
  string start = 2 [(buf.validate.field).string.pattern = "^([01][0-9]|2[0-3]):[0-5][0-9]$"];

  // How long the window stays open, from 1h to 24h: "4h", "90m", "1h30m".
  string duration = 3;
}

// Weekday is a day of the week.
enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_MONDAY = 1;
  WEEKDAY_TUESDAY = 2;
  WEEKDAY_WEDNESDAY = 3;
  WEEKDAY_THURSDAY = 4;
  WEEKDAY_FRIDAY = 5;
  WEEKDAY_SATURDAY = 6;
  WEEKDAY_SUNDAY = 7;
}

enum UpgradeMode {
  // Not chosen: stored as UPGRADE_MODE_MANUAL.
  UPGRADE_MODE_UNSPECIFIED = 0;
  // The tenant chooses the versions (control_plane.kubernetes_version, the
  // add-on versions) and changes them with UpdateCluster. Release channels
  // do not apply: a release never moves the cluster. The default.
  UPGRADE_MODE_MANUAL = 1;
  // The cluster follows its release channel (an unset release_channel is
  // STABLE) and, within the channel, its tier: a release moves it, without
  // an UpdateCluster. Not acted on yet: releases come in later steps
  // (docs/architecture.md#releases-channels-and-rollouts).
  UPGRADE_MODE_AUTOMATIC = 2;
}

// ClusterState is the coarse lifecycle state of a cluster.
enum ClusterState {
  CLUSTER_STATE_UNSPECIFIED = 0;
  // Accepted; cloud resources are being created.
  CLUSTER_STATE_PROVISIONING = 1;
  // All resources are ready and the API server is reachable.
  CLUSTER_STATE_RUNNING = 2;
  // A spec change is being rolled out.
  CLUSTER_STATE_UPDATING = 3;
  // Teardown in progress.
  CLUSTER_STATE_DELETING = 4;
  // Reconciliation failed; see `message` and `conditions`.
  CLUSTER_STATE_FAILED = 5;
  // Imported and read-only (ImportCluster); waiting for TakeOverCluster.
  // See status.import for the plan.
  CLUSTER_STATE_IMPORTED = 6;
}

// ClusterStatus is the observed state, aggregated from the Crossplane
// managed resources' status.
message ClusterStatus {
  // Output only. Inherited live from the parent network. Rollouts proceed 2, 1, 0.
  ClusterTier tier = 60;
  ClusterState state = 1;

  // Human-readable summary of the current state, typically the reason for
  // FAILED.
  string message = 2;

  // The spec generation the status reflects. Lower than Cluster.generation
  // means the latest change has not been observed yet.
  int64 observed_generation = 3;

  // Conditions derived from the managed resources' Crossplane conditions:
  // "Ready" (every resource is ready) and "Synced" (false when a resource
  // failed, with its error), plus "Reconciled" (false when the platform's
  // last attempt to apply the spec failed, with the reason).
  repeated Condition conditions = 4;

  // Kubernetes API server connection details, once the control plane is
  // ready.
  ClusterEndpoint endpoint = 5;

  // Kubernetes version running on the control plane.
  //   AWS   Cluster.status.atProvider.version
  //   GCP   Cluster.status.atProvider.masterVersion
  //   Azure KubernetesCluster.status.atProvider.currentKubernetesVersion
  string current_kubernetes_version = 6;

  // Service-account token issuer, for workload identity.
  //   AWS   Cluster.status.atProvider.identity[0].oidc[0].issuer
  //   Azure KubernetesCluster.status.atProvider.oidcIssuerUrl
  string oidc_issuer_url = 7;

  // The cloud resources of the cluster's Network.
  NetworkResources network = 8;

  // Provider-specific observed state. Matches the arm set in ClusterSpec.
  oneof provider {
    AwsClusterStatus aws = 10;
    // gcp = 11, azure = 12 (see ClusterSpec.provider).
  }

  // Set for imported clusters: the plan from ImportCluster, kept as a
  // record after the takeover.
  ImportStatus import = 13;

  // Not filled. Carried-over resources (disposition CARRIED_OVER, e.g.
  // security groups, the KMS key, the OIDC provider: owned with the cluster
  // and deleted with it, not editable through the API) are listed in
  // import.resources and in managed_resources.
  repeated ImportedResource carried_over = 14;

  // Every managed resource of the cluster (IAM roles, the EKS cluster, the
  // default node group, add-ons, access entries, ...) with its Kubernetes
  // name, cloud ID and state, in creation order. state is RUNNING once all
  // of them are READY, FAILED when one is FAILED.
  repeated ManagedResource managed_resources = 15;

  // "<namespace>/<name>" of the Secret in the management cluster holding
  // the cluster's kubeconfig (key "kubeconfig"), for Crossplane's Helm and
  // Kubernetes providers. Its token is refreshed every 10 minutes and acts
  // as the identity that created the cluster (the account's
  // ProviderConfig), which is cluster admin. Empty until the control plane
  // is ready.
  string kubeconfig_secret = 16;

  // The Kubernetes upgrade in progress: set from the moment
  // spec.control_plane.kubernetes_version differs from what the control
  // plane runs until the node group and the add-ons have followed. Unset
  // when no upgrade is in progress. state stays UPDATING meanwhile; this
  // says which step the upgrade is at.
  ClusterUpgrade upgrade = 17;

  // The components the platform installs with the cluster (the Platform
  // definitions of the catalog), in install order: installed once the
  // cluster's node group is ready and its kubeconfig exists, with fixed
  // values. Read-only: a tenant cannot enable, change or disable them.
  // The cluster's own state does not wait for them; the condition
  // PlatformComponentsReady says whether all of them are installed. Empty
  // for an imported cluster: nothing is installed on those.
  repeated PlatformComponent platform_components = 18;

  // The release the platform components' versions come from: the one the
  // cluster's channel offered when they were first installed. A cluster
  // keeps it until it is moved to another release.
  string platform_release = 19;

  // deprecations is the summary of the controller's last scan for objects
  // written with deprecated or removed API versions (no findings here:
  // ListClusterDeprecations). Unset until the cluster was scanned.
  ClusterDeprecations deprecations = 40;

  // recent_events are the last things the controller reported about the
  // cluster (at most 10, oldest first): the states it reached, steps that
  // finished, failures. Kubernetes keeps an object's events for about an
  // hour; these stay with the cluster. ListClusterEvents returns the
  // events themselves while they exist.
  repeated Event recent_events = 41;

  // freeze is set while the platform is frozen (AdminService.Freeze):
  // who, since when, why, until when, and whether this one is let
  // through. Held (not let through), the platform only observes it and
  // its managed resources carry crossplane.io/paused; the condition
  // Frozen is True and message says so. Unset: not frozen.
  Freeze freeze = 45;

  // recommendations is the summary of the usage the controller records to
  // recommend resource requests (the recommendations themselves:
  // ListClusterRecommendations). Unset until the cluster was sampled.
  ClusterRecommendations recommendations = 42;

  // kubernetes is what the platform's releases say of the Kubernetes
  // version the cluster runs: the minor its release channel offers, the
  // next minor it can move to, and whether its minor is ending. Unset
  // until the controller read the cluster's release.
  ClusterKubernetes kubernetes = 46;

  // rollout is the cluster's last automatic upgrade: the hop its release
  // channel's rollout started (the controller's automatic-upgrades
  // setting) and how it ended. Unset until the rollout upgraded the
  // cluster; a version a person changed writes none.
  ClusterRollout rollout = 47;

  // upgrade_pause, removed: the freeze is the platform's (freeze).
  reserved 48;
  reserved "upgrade_pause";

  // teardown is the first step of the cluster's deletion: what its
  // controllers made in the cloud (load balancers of Services and
  // Ingresses, Karpenter's nodes and node classes) is deleted in the
  // workload cluster while those controllers still run, before the
  // platform components are uninstalled. Unset until the cluster is
  // deleted.
  ClusterTeardown teardown = 49;

  // release_move is the cluster's move from the release its components
  // run (current) to the one its channel offers (target), one component
  // at a time; set by the controller when component upgrades are on.
  ClusterReleaseMove release_move = 50;

  // code_change is a change of what the platform renders for the cluster
  // (a new controller build), applied in turn by its channel's rollout;
  // unset when nothing was rendered differently since the cluster was
  // last applied.
  CodeChange code_change = 51;

  // Node groups as observed: the platform group first, then the user's.
  repeated NodeGroupStatus node_groups = 52;

  // Read-only topology from scoped live managed-resource inventory. Unset in
  // older stored snapshots; missing links do not prove absence or reachability.
  ClusterArchitecture architecture = 20;
}

// ClusterRollout is one automatic upgrade of a cluster, as the rollout
// of its release channel started and followed it.
message ClusterRollout {
  // The release channel whose rollout started it (alpha, beta, stable).
  string channel = 1;

  // The Kubernetes minor the cluster ran before, e.g. "1.36".
  string from_version = 2;

  // The Kubernetes minor it is upgraded to, e.g. "1.37".
  string to_version = 3;

  // When the rollout set the new version.
  google.protobuf.Timestamp start_time = 4;

  // When the upgrade ended (succeeded, failed or timed out); unset while
  // it is in progress.
  google.protobuf.Timestamp finish_time = 5;

  // How it stands.
  ClusterRolloutResult result = 6;

  // What it waits for (PENDING), what keeps it back (BLOCKED), or why it
  // failed or timed out; empty otherwise.
  string message = 7;

  // The cluster's rollout tier: 2 is upgraded first, then 1, then 0.
  int32 tier = 8;
}

// ClusterRolloutResult is how an automatic upgrade stands.
enum ClusterRolloutResult {
  CLUSTER_ROLLOUT_RESULT_UNSPECIFIED = 0;
  // The new version is set; the control plane, then the nodes and add-ons
  // are being upgraded.
  CLUSTER_ROLLOUT_RESULT_IN_PROGRESS = 1;
  // The cluster runs the new minor and the upgrade is done.
  CLUSTER_ROLLOUT_RESULT_SUCCEEDED = 2;
  // The upgrade failed; the rollout counts it against the tier's maxFailed.
  CLUSTER_ROLLOUT_RESULT_FAILED = 3;
  // The upgrade did not finish within the controller's upgrade-timeout;
  // counted as failed.
  CLUSTER_ROLLOUT_RESULT_TIMED_OUT = 4;
  // Not started yet: it waits its turn (its tier, a soak, a free slot), or
  // automatic upgrades are off; message says which.
  CLUSTER_ROLLOUT_RESULT_PENDING = 5;
  // Kept back by one of its own checks (manual upgrades, a maintenance
  // window, the deprecation scan, health, the freeze); message says which.
  CLUSTER_ROLLOUT_RESULT_BLOCKED = 6;
}

// ClusterKubernetes is the cluster's Kubernetes version as the release
// its channel offers sees it (pkg/catalog/release.yaml puts one minor on
// each of alpha, beta and stable).
message ClusterKubernetes {
  // The cluster's release channel (alpha, beta, stable). Empty when the
  // cluster names none: no channel's minor applies to it, only ending.
  string channel = 1;

  // The Kubernetes minor the channel offers now, e.g. "1.36". A cluster
  // on the channel is created on it, may not ask for a newer one, and an
  // automatic cluster is upgraded toward it. Empty when the cluster names
  // no channel, or the channel's release puts no minor on it.
  string channel_minor = 2;

  // The minor the cluster can be upgraded to next, one minor at a time
  // toward channel_minor (EKS upgrades one minor at a time). Empty when
  // the cluster is at or ahead of its channel's minor: it is never
  // downgraded.
  string available = 3;

  // True when the cluster's minor is still supported but on no channel
  // any more: it is ending, and the cluster should move to a newer minor.
  bool ending = 4;

  // What this means for the cluster, in a sentence: an upgrade available,
  // ahead of the channel (it waits), or ending. Empty when the cluster
  // runs its channel's minor.
  string message = 5;
}

// PlatformComponent is one component the platform installed with a
// cluster, as the cluster reports it.
message PlatformComponent {
  // The catalog name, e.g. "karpenter".
  string name = 1;

  // The chart version the cluster's release pins. Empty for a component
  // the release does not pin.
  string version = 2;

  // PENDING: waits (for the node group, the kubeconfig, a component it
  // requires, or a value that does not exist yet; message says which).
  // INSTALLING: its charts are being installed. READY: every chart is
  // deployed. FAILED: an install failed, or the component cannot be
  // installed on this cluster (message says why).
  ComponentPhase phase = 3;

  // What it waits for, or why it failed. Empty when READY.
  string message = 4;

  // The chart the phase and the fields below are about: the Helm release
  // name of the component's chart that failed or is being installed (its
  // main chart, its CRD chart or a companion). Empty when READY or when
  // no chart was started.
  string chart = 5;

  // Helm's state of that chart's release, as provider-helm reports it
  // (Release.status.atProvider.state): deployed, failed, pending-install,
  // pending-upgrade, pending-rollback, uninstalling, ... Empty before Helm
  // has a release.
  string helm_state = 6;

  // The provider's last error for that chart (the message of the
  // Release's Synced condition while it is False), in full.
  string last_error = 7;

  // How many times in a row the install or upgrade of that chart failed
  // (Release.status.failed).
  int32 failures = 8;

  // Since when the component is in this phase.
  google.protobuf.Timestamp since = 9;

  // How many times the platform recovered a stuck Helm release of this
  // component at this version (it removed the stuck revision's Helm
  // record so the install could start again). At most 3; then the
  // component stays FAILED.
  int32 recoveries = 10;
  // Last version observed Ready; retained while the target version is upgrading.
  string installed_version = 11;

  // The chart version Helm has deployed (Release.status.atProvider.version)
  // and its Helm revision, for the chart the phase is about.
  string chart_version = 12;
  int32 revision = 13;

  // Digest of the Release spec (chart, version, rendered values) the
  // platform applied for that chart; a new one starts the retries over.
  string digest = 14;

  // Backoff after a failed install or upgrade: the failed attempts so far
  // (any class), the failures in a row that count toward giving up
  // (release errors only; transient errors never count), and when the
  // Release is tried again. After the limit (--helm-max-failures) the
  // component is FAILED and the retry stays at its cap
  // (--helm-backoff-max).
  int32 attempts = 15;
  int32 counted_failures = 16;
  google.protobuf.Timestamp next_retry_at = 17;

  // Class of the last error: "transient" (workload API unreachable, Helm's
  // lock; retried quietly), "chart" (the chart did not come) or "release"
  // (a hook failed, the rollout timed out, invalid values). Empty when
  // there is no error.
  string last_error_class = 18;

  // The last time the platform recovered a stuck Helm release of this
  // component, and what it did (rolled back to revision N, uninstalled,
  // deleted a failed hook Job). Empty when it never did.
  string last_recovery = 19;
  google.protobuf.Timestamp last_recovery_at = 20;

  // The Release already had this version and these values when the pass
  // looked: nothing was written for it.
  bool unchanged = 21;
}

// ClusterUpgrade is where a Kubernetes upgrade stands. An upgrade runs in
// the order a cluster is created, one step at a time, each starting once
// the one before is settled as AWS and Helm report it: the control plane,
// the node groups, the EKS add-ons, the platform components, the tenant
// components.
message ClusterUpgrade {
  // The version the upgrade started from: what the control plane ran.
  string from_version = 1;

  // The version being moved to: spec.control_plane.kubernetes_version.
  string to_version = 2;

  // The step the upgrade is at.
  ClusterUpgradePhase phase = 3;

  // When the upgrade was first seen in progress.
  google.protobuf.Timestamp start_time = 4;

  // What the step waits for; when the cloud refuses or fails the step,
  // the provider's error for the resource concerned (the upgrade is
  // retried, it is not given up).
  string message = 5;

  // The node groups in the NODES_AND_ADDONS step: the version each runs
  // (as the provider last saw it) and how it stands.
  repeated ClusterUpgradeNodeGroup node_groups = 6;

  // The add-ons not on their new version yet, by add-on name (e.g.
  // "coredns"); empty once every add-on runs its version.
  repeated string addons_behind = 7;

  // The step's changes were applied in an earlier pass: what the step
  // waits for is then read as settled or not (a pass that applies a
  // change may still read the old state).
  bool applied = 8;

  // When the upgrade entered its current step.
  google.protobuf.Timestamp phase_start_time = 9;

  // The components (platform or tenant, by the step) not settled on their
  // new version yet.
  repeated string components_behind = 10;

  // How many times the add-ons' step was recovered automatically (the
  // add-ons that failed, or did not settle within 30 minutes, applied
  // again); halted: still not settled after the last recovery. A halted
  // upgrade waits for cluster retry.
  int32 recoveries = 11;
  bool halted = 12;

  // Steps that were skipped because there was nothing to do in them: the
  // platform or tenant components, when none of their charts changed
  // version or values for this Kubernetes minor ("component versions
  // unchanged"). Informational: the upgrade still passes through them.
  repeated ClusterUpgradePhase skipped_steps = 13;
}

// ClusterUpgradeNodeGroup is one node group following a Kubernetes
// upgrade.
message ClusterUpgradeNodeGroup {
  // The EKS node group's name.
  string name = 1;

  // The version it runs, as the provider last saw it.
  string from_version = 2;

  // The version it moves to (the upgrade's to_version).
  string to_version = 3;

  // UPDATING while it moves, READY once it runs to_version, FAILED when
  // the cloud fails it.
  ManagedResourceState state = 4;
}

// ClusterUpgradePhase is the step of a Kubernetes upgrade.
enum ClusterUpgradePhase {
  CLUSTER_UPGRADE_PHASE_UNSPECIFIED = 0;

  // The control plane is being upgraded: it still reports from_version.
  // The EKS cluster is applied at to_version; the node group is applied at
  // from_version and the add-ons at the versions they run, so nothing is
  // ahead of the control plane. Other changes of the same update are
  // applied meanwhile.
  CLUSTER_UPGRADE_PHASE_CONTROL_PLANE = 1;

  // Not reported any more (an upgrade now has a step for the node groups
  // and one for the add-ons); kept for statuses recorded before.
  CLUSTER_UPGRADE_PHASE_NODES_AND_ADDONS = 2;

  // The control plane runs to_version; the node groups are applied at it
  // and replace their nodes. The add-ons stay at the versions they run.
  CLUSTER_UPGRADE_PHASE_NODE_GROUPS = 3;

  // The node groups run to_version; the add-ons are applied at the
  // versions EKS recommends for it (or the ones the client pinned).
  CLUSTER_UPGRADE_PHASE_ADDONS = 4;

  // The add-ons are settled; the platform components move to to_version's
  // values (e.g. cluster-autoscaler's image).
  CLUSTER_UPGRADE_PHASE_PLATFORM_COMPONENTS = 5;

  // The platform components are settled; the tenant's components move.
  CLUSTER_UPGRADE_PHASE_TENANT_COMPONENTS = 6;
}

// ClusterEndpoint is how clients reach the Kubernetes API server.
message ClusterEndpoint {
  // HTTPS URL of the public endpoint.
  string url = 1;
  // PEM-encoded cluster CA certificate.
  bytes certificate_authority_data = 2;
}

// ClusterTeardown is the teardown step of a cluster's deletion.
message ClusterTeardown {
  // When it started; kept across passes (the timeout counts from it).
  google.protobuf.Timestamp start_time = 1;

  // When it ended; unset while it runs.
  google.protobuf.Timestamp finish_time = 2;

  // How it ended; UNSPECIFIED while it runs.
  ClusterTeardownResult result = 3;

  // What it waits for while it runs, or what was left (timed out) or why
  // it was skipped.
  string message = 4;

  // The objects it waits for (running) or left (timed out), e.g.
  // "Service istio-system/istio-ingressgateway".
  repeated string waiting = 5;
}

// ClusterTeardownResult is how a teardown ended.
enum ClusterTeardownResult {
  CLUSTER_TEARDOWN_RESULT_UNSPECIFIED = 0;
  // Every such object is gone.
  CLUSTER_TEARDOWN_RESULT_FINISHED = 1;
  // The controller's teardown-timeout passed with objects left: the
  // deletion goes on; their cloud resources may be left behind.
  CLUSTER_TEARDOWN_RESULT_TIMED_OUT = 2;
  // Not run: the deletion is forced, or the cluster's API cannot be
  // reached; their cloud resources may be left behind.
  CLUSTER_TEARDOWN_RESULT_SKIPPED = 3;
}

// ClusterReleaseMove is a cluster moving its platform components from one
// release to another, one component at a time in install order.
message ClusterReleaseMove {
  // The release the components run (all of them, once a move is done).
  string current = 1;
  // The release they move to; empty when there is none to move to.
  string target = 2;
  // Where the move is.
  ClusterReleaseMovePhase phase = 3;
  // The component being moved now.
  string component = 4;
  // Its place among the components that change (1-based), and how many.
  int32 step = 5;
  int32 steps = 6;
  // Why it waits, what failed, or what is available.
  string message = 7;
  // When the move started; when the current component started.
  google.protobuf.Timestamp start_time = 8;
  google.protobuf.Timestamp component_start_time = 9;
  // A pass after the one that set the component's new pin recorded it: its
  // state is read from then on (the pass that applied it may still see the
  // old version's Ready).
  bool component_applied = 10;
  // How many times the current component was recovered automatically
  // (its chart tried again) after it failed or did not settle within the
  // watch period; the move halts after the last one.
  int32 recoveries = 11;
}

// ClusterReleaseMovePhase is where a release move is.
enum ClusterReleaseMovePhase {
  CLUSTER_RELEASE_MOVE_PHASE_UNSPECIFIED = 0;
  // Nothing to move: the components run the target, or there is none.
  CLUSTER_RELEASE_MOVE_PHASE_IDLE = 1;
  // A release to move to, not started: waiting its turn in the channel's
  // rollout, a Kubernetes upgrade, or a manual cluster (message says).
  CLUSTER_RELEASE_MOVE_PHASE_PENDING = 2;
  // Moving components, one at a time.
  CLUSTER_RELEASE_MOVE_PHASE_COMPONENTS = 3;
  // Stopped: a component still failed, or did not settle, after the
  // automatic recoveries; nothing moves until cluster retry.
  CLUSTER_RELEASE_MOVE_PHASE_HALTED = 4;
}

// Provider-neutral cluster topology using the shared bounded fact/edge shapes.
// Resource kind/name identifies a live managed resource except reference_only
// entries, which carry only an explicit referenced cloud ID, not verified state.
// AWS adapter relations: has_node_group, has_addon, has_component, uses_subnet,
// uses_security_group, uses_launch_template. A has_component edge is configured
// evidence from Release -> ProviderConfig -> ClusterAuth -> Cluster bindings;
// neither component labels nor a desired component list establishes that link.
// No workload objects, Secret payloads, Helm values or access credentials appear.
message ClusterArchitecture {
  repeated NetworkArchitectureResource resources = 1;
  repeated NetworkArchitectureConnection connections = 2;
}
