syntax = "proto3";

package cloud.v1;

import "buf/validate/validate.proto";
import "cloud/v1/cluster.proto";
import "cloud/v1/cluster_retry.proto";
import "cloud/v1/deprecation.proto";
import "cloud/v1/events.proto";
import "cloud/v1/node_group_manifest.proto";
import "cloud/v1/node_group_nodes.proto";
import "cloud/v1/node_resources.proto";
import "cloud/v1/plan.proto";
import "cloud/v1/recommendation.proto";
import "cloud/v1/violation.proto";
import "google/protobuf/field_mask.proto";

// ClusterService manages the lifecycle of tenant clusters.
//
// Every RPC is scoped by tenant_id. Where the server authenticates (its
// auth.mode is optional or required), the caller's bearer token must give
// it a role for that tenant: any role for the RPCs marked NO_SIDE_EFFECTS,
// tenant admin (or platform admin) for the others; otherwise
// PERMISSION_DENIED, or UNAUTHENTICATED without an accepted token. With
// auth.mode none the server takes tenant_id as given, so the API must then
// not be reachable by anyone who may not act for every tenant.
//
// Mutations are asynchronous: they return as soon as the desired state is
// recorded, and callers poll GetCluster until status.observed_generation
// catches up with generation and status.state is RUNNING (or the cluster is
// gone, after a delete).
service ClusterService {
  // Reads the controller snapshot. Never connects to the workload cluster.
  rpc ListClusterViolations(ListClusterViolationsRequest) returns (ListClusterViolationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Reads retained admission events in the snapshot, not historical audit data.
  rpc ListClusterViolationEvents(ListClusterViolationEventsRequest) returns (ListClusterViolationEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates a cluster. The call stores it (PROVISIONING) and returns; the
  // API server does not look at the cloud. Returns ALREADY_EXISTS if a
  // cluster of the platform already has the name (see Cluster.name for
  // where), unless request_id matches the original request. Whether EKS
  // has a cluster of the name that the platform did not create, and which
  // Kubernetes and add-on versions EKS offers, is checked by the
  // controller before it creates anything: a taken name or a version EKS
  // does not offer is not an error of this call, the cluster becomes FAILED
  // with the reason in status.message. The versions the controller
  // resolved are written to spec (control_plane.kubernetes_version, the
  // add-ons' versions). Clusters built outside the platform are imported
  // with ImportCluster and TakeOverCluster.
  rpc CreateCluster(CreateClusterRequest) returns (CreateClusterResponse);

  // Imports an existing cluster read-only. The call only stores the import
  // and returns: the cluster is IMPORTED with status.import.phase
  // DISCOVERING, and the API server does not look at the cloud. The
  // controller then looks the cluster's resources up once, as the tenant
  // role of the account, derives the spec from them, writes the plan
  // (status.import) and creates a managed resource for each with
  // managementPolicies ["Observe", "LateInitialize"]. Nothing changes in
  // the cloud. Poll GetCluster: the phase becomes PLANNED (state IMPORTED),
  // or BLOCKED (state FAILED, nothing imported). A cluster that does not
  // exist or cannot be read is not an error of this call: the cluster
  // becomes FAILED with the reason in status.message, still DISCOVERING.
  // Its network must be a Network of the tenant, imported or owned, that
  // holds the cluster's subnets.
  rpc ImportCluster(ImportClusterRequest) returns (ImportClusterResponse);

  // Takes over an IMPORTED cluster: the platform becomes its owner and
  // converges the plan (WILL_UPDATE, WILL_CREATE). Call it only after the
  // previous tool stopped managing the cluster, and after its network was
  // taken over. From then on it is a cluster like any other.
  rpc TakeOverCluster(TakeOverClusterRequest) returns (TakeOverClusterResponse);

  // Returns one cluster, or NOT_FOUND, from the platform's store: its spec
  // and the status the controller last recorded for it (it records one on
  // every reconcile while the cluster is being created, changed or deleted;
  // afterwards it is the status the cluster converged on). It does not read
  // the provider objects, unless live is set.
  rpc GetCluster(GetClusterRequest) returns (GetClusterResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists the objects of a cluster that were written with an API version
  // that is deprecated or removed at the Kubernetes version the cluster
  // moves to next, removed first: what the controller's last scan found
  // (it scans every six hours), read from the platform's store. Empty,
  // with no scanned_at, for a cluster that was not scanned yet.
  rpc ListClusterDeprecations(ListClusterDeprecationsRequest) returns (ListClusterDeprecationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists what the controller reported about a cluster, newest first: the
  // Kubernetes events of the cluster's object in the management cluster,
  // which Kubernetes keeps for about an hour. status.recent_events (in
  // GetCluster) keeps the last ten for good.
  rpc ListClusterEvents(ListClusterEventsRequest) returns (ListClusterEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists what the platform recommends the containers of a cluster's
  // workloads ask for: per container its current requests and limits, the
  // usage recorded over the last week, the recommended requests and
  // limits and the difference. Computed from what the controller recorded
  // (it samples the cluster every five minutes, read-only), read from the
  // platform's store. Empty for a cluster that was not sampled yet.
  rpc ListClusterRecommendations(ListClusterRecommendationsRequest) returns (ListClusterRecommendationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Reads what user node groups may use: the platform admin's allowlist of
  // instance families and types (the server's node-group-instance-families
  // and node-group-instance-types settings), the architectures and the
  // capacity types. CreateCluster and UpdateCluster refuse node groups
  // outside it.
  rpc GetNodeGroupOptions(GetNodeGroupOptionsRequest) returns (GetNodeGroupOptionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists the Karpenter objects (EC2NodeClass and NodePool) of the
  // cluster's node groups, the platform group first, rendered from the
  // stored spec exactly as the controller applies them to the workload
  // cluster. Empty for an imported cluster that was not taken over. Never
  // connects to the workload cluster.
  rpc ListClusterNodeGroupManifests(ListClusterNodeGroupManifestsRequest) returns (ListClusterNodeGroupManifestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists a page of the nodes of one node group (name, status, instance
  // type, zone, capacity, kubelet version, age, NodeClaim), filtered by their
  // Ready condition and by a name search. Read from the node group's shard in
  // the cluster's results bucket, which the controller writes while it
  // converges the node groups (at most once a minute): the API server never
  // connects to the workload cluster, and reads one shard, one page at a time.
  // A bucket that cannot be read, or nodes not collected yet, is a notice in
  // the response, not an error.
  rpc ListNodeGroupNodes(ListNodeGroupNodesRequest) returns (ListNodeGroupNodesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns the resource totals (allocatable and requested CPU, memory and
  // pods) per node group and for the cluster, read live from the workload
  // cluster by the live reader (the API server never connects to it).
  // UNIMPLEMENTED until the live reader exists. An unreadable cluster is
  // UNAVAILABLE, with a LiveUnavailableDetail.
  rpc GetNodeResources(GetNodeResourcesRequest) returns (GetNodeResourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists a tenant's clusters, oldest first (ids are time-ordered UUIDs),
  // from the platform's store like GetCluster.
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Updates the mutable fields named in update_mask. The call stores the
  // change and returns; the API server does not look at the cloud. After a
  // change of the Kubernetes version or the add-ons the controller
  // resolves the versions against what EKS offers before it applies the
  // change: a version EKS does not offer (or a pinned add-on version that
  // does not fit the new Kubernetes version) is not an error of this call,
  // the cluster becomes FAILED with the reason and is not touched. A plan
  // (validate_only) made before that shows the versions EKS has yet to
  // choose as "(known after apply)".
  rpc UpdateCluster(UpdateClusterRequest) returns (UpdateClusterResponse);

  // Removes the cluster, all its node pools, and every cloud resource the
  // platform owns for it. A shared Network (network.network_id) is not
  // deleted. An imported cluster that was not taken over owns nothing: its
  // Observe-only objects are removed and the cloud resources stay. A
  // taken-over cluster is deleted like a created one, except for resources
  // the import marked as shared (retained), which stay.
  rpc DeleteCluster(DeleteClusterRequest) returns (DeleteClusterResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Tries again what failed on a cluster: its failed platform and tenant
  // components, and its failed or timed-out automatic upgrade; or only the
  // components named, and the upgrade with upgrade: true. The controller
  // acts on it on its next pass. The response says per item what happens:
  // RETRY, FIX (a component that failed because of something to change
  // first, e.g. spec.aws.irsa off: retrying would fail again) or NOTHING
  // (it has not failed).
  rpc RetryCluster(RetryClusterRequest) returns (RetryClusterResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message ImportClusterRequest {
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];

  // The cluster's name in the cloud (AWS: the EKS cluster name), which
  // becomes Cluster.name. Clusters whose name is not a lowercase DNS label
  // of at most 40 characters cannot be imported yet.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
    pattern: "^[a-z]([a-z0-9-]{0,38}[a-z0-9])?$"
  }];

  string display_name = 3 [(buf.validate.field).string.max_len = 128];

  // Network.id of the Network (imported or owned) the cluster runs in. Its
  // account and region are the cluster's.
  string network_id = 4 [(buf.validate.field).string.uuid = true];

  // A retry with the same request_id returns the cluster imported by the
  // first call.
  string request_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  oneof provider {
    option (buf.validate.oneof).required = true;
    AwsImportCluster aws = 10;
  }
}

// AwsImportCluster says how an EKS cluster maps onto the contract.
message AwsImportCluster {
  // The node group that becomes spec.default_node_pool. Required: the
  // contract has one node group per cluster. The cluster's other node
  // groups are NOT_IMPORTED: they stay unmanaged and block deleting the
  // cluster until they are removed. No node group is created or replaced
  // by the import.
  string default_node_group_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[0-9A-Za-z][A-Za-z0-9_-]*$"
  }];
}

message ImportClusterResponse {
  // The stored import: state IMPORTED, status.import.phase DISCOVERING.
  // The controller then fills spec from the imported resources and
  // status.import with the plan.
  Cluster cluster = 1;
}

message TakeOverClusterRequest {
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];

  // Cluster.id.
  string cluster_id = 2 [(buf.validate.field).string.uuid = true];

  // When set, must match the cluster's etag or the call fails with ABORTED.
  string etag = 3;

  // Confirms that every NOT_IMPORTED resource has another owner (or was
  // deleted) and the previous tool no longer manages anything here.
  bool acknowledge_not_imported = 4;

  // Keeps the platform components (load balancer controller, autoscalers,
  // policy engine, mesh, ...) off this cluster. Unset: once the cluster is
  // taken over and running it gets them like any cluster. For a cluster
  // that already runs its own: the platform never deletes or adopts those,
  // and its own install of the same component would fail next to them.
  // It is decided at the takeover and stays.
  bool skip_platform_components = 5;
}

message TakeOverClusterResponse {
  Cluster cluster = 1;
}

message CreateClusterRequest {
  // Tenant scope. DNS label, at most 56 chars so the tenant namespace
  // "tenant-<id>" fits the 63-char Kubernetes limit.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];

  // The cluster to create. name and spec are required; id and the other
  // output-only fields are assigned by the server and ignored here.
  Cluster cluster = 2 [(buf.validate.field).required = true];

  // Optional idempotency key. Retrying with the same key returns the
  // original result instead of ALREADY_EXISTS.
  string request_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message CreateClusterResponse {
  Cluster cluster = 1;
}

message GetClusterRequest {
  // Tenant scope. DNS label, at most 56 chars so the tenant namespace
  // "tenant-<id>" fits the 63-char Kubernetes limit.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];
  // Cluster.id.
  string cluster_id = 2 [(buf.validate.field).string.uuid = true];
  // Read the status now from the cluster's managed resources in the
  // management cluster (their conditions, the EKS endpoint, versions, ...)
  // instead of the status last recorded. UNAVAILABLE when the management
  // cluster cannot be read.
  bool live = 3;
  // Return the spec, labels and display name as the client asked for
  // them: as sent at create, with the updates since (the stored input),
  // instead of the spec the server resolved (defaults, add-on versions,
  // zones). update -f compares a manifest with it. A cluster stored
  // without such an input (an import, or one older than inputs) gets its
  // resolved spec; GetClusterResponse.as_requested says which.
  bool as_requested = 4;
}

message GetClusterResponse {
  Cluster cluster = 1;
  // The cluster's spec, labels and display name are its input
  // (GetClusterRequest.as_requested), not the resolved ones.
  bool as_requested = 2;
}

message ListClustersRequest {
  // Tenant scope. DNS label, at most 56 chars so the tenant namespace
  // "tenant-<id>" fits the 63-char Kubernetes limit.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];

  // Maximum results per page. Defaults to 50; values above 200 are coerced to
  // 200.
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];

  // next_page_token from a previous call. All other fields must match the
  // call that produced it.
  string page_token = 3;
}

message ListClustersResponse {
  repeated Cluster clusters = 1;
  // Empty when there are no more results.
  string next_page_token = 2;
}

message UpdateClusterRequest {
  option (buf.validate.message).cel = {
    id: "update_cluster.cluster_required"
    message: "cluster is required"
    expression: "has(this.cluster)"
  };

  // Tenant scope. DNS label, at most 56 chars so the tenant namespace
  // "tenant-<id>" fits the 63-char Kubernetes limit.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];

  // The new state. cluster.id identifies the target; cluster.etag, when set,
  // must match the current etag or the call fails with ABORTED.
  //
  // Field rules are deliberately skipped here: only the masked paths matter,
  // so the server applies the mask to the stored cluster and validates the
  // merged result.
  Cluster cluster = 2 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  // Fields to update, relative to Cluster. In JSON (Connect / protojson)
  // the paths are lowerCamelCase and comma-separated, e.g.
  // "spec.controlPlane.kubernetesVersion,labels". Mutable paths:
  //   display_name
  //   labels         (also re-tags every cloud resource)
  //   spec.control_plane.kubernetes_version          (one minor at a time, up only)
  //   spec.control_plane.endpoint_access.public_access_cidrs
  //   spec.control_plane.endpoint_access.endpoint_private_access
  //   spec.control_plane.endpoint_access.endpoint_public_access
  //   spec.control_plane.secrets_encryption  (the whole message; it can be
  //                                           turned on, never off or moved
  //                                           to another key)
  //   spec.default_node_pool.scaling_config.min_size
  //   spec.default_node_pool.scaling_config.max_size
  //   spec.default_node_pool.labels
  //   spec.default_node_pool.taints
  //   spec.default_node_pool.instance_types
  //   spec.default_node_pool.capacity_type
  //   spec.default_node_pool.disk_size_gb
  //   spec.aws.default_node_pool.ami_type
  //   spec.aws.default_node_pool.launch_template
  //     (EKS cannot change these five in place: a new node group is created
  //     and the old one is deleted once the new one is ready)
  //   spec.aws.addons                                 (the whole list)
  //   spec.aws.enabled_cluster_log_types
  //   spec.aws.upgrade_policy.support_type
  //   spec.aws.irsa
  //   spec.aws.control_plane_log_group
  //   spec.access.admin_principals
  //   spec.access.access_entries
  //   spec.access.oidc
  // spec.aws.access_config.authentication_mode fails with UNIMPLEMENTED.
  // Any other path (region, network, ...) fails with INVALID_ARGUMENT. A
  // listed path can still fail with FAILED_PRECONDITION when the cluster's
  // current state does not allow the change.
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];

  // Plan only: validate the update and return what it would do
  // (UpdateClusterResponse.plan), changing nothing.
  bool validate_only = 4;

  // Apply exactly the plan a validate_only call returned (Plan.plan_id):
  // the update is planned again and fails with FAILED_PRECONDITION when the
  // request or a live resource changed since. Empty: apply without that
  // check.
  string plan_id = 5 [(buf.validate.field).string.max_len = 128];
}

message UpdateClusterResponse {
  // Desired state was recorded; cloud reconciliation is still asynchronous.
  bool update_recorded = 3;
  // The cluster: after the update, or as it is for validate_only.
  Cluster cluster = 1;
  // What the update would do (validate_only) or did (with plan_id).
  Plan plan = 2;
}

message DeleteClusterRequest {
  // Tenant scope. DNS label, at most 56 chars so the tenant namespace
  // "tenant-<id>" fits the 63-char Kubernetes limit.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];
  // Cluster.id.
  string cluster_id = 2 [(buf.validate.field).string.uuid = true];
  // When set, must match the current etag or the call fails with ABORTED.
  string etag = 3;
  // Tears the cluster down even when its Kubernetes API is unreachable:
  // Helm Releases into the cluster are released without uninstalling
  // (managementPolicies without Delete) instead of waiting for an
  // uninstall that cannot happen. What those charts created in the cloud
  // account (load balancers, volumes) may be left behind. Sticky: once
  // set for a deletion, every later step of it is forced.
  bool force = 4;
}

message DeleteClusterResponse {
  // The cluster in DELETING state.
  Cluster cluster = 1;
}
