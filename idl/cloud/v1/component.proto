syntax = "proto3";

package cloud.v1;

import "buf/validate/validate.proto";
import "cloud/v1/component_cloud.proto";
import "cloud/v1/conditions.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Component is one catalog component enabled on one cluster of a tenant
// (docs/design/component-usage.md). A cluster has a component at most once.
message Component {
  // Tenant that owns the component. Output only: set by the server from the
  // request's tenant_id.
  string tenant_id = 1;

  // Output only. Assigned by the server on enable (UUID); every other call
  // refers to the component by it.
  string id = 2;

  // The cluster the component is installed into (Cluster.id). Required on
  // enable. Immutable.
  string cluster_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  // The catalog entry (ComponentDefinition.name), e.g. "karpenter".
  // Required on enable. Immutable.
  string component = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      max_len: 63
      pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
    }
  ];

  // Output only: the version the cluster's release gives the component on
  // its Kubernetes minor. A tenant does not choose it: a request that sets
  // it fails with INVALID_ARGUMENT.
  string version = 5 [(buf.validate.field).string.max_len = 64];

  // The tenant's values: a JSON object of at most 64 KiB, usually the
  // definition's user_values file as edited. Keys equal to that file are
  // dropped, so only the tenant's edits are stored and returned. Merged
  // as user_values < these < platform_values (maps key by key, lists as a
  // whole, null removes a value). Values that touch a platform_values
  // path are refused. Not for secrets.
  google.protobuf.Struct values = 6;

  // Observed state. Output only; ignored on enable and update.
  ComponentStatus status = 7;

  // Opaque version token for optimistic concurrency. Output only. Pass it
  // back on UpdateComponent / DisableComponent to reject stale writes.
  string etag = 8;

  // Incremented by the server on every change of version or values. Output
  // only.
  int64 generation = 9;

  // Who controls the component. Output only. PLATFORM: installed with
  // the cluster by the platform, listed read-only (it has no id, etag or
  // values; EnableComponent, UpdateComponent and DisableComponent refuse
  // its name). TENANT: enabled by the tenant.
  ComponentManagement management = 10;
}

// ComponentManagement says who controls a component on a cluster.
enum ComponentManagement {
  COMPONENT_MANAGEMENT_UNSPECIFIED = 0;
  // Enabled, changed and disabled by the tenant.
  COMPONENT_MANAGEMENT_TENANT = 1;
  // Installed with the cluster by the platform; read-only for tenants.
  COMPONENT_MANAGEMENT_PLATFORM = 2;
}

// CloudProvider is a cloud a component can be installed on.
enum CloudProvider {
  CLOUD_PROVIDER_UNSPECIFIED = 0;
  CLOUD_PROVIDER_AWS = 1;
  CLOUD_PROVIDER_GCP = 2;
  CLOUD_PROVIDER_AZURE = 3;
}

// ComponentPhase summarises a component's state.
enum ComponentPhase {
  COMPONENT_PHASE_UNSPECIFIED = 0;
  // Stored; the controller has not started the install.
  COMPONENT_PHASE_PENDING = 1;
  // Being installed or changed.
  COMPONENT_PHASE_INSTALLING = 2;
  // Installed and healthy as far as the install mechanism reports.
  COMPONENT_PHASE_READY = 3;
  // Installed, but no longer healthy.
  COMPONENT_PHASE_DEGRADED = 4;
  // The install failed, or the request's checks no longer hold; the reason
  // is in message.
  COMPONENT_PHASE_FAILED = 5;
  // Being removed after DisableComponent.
  COMPONENT_PHASE_DELETING = 6;
}

// ComponentStatus is written by the controller.
message ComponentStatus {
  ComponentPhase phase = 1;

  // Human-readable summary, typically the reason for FAILED.
  string message = 2;

  // The generation the status reflects. Lower than Component.generation
  // means the latest change has not been observed yet.
  int64 observed_generation = 3;

  // "Valid" (the request's checks hold now), "Synced" (the platform's
  // objects are applied) and "Ready" (installed and healthy).
  repeated Condition conditions = 4;

  // The cluster's name, for people.
  string cluster_name = 5;

  // The version that runs.
  string installed_version = 6;

  // The version the component is moving to.
  string target_version = 7;

  // The release the version came from; empty for a pinned version.
  string release = 8;

  // The merged values that were applied, platform-computed keys included,
  // no secrets.
  google.protobuf.Struct effective_values = 9;

  // Since when the component is in its phase; for one the platform
  // installs, as the cluster reports it. Unset when it is not enabled.
  google.protobuf.Timestamp since = 10;

  // While the component is not READY: the Helm release (chart) its phase
  // is about, Helm's state of it (deployed, failed, uninstalling,
  // pending-install, ...), the install mechanism's last error and its
  // failed attempts in a row.
  string chart = 11;
  string helm_state = 12;
  string last_error = 13;
  int32 failures = 14;

  // How many times the platform recovered a stuck Helm release of the
  // component at this version (at most three).
  int32 recoveries = 15;

  // Helm's side of the component's chart: the deployed chart version, its
  // revision and the digest of the Release spec the platform applied.
  string chart_version = 16;
  int32 revision = 17;
  string digest = 18;

  // Backoff and give-up (see PlatformComponent): failed attempts, failures
  // in a row that count (release errors only), the next retry, the class
  // of the last error (transient, chart, release), and the last recovery
  // of a stuck release.
  int32 attempts = 19;
  int32 counted_failures = 20;
  google.protobuf.Timestamp next_retry_at = 21;
  string last_error_class = 22;
  string last_recovery = 23;
  google.protobuf.Timestamp last_recovery_at = 24;

  // The Release already had this version and these values when the pass
  // looked: nothing was written for it.
  bool unchanged = 25;
}

// ComponentDefinition is what tenants see of a catalog entry. How the
// platform installs it is not part of the answer.
message ComponentDefinition {
  // protected_keys (repeated string): replaced by platform_values, whose
  // leaf paths are the locked keys.
  reserved 6;
  reserved "protected_keys";

  // Catalog name, e.g. "karpenter": Component.component.
  string name = 1;

  string description = 2;

  // Components that must be enabled (and are installed first).
  repeated string requires = 3;

  // EKS add-ons (AwsAddon.name) the cluster must not have while the
  // component is enabled.
  repeated string conflicts_with_addons = 4;

  // JSON Schema of the values a tenant may set. Unset: none.
  google.protobuf.Struct values_schema = 5;

  // Versions offered, by Kubernetes minor ("1.34"), by the release that
  // applies to the cluster named in the request; empty without one.
  map<string, string> versions = 7;

  // Values the platform sets for every tenant. Locked: an enable or update
  // whose values touch any of their leaf paths (the path, a path inside
  // it, or one above it) fails with INVALID_ARGUMENT naming the path.
  google.protobuf.Struct platform_values = 8;

  // The starting values file (YAML, comments kept): the keys a tenant may
  // change, with the platform's suggested values. Tenants pull it
  // (GetComponentValues), edit it and send it as Component.values; keys
  // left as in this file are not stored, so later changes to the file
  // still reach them. Empty when the component takes no values.
  string user_values = 9;

  // Who controls the component. PLATFORM: installed with every cluster, with
  // fixed values; a tenant cannot enable, change or disable it. TENANT: a
  // tenant enables it on a cluster.
  ComponentManagement management = 10;

  // A tenant may set values for it: it is TENANT, and has a user_values
  // file and a values_schema.
  bool configurable = 11;

  // The platform switched the component off, or it needs one that is: it
  // cannot be enabled, and a PLATFORM one is not installed.
  bool disabled = 12;

  // Why it is off, e.g. "disabled" or "it requires kyverno, which is off".
  // Empty when disabled is false.
  string disabled_reason = 13;

  // The cloud the component is installed on; a cluster of another
  // provider never gets it. The same component for another cloud is
  // another definition (<name>-<provider>).
  CloudProvider provider = 14;

  // What the platform creates in the tenant's account for the component
  // (an IAM role), shown so tenants know what the component may do there.
  ComponentCloudResources cloud_resources = 16;
}
