syntax = "proto3";

package cloud.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// EventType says whether an event is news or a problem.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  // Something happened as expected: a step finished, a state was reached.
  EVENT_TYPE_NORMAL = 1;
  // Something failed, is held back, or needs a look.
  EVENT_TYPE_WARNING = 2;
}

// Event is one thing the controller reported about a network or a
// cluster: a state it reached, a step that finished, a failure.
message Event {
  // When it happened last.
  google.protobuf.Timestamp time = 1;
  EventType type = 2;
  // What happened, as one CamelCase word, e.g. "Running" or
  // "PlatformComponentFailed". The same for every event of that kind.
  string reason = 3;
  // The details, for people.
  string message = 4;
  // How often it happened; 1 unless it repeated.
  int32 count = 5;
  // The object the event is about: "Cluster", "Network", ...
  string object_kind = 6;
  string object_name = 7;
}

// ListClusterEventsRequest asks for the events of one cluster.
message ListClusterEventsRequest {
  // Tenant scope. DNS label, at most 56 chars so the tenant namespace
  // "tenant-<id>" fits the 63-char Kubernetes limit.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];
  // Cluster.id.
  string cluster_id = 2 [(buf.validate.field).string.uuid = true];

  // Maximum results per page. Defaults to 50; values above 200 are coerced
  // to 200.
  int32 page_size = 3 [(buf.validate.field).int32.gte = 0];

  // next_page_token from a previous call. All other fields must match the
  // call that produced it.
  string page_token = 4 [(buf.validate.field).string = {
    max_len: 8
    pattern: "^[0-9]*$"
  }];

  // Only the warnings.
  bool only_warnings = 5;
}

message ListClusterEventsResponse {
  // Newest first.
  repeated Event events = 1;
  // Empty when there are no more results.
  string next_page_token = 2;
}

// ListNetworkEventsRequest asks for the events of one network.
message ListNetworkEventsRequest {
  // Tenant scope. DNS label, at most 56 chars so the tenant namespace
  // "tenant-<id>" fits the 63-char Kubernetes limit.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];
  // Network.id.
  string network_id = 2 [(buf.validate.field).string.uuid = true];

  // Maximum results per page. Defaults to 50; values above 200 are coerced
  // to 200.
  int32 page_size = 3 [(buf.validate.field).int32.gte = 0];

  // next_page_token from a previous call. All other fields must match the
  // call that produced it.
  string page_token = 4 [(buf.validate.field).string = {
    max_len: 8
    pattern: "^[0-9]*$"
  }];

  // Only the warnings.
  bool only_warnings = 5;
}

message ListNetworkEventsResponse {
  // Newest first.
  repeated Event events = 1;
  // Empty when there are no more results.
  string next_page_token = 2;
}
