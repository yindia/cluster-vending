syntax = "proto3";

package cloud.v1;

import "buf/validate/validate.proto";

// ListClusterNodeGroupManifestsRequest asks for the Karpenter objects of
// one cluster's node groups.
message ListClusterNodeGroupManifestsRequest {
  // Tenant scope. DNS label, at most 56 chars so the tenant namespace
  // "tenant-<id>" fits the 63-char Kubernetes limit.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];
  // Cluster.id.
  string cluster_id = 2 [(buf.validate.field).string.uuid = true];
}

// ListClusterNodeGroupManifestsResponse lists the platform's Karpenter
// groups (the platform pool). Empty for a cluster whose node
// groups the platform does not manage (imported, not taken over).
message ListClusterNodeGroupManifestsResponse {
  repeated NodeGroupManifest node_groups = 1;
}

// NodeGroupManifest is a node group's Karpenter objects, rendered from the
// platform's config exactly as the controller applies them to the workload
// cluster.
message NodeGroupManifest {
  string name = 1;
  // True for the platform's own group.
  bool platform_managed = 2;
  // The group's EC2NodeClass as YAML.
  string ec2_node_class_yaml = 3;
  // The group's NodePool as YAML.
  string node_pool_yaml = 4;
}
