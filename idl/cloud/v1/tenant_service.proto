syntax = "proto3";

package cloud.v1;

import "buf/validate/validate.proto";
import "cloud/v1/conditions.proto";
import "cloud/v1/managed_resource.proto";
import "cloud/v1/pause.proto";
import "google/protobuf/timestamp.proto";

// TenantService onboards tenants' cloud accounts. A tenant can have any
// number of accounts, on any provider; an account must be bootstrapped
// before a network is created or imported in it (NetworkSpec.bootstrap_id
// is the account's CloudAccount.id).
service TenantService {
  // Registers one of the tenant's cloud accounts, stores it, and creates in
  //   the management cluster:
  //   - the tenant namespace tenant-<tenant_id>, if it does not exist
  //   - the account's provider credential in that namespace (AWS: a
  //     ProviderConfig with credentials.source IRSA and an assumeRoleChain
  //     into the tenant role, see "Account access" in idl/README.md). Its
  //     name is generated on the first bootstrap of the account and kept
  //     (status.provider_config_name).
  //
  // The Crossplane providers and their runtime config (AWS: IRSA as the
  // management role) are installed by the controller, not here; while the
  // provider's ProviderConfig kind is missing the call fails with
  // FAILED_PRECONDITION. The tenant must already have given the platform
  // admin access to the account (AWS: the tenant role exists and trusts the
  // management role); the call does not check it.
  //
  // Idempotent: calling it again for the same account updates its name and
  // converges the resources again. Another account ID adds an account. The
  // account is READY once the namespace and ProviderConfig are applied.
  // Whether the tenant role can be used is not checked by the call: the
  // controller checks it afterwards (status.access, condition
  // AccessVerified; VerifyCloudAccount asks for a check now), and an
  // account whose access is denied is FAILED.
  rpc BootstrapTenant(BootstrapTenantRequest) returns (BootstrapTenantResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Returns one bootstrapped account of the tenant by its bootstrap ID
  // (CloudAccount.id), or NOT_FOUND.
  rpc GetCloudAccount(GetCloudAccountRequest) returns (GetCloudAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists the tenant's bootstrapped accounts, ordered by provider then
  // account ID.
  rpc ListCloudAccounts(ListCloudAccountsRequest) returns (ListCloudAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Asks the controller to check the account's access now (the tenant
  // role in every region its networks use, and the calls the platform
  // needs); the result is in the account's status (access, condition
  // AccessVerified) once the controller has run it. The call only records
  // the request. The controller also checks when the account changes and
  // every 6 hours.
  rpc VerifyCloudAccount(VerifyCloudAccountRequest) returns (VerifyCloudAccountResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Returns the caller as the server sees it: who its token stands for and
  // what the server's rules let it do. Any accepted caller may ask. Where
  // the server does not authenticate (auth.mode none, or optional and no
  // token sent) the caller is anonymous and may do everything.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message WhoAmIRequest {}

message WhoAmIResponse {
  // No token was sent and the server let the request through.
  bool anonymous = 1;
  // The token's "sub".
  string subject = 2;
  // The issuer's username claim (Microsoft Entra ID: the object ID).
  string username = 3;
  // Name of the issuer in the server's configuration.
  string issuer = 4;
  // Values of the issuer's roles claim (Microsoft Entra ID: app roles).
  repeated string roles = 5;
  // What the server's rules grant the caller. Empty: only the calls open
  // to every accepted caller.
  repeated AccessGrant grants = 6;
}

// AccessRole is what a caller may do.
enum AccessRole {
  ACCESS_ROLE_UNSPECIFIED = 0;
  // Everything, for every tenant.
  ACCESS_ROLE_PLATFORM_ADMIN = 1;
  // Every tenant RPC of the grant's tenants.
  ACCESS_ROLE_TENANT_ADMIN = 2;
  // The RPCs without side effects of the grant's tenants.
  ACCESS_ROLE_TENANT_VIEWER = 3;
}

// AccessGrant is a role and the tenants it is for.
message AccessGrant {
  AccessRole role = 1;
  // Tenant IDs; "*" for every tenant. Empty for ACCESS_ROLE_PLATFORM_ADMIN.
  repeated string tenants = 2;
}

message BootstrapTenantRequest {
  // Same rules as CreateClusterRequest.tenant_id. The tenant is created if
  // it does not exist.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];
  // The account; output-only fields are ignored.
  CloudAccount account = 2 [(buf.validate.field).required = true];
}

message BootstrapTenantResponse {
  CloudAccount account = 1;
}

message GetCloudAccountRequest {
  // Same rules as BootstrapTenantRequest.tenant_id.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];
  // The bootstrap ID, CloudAccount.id.
  string id = 2 [(buf.validate.field).string.uuid = true];
}

message GetCloudAccountResponse {
  CloudAccount account = 1;
}

message VerifyCloudAccountRequest {
  // Same rules as BootstrapTenantRequest.tenant_id.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];
  // The bootstrap ID, CloudAccount.id.
  string id = 2 [(buf.validate.field).string.uuid = true];
  // Regions to check besides the ones the account's networks use, e.g.
  // the region of a network not created yet: a network or cluster is
  // created only in a region the last check passed. Kept until a later
  // verify names others; empty keeps the ones asked for before.
  repeated string regions = 3 [(buf.validate.field).repeated = {
    max_items: 10
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 32
        pattern: "^[a-z]{2}(-[a-z]+)+-[0-9]+$"
      }
    }
  }];
}

message VerifyCloudAccountResponse {
  // The account as it is now: its access is the last check's until the
  // controller has run the one asked for.
  CloudAccount account = 1;
}

message ListCloudAccountsRequest {
  // Same rules as BootstrapTenantRequest.tenant_id.
  string tenant_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 56
    pattern: "^[a-z0-9]([a-z0-9-]{0,54}[a-z0-9])?$"
  }];
}

message ListCloudAccountsResponse {
  // Not paginated: a tenant has a handful of accounts.
  repeated CloudAccount accounts = 1;
}

// CloudAccount is a cloud account a tenant gave the platform access to. A
// tenant has any number of them; any number of networks (and so clusters)
// can live in one, referring to it by id.
message CloudAccount {
  // Output only. The bootstrap ID: assigned by the server on the first
  // bootstrap of the account. GetCloudAccountRequest.id and
  // NetworkSpec.bootstrap_id refer to it.
  string id = 7;

  // Output only: from the request.
  string tenant_id = 1;

  // Human-readable name of the account: AWS account name, GCP project
  // name, Azure subscription name. Informational only; not unique.
  string account_name = 2 [(buf.validate.field).string.max_len = 128];

  // Output only.
  CloudAccountStatus status = 3;
  // Output only.
  google.protobuf.Timestamp create_time = 4;
  // Output only.
  google.protobuf.Timestamp update_time = 5;

  // The account's cloud and its identifier there, unique within the
  // tenant. Bootstrapping the same identifier again updates that account.
  // Exactly one must be set.
  oneof provider {
    option (buf.validate.oneof).required = true;

    AwsAccount aws = 10;
    // gcp = 11 (GcpProject: project_id), azure = 12 (AzureSubscription:
    // subscription_id, directory_id).
  }
}

// AwsAccount identifies a tenant's AWS account and the role the platform
// assumes in it.
message AwsAccount {
  // 12-digit AWS account ID. Immutable.
  string account_id = 1 [(buf.validate.field).string.pattern = "^[0-9]{12}$"];

  // Name of the IAM role the platform assumes in the account (no path),
  // e.g. "cluster-vending-provisioner". The tenant creates it with admin
  // rights, trusting the platform's management role.
  string role = 2 [(buf.validate.field).string.pattern = "^[\\w+=,.@-]{1,64}$"];
}

// CloudAccountState is the coarse state of a tenant's cloud account.
enum CloudAccountState {
  CLOUD_ACCOUNT_STATE_UNSPECIFIED = 0;
  // Not reported yet: bootstrap is applied by the call itself.
  CLOUD_ACCOUNT_STATE_BOOTSTRAPPING = 1;
  // The namespace and the credential (AWS: ProviderConfig) are applied,
  // and the last access check did not deny anything (condition
  // AccessVerified: True, or Unknown before the first verdict).
  CLOUD_ACCOUNT_STATE_READY = 2;
  // The controller's access check was denied: the tenant role cannot be
  // used in a region, or does not allow a call the platform needs
  // (status.access says which). A failed bootstrap is the call's error.
  CLOUD_ACCOUNT_STATE_FAILED = 3;
}

// CloudAccountStatus is the observed state of a tenant's cloud account.
message CloudAccountStatus {
  CloudAccountState state = 1;
  // Kubernetes namespace holding the tenant's resources, tenant-<tenant_id>.
  string namespace = 2;
  // Name of the account's provider credential (AWS: ProviderConfig) in
  // namespace: generated on the first bootstrap, then fixed. The managed
  // resources of every network and cluster in the account reference it.
  string provider_config_name = 3;
  repeated Condition conditions = 4;
  // The identity the provider credential assumes in the account: AWS the
  // tenant role ARN (GCP: service account, Azure: client ID).
  string identity = 5;
  // Everything the platform created for the account, in creation order:
  // the bootstrap's own objects (namespace, ProviderConfig) and those of
  // its networks, clusters and node pools.
  repeated ManagedResource managed_resources = 6;
  // An operator's pause (AdminService.PauseReconcile): the platform does
  // not change the account's ProviderConfig, its credentials copy or its
  // bindings until it is resumed. The condition Paused is True and says
  // who, since when and why. Unset: not paused.
  Pause pause = 7;
  // The controller's last check that it can reach and act in the account
  // (the tenant role in every region the account's networks use, and the
  // calls the platform needs). The condition AccessVerified says the same.
  // Unset: not checked yet.
  AccountAccess access = 8;
}

// AccountAccess is what an access check of an account found.
message AccountAccess {
  // Every region and check passed when last checked.
  bool verified = 1;
  // The last check that gave a verdict.
  google.protobuf.Timestamp checked_time = 2;
  // The last check tried; later than checked_time when it failed for a
  // transient reason.
  google.protobuf.Timestamp attempted_time = 3;
  // The last attempt failed transiently (throttling, the network);
  // verified and the results are from checked_time.
  bool stale = 4;
  // Who the calls were made as: the assumed tenant role.
  string principal_arn = 5;
  // What failed first; empty when verified.
  string reason = 6;
  string message = 7;
  // Whether the tenant role could be used in each region.
  repeated AccessResult regions = 8;
  // Each call of the check, per region.
  repeated AccessResult checks = 9;
}

// AccessResult is one region's or call's outcome; action is empty for a
// region.
message AccessResult {
  string action = 1;
  string region = 2;
  bool ok = 3;
  string reason = 4;
  string message = 5;
}
