# Checked against chart external-secrets 2.15.0 (External Secrets Operator
# v2.15.0) from https://charts.external-secrets.io. The project's support
# table lists 2.15 for Kubernetes 1.37 (docs/architecture.md#components-and-the-catalog).
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: external-secrets
spec:
  # The cloud it is installed on; the same component for another cloud is
  # another definition, <name>-<provider> (docs/architecture.md#components-and-the-catalog).
  provider: aws
  description: External Secrets Operator, which copies secrets from an external store (AWS Secrets Manager, Parameter Store and others) into Kubernetes Secrets.
  # Installed with every cluster by the platform; not a tenant's to enable.
  management: Platform
  namespace: external-secrets
  install:
    helm:
      # The one upstream chart: it installs and upgrades its own CRDs
      # (installCRDs), as templates.
      repository: https://charts.external-secrets.io
      chart: external-secrets
  # What it runs, for the sizing rule of the group it runs on (`controller
  # --check`; docs/architecture.md#node-layout, "Sizing the system group"):
  # where each workload's replicas and per-pod requests are in
  # platformValues below, which must set them explicitly.
  sizing:
    deployments:
      - name: external-secrets
        replicas: replicaCount
        requests: resources.requests
      - name: external-secrets-webhook
        replicas: webhook.replicaCount
        requests: webhook.resources.requests
      - name: external-secrets-cert-controller
        replicas: certController.replicaCount
        requests: certController.resources.requests
  # No cloudResources: the operator gets no IAM role of its own. A store
  # names the service account whose role it reads with (docs/architecture.md#components-and-the-catalog).
  platformValues:
    installCRDs: true
    global:
      # For the chart's three Deployments (controller, webhook,
      # cert-controller): each falls back to these.
      # Phase 2: Karpenter's platform pool (docs/architecture.md#node-layout,
      # "Install order"): its labels, and a toleration of its taint. They have
      # no value until Karpenter is Ready and the pool is, so this installs after.
      nodeSelector: ${platform.nodeSelector}
      tolerations: ${platform.tolerations}
    # One replica each (system group sizing, docs/architecture.md#node-layout; the chart's
    # leader election stays on for a later scale-out) and no
    # PodDisruptionBudget: one that demands the only replica stay up would
    # stop a node drain. Requests are explicit so the sizing test sees them.
    replicaCount: 1
    leaderElect: true
    podDisruptionBudget:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    webhook:
      replicaCount: 1
      podDisruptionBudget:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    certController:
      replicaCount: 1
      podDisruptionBudget:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
