# Checked against chart external-secrets 2.15.0 (External Secrets Operator
# v2.15.0) from https://charts.external-secrets.io. The project's support
# table lists 2.15 for Kubernetes 1.37 (docs/catalog.md).
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: external-secrets
spec:
  # The cloud it is installed on; the same component for another cloud is
  # another definition, <name>-<provider> (docs/catalog.md).
  provider: aws
  description: External Secrets Operator, which copies secrets from an external store (AWS Secrets Manager, Parameter Store and others) into Kubernetes Secrets.
  # Installed with every cluster by the platform; not a tenant's to enable.
  management: Platform
  namespace: external-secrets
  install:
    helm:
      # The one upstream chart: it installs and upgrades its own CRDs
      # (installCRDs), as templates.
      repository: https://charts.external-secrets.io
      chart: external-secrets
  # No cloudResources: the operator gets no IAM role of its own. A store
  # names the service account whose role it reads with (docs/catalog.md).
  platformValues:
    installCRDs: true
    global:
      # The cluster's default node pool, for the chart's three Deployments
      # (controller, webhook, cert-controller): each falls back to these.
      nodeSelector: ${system.nodeSelector}
      tolerations: ${system.tolerations}
    # Two controllers, one active: the chart says to turn leader election on
    # when replicaCount or certController.replicaCount is above 1.
    replicaCount: 2
    leaderElect: true
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    webhook:
      # The webhook validates every store and ExternalSecret write: two
      # replicas keep it answering while a node drains.
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    certController:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
