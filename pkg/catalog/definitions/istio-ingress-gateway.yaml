apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: istio-ingress-gateway
spec:
  # The cloud it is installed on; the same component for another cloud is
  # another definition, <name>-<provider> (docs/architecture.md#components-and-the-catalog).
  provider: aws
  description: Cluster ingress, Istio's gateway (an Envoy Deployment) behind an internal AWS Network Load Balancer.
  # A member of the istio bundle (istio.yaml): installed with it, by the
  # platform, with every cluster.
  management: Platform
  internal: true
  # Separate namespace from the control plane, as Istio recommends. It must
  # not carry the label istio-injection=disabled: the gateway's image is
  # injected by istiod.
  namespace: istio-ingress
  # istiod: injects the gateway's proxy and configures it.
  # aws-load-balancer-controller: the Service is handed to it (type
  # "external"); without the controller the NLB is never created.
  requires: [istiod, aws-load-balancer-controller]
  versionGroup: istio
  upgradeOneMinorAtATime: true
  install:
    # Helm waits this long for each chart to roll out (docs/architecture.md#helm-operations).
    timeout: 15m
    helm:
      # Istio's own gateway chart, at the version of the other Istio charts.
      repository: https://blob.istio.io/istio-release/charts
      chart: gateway
  platformValues:
    # The cluster's default node pool: its labels, and a toleration per taint.
    nodeSelector: ${platform.nodeSelector}
    tolerations: ${platform.tolerations}
    labels:
      # What an Istio Gateway's spec.selector names: istio: ingressgateway.
      istio: ingressgateway
    service:
      type: LoadBalancer
      annotations:
        # An NLB made by the AWS Load Balancer Controller, to pod IPs.
        service.beta.kubernetes.io/aws-load-balancer-type: external
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
        # Locked. An internet-facing ingress would be a separate definition.
        service.beta.kubernetes.io/aws-load-balancer-scheme: internal
        # The gateway's own readiness endpoint: ports 80 and 443 only listen
        # once a Gateway object opens them, so a TCP check would fail.
        service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
        service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "15021"
        service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz/ready
    autoscaling:
      enabled: true
      # One replica at least (system group sizing, docs/architecture.md#node-layout); the HPA
      # adds more under load. No PodDisruptionBudget: the chart allows one
      # only with two replicas, and one that demands it would stop a drain.
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "2"
        memory: 1Gi
