# Istio in ambient mode (no sidecars): one component made of five charts,
# all Istio's own, each a definition of its own (internal: true) with its
# chart, namespace, version pin and requires. Checked against Istio 1.32.0;
# docs/architecture.md#components-and-the-catalog has the caveats.
#
# The members are installed in requires order, each once the one before is
# Ready: istio-base, then istiod, istio-cni, ztunnel, and the ingress
# gateway after istiod. A release pins every member, at one version.
apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: istio
spec:
  # The cloud it is installed on; the same component for another cloud is
  # another definition, <name>-<provider> (docs/architecture.md#components-and-the-catalog).
  provider: aws
  description: Istio service mesh in ambient mode, with an internal ingress gateway. Namespaces join the mesh with the label istio.io/dataplane-mode=ambient.
  # Installed with every cluster by the platform; not a tenant's to enable.
  management: Platform
  includes:
  - istio-base
  - istiod
  - istio-cni
  - ztunnel
  - istio-ingress-gateway
