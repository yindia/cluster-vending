apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: istiod
spec:
  # The cloud it is installed on; the same component for another cloud is
  # another definition, <name>-<provider> (docs/catalog.md).
  provider: aws
  description: Istio control plane (istiod) with the ambient profile; deploys waypoints and Gateway API gateways once the Gateway API CRDs are installed.
  # A member of the istio bundle (istio.yaml): installed with it, by the
  # platform, with every cluster.
  management: Platform
  internal: true
  namespace: istio-system
  # The Gateway API CRDs are not installed by the platform (no upstream chart
  # ships them): istiod runs without them, and uses them once they exist
  # (waypoints, Gateway API ingress; docs/catalog.md).
  requires: [istio-base]
  versionGroup: istio
  upgradeOneMinorAtATime: true
  install:
    helm:
      repository: https://blob.istio.io/istio-release/charts
      chart: istiod
  platformValues:
    # The cluster's default node pool: its labels, and a toleration per taint.
    nodeSelector: ${system.nodeSelector}
    tolerations: ${system.tolerations}
    # `--set profile=ambient` from the ambient guide. The profile sets
    # PILOT_ENABLE_AMBIENT=true, HBONE for proxies and distroless images.
    profile: ambient
    global:
      istioNamespace: istio-system
      multiCluster:
        # Must be the same name as ztunnel's multiCluster.clusterName.
        clusterName: ${cluster.name}
      configValidation: true
    # One non-revisioned control plane, upgraded in place.
    revision: ""
    revisionTags: []
    istiodRemote:
      enabled: false
    # The only identity allowed to request certificates on behalf of pods: the
    # ztunnel service account of the ztunnel component (istio-system/ztunnel).
    trustedZtunnelNamespace: istio-system
    trustedZtunnelName: ztunnel
    sidecarInjectorWebhook:
      # No cluster-wide sidecar injection. Workloads join with the ambient label.
      enableNamespacesByDefault: false
    autoscaleEnabled: true
    autoscaleMin: 2
    autoscaleMax: 5
    resources:
      requests:
        cpu: 500m
        memory: 2048Mi
    gateways:
      # Gateways and waypoints that istiod deploys (also into tenant namespaces)
      # get the RuntimeDefault seccomp profile, so they pass Pod Security "restricted".
      seccompProfile:
        type: RuntimeDefault
    meshConfig:
      trustDomain: cluster.local
