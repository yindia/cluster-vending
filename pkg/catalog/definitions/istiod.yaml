apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: istiod
spec:
  # The cloud it is installed on; the same component for another cloud is
  # another definition, <name>-<provider> (docs/architecture.md#components-and-the-catalog).
  provider: aws
  description: Istio control plane (istiod) with the ambient profile; deploys waypoints and Gateway API gateways once the Gateway API CRDs are installed.
  # A member of the istio bundle (istio.yaml): installed with it, by the
  # platform, with every cluster.
  management: Platform
  internal: true
  namespace: istio-system
  # The Gateway API CRDs are not installed by the platform (no upstream chart
  # ships them): istiod runs without them, and uses them once they exist
  # (waypoints, Gateway API ingress; docs/architecture.md#components-and-the-catalog).
  requires: [istio-base]
  versionGroup: istio
  upgradeOneMinorAtATime: true
  install:
    # Helm waits this long for each chart to roll out (docs/architecture.md#helm-operations).
    timeout: 15m
    helm:
      repository: https://blob.istio.io/istio-release/charts
      chart: istiod
  # What it runs, for the sizing rule of the group it runs on (`controller
  # --check`; docs/architecture.md#node-layout, "Sizing the system group"):
  # where each workload's replicas and per-pod requests are in
  # platformValues below, which must set them explicitly.
  # With autoscaleEnabled the HPA's minimum is the replica count.
  sizing:
    deployments:
      - name: istiod
        replicas: autoscaleMin
        requests: resources.requests
  platformValues:
    # Phase 2: Karpenter's platform pool (docs/architecture.md#node-layout,
    # "Install order"): its labels, and a toleration of its taint. They have
    # no value until Karpenter is Ready and the pool is, so this installs after.
    nodeSelector: ${platform.nodeSelector}
    tolerations: ${platform.tolerations}
    # `--set profile=ambient` from the ambient guide. The profile sets
    # PILOT_ENABLE_AMBIENT=true, HBONE for proxies and distroless images.
    profile: ambient
    global:
      istioNamespace: istio-system
      defaultPodDisruptionBudget:
        enabled: false
      multiCluster:
        # Must be the same name as ztunnel's multiCluster.clusterName.
        clusterName: ${cluster.name}
      configValidation: true
    # One non-revisioned control plane, upgraded in place.
    revision: ""
    revisionTags: []
    istiodRemote:
      enabled: false
    # The only identity allowed to request certificates on behalf of pods: the
    # ztunnel service account of the ztunnel component (istio-system/ztunnel).
    trustedZtunnelNamespace: istio-system
    trustedZtunnelName: ztunnel
    sidecarInjectorWebhook:
      # No cluster-wide sidecar injection. Workloads join with the ambient label.
      enableNamespacesByDefault: false
    autoscaleEnabled: true
    # One replica at least (system group sizing, docs/architecture.md#node-layout); the HPA adds
    # more under load. A single replica has no PodDisruptionBudget: one that
    # demands it stay up would stop a node drain.
    autoscaleMin: 1
    autoscaleMax: 5
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    gateways:
      # Gateways and waypoints that istiod deploys (also into tenant namespaces)
      # get the RuntimeDefault seccomp profile, so they pass Pod Security "restricted".
      seccompProfile:
        type: RuntimeDefault
    meshConfig:
      trustDomain: cluster.local
