apiVersion: cloud.cluster-vending.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: karpenter
spec:
  # The cloud it is installed on; the same component for another cloud is
  # another definition, <name>-<provider> (docs/architecture.md#components-and-the-catalog).
  provider: aws
  description: Karpenter node autoscaler. It launches EC2 nodes for the platform pool, the only Karpenter pool a cluster has; the platform applies its NodePool and EC2NodeClass itself, this definition ships no chart for them. It runs on the system managed node group; the platform's other components run on its platform pool (docs/architecture.md#node-layout).
  # Installed with every cluster by the platform; not a tenant's to enable.
  management: Platform
  # The node provisioner (pkg/component/roles.go): by its role it installs
  # first (phase 1, sequence 0) and is the only definition on the system
  # group; every other platform component installs after it, by sequence,
  # those on the platform pool also wait for that pool; it cannot be
  # disabled; the user node groups are applied once it is Ready.
  role: NodeProvisioner
  namespace: kube-system
  install:
    helm:
      repository: oci://public.ecr.aws/karpenter
      chart: karpenter
      # The one upstream chart: it installs its own CRDs (its crds/ folder)
      # with the first install. Helm never upgrades them, so a version bump
      # that changes them needs the CRDs of that version applied first
      # (docs/architecture.md#components-and-the-catalog).
  cloudResources:
    iamRole:
      access: IRSA
      serviceAccounts: [{namespace: kube-system, name: karpenter}]
      # Official Karpenter v1.15.1 controller policy (website/content/en/v1.15/getting-started/
      # getting-started-with-karpenter/cloudformation.yaml): NodeLifecycle + IAMIntegration + EKSIntegration
      # + ZonalShift + ResourceDiscovery + Interruption (SQS) statements. Permission semantics match
      # upstream. Placeholders scope the cluster/account; PassRole targets the platform's Karpenter node
      # role (not the managed node group's) and the SQS statement the platform's interruption queue.
      # Optional Sid fields are omitted to keep the expanded managed policy below IAM's
      # 6144-character limit.
      policy: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Resource": [
                "arn:aws:ec2:${region}::image/*",
                "arn:aws:ec2:${region}::snapshot/*",
                "arn:aws:ec2:${region}:*:security-group/*",
                "arn:aws:ec2:${region}:*:subnet/*",
                "arn:aws:ec2:${region}:*:capacity-reservation/*",
                "arn:aws:ec2:${region}:*:placement-group/*"
              ],
              "Action": [
                "ec2:RunInstances",
                "ec2:CreateFleet"
              ]
            },
            {
              "Effect": "Allow",
              "Resource": "arn:aws:ec2:${region}:*:launch-template/*",
              "Action": [
                "ec2:RunInstances",
                "ec2:CreateFleet"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${cluster.name}": "owned"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.sh/nodepool": "*"
                }
              }
            },
            {
              "Effect": "Allow",
              "Resource": [
                "arn:aws:ec2:${region}:*:fleet/*",
                "arn:aws:ec2:${region}:*:instance/*",
                "arn:aws:ec2:${region}:*:volume/*",
                "arn:aws:ec2:${region}:*:network-interface/*",
                "arn:aws:ec2:${region}:*:launch-template/*",
                "arn:aws:ec2:${region}:*:spot-instances-request/*"
              ],
              "Action": [
                "ec2:RunInstances",
                "ec2:CreateFleet",
                "ec2:CreateLaunchTemplate"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:RequestTag/eks:eks-cluster-name": "${cluster.name}"
                },
                "StringLike": {
                  "aws:RequestTag/karpenter.sh/nodepool": "*"
                }
              }
            },
            {
              "Effect": "Allow",
              "Resource": [
                "arn:aws:ec2:${region}:*:fleet/*",
                "arn:aws:ec2:${region}:*:instance/*",
                "arn:aws:ec2:${region}:*:volume/*",
                "arn:aws:ec2:${region}:*:network-interface/*",
                "arn:aws:ec2:${region}:*:launch-template/*",
                "arn:aws:ec2:${region}:*:spot-instances-request/*"
              ],
              "Action": "ec2:CreateTags",
              "Condition": {
                "StringEquals": {
                  "aws:RequestTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:RequestTag/eks:eks-cluster-name": "${cluster.name}",
                  "ec2:CreateAction": [
                    "RunInstances",
                    "CreateFleet",
                    "CreateLaunchTemplate"
                  ]
                },
                "StringLike": {
                  "aws:RequestTag/karpenter.sh/nodepool": "*"
                }
              }
            },
            {
              "Effect": "Allow",
              "Resource": "arn:aws:ec2:${region}:*:instance/*",
              "Action": "ec2:CreateTags",
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${cluster.name}": "owned"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.sh/nodepool": "*"
                },
                "StringEqualsIfExists": {
                  "aws:RequestTag/eks:eks-cluster-name": "${cluster.name}"
                },
                "ForAllValues:StringEquals": {
                  "aws:TagKeys": [
                    "eks:eks-cluster-name",
                    "karpenter.sh/nodeclaim",
                    "Name"
                  ]
                }
              }
            },
            {
              "Effect": "Allow",
              "Resource": [
                "arn:aws:ec2:${region}:*:instance/*",
                "arn:aws:ec2:${region}:*:launch-template/*"
              ],
              "Action": [
                "ec2:TerminateInstances",
                "ec2:RebootInstances",
                "ec2:DeleteLaunchTemplate"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${cluster.name}": "owned"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.sh/nodepool": "*"
                }
              }
            },
            {
              "Effect": "Allow",
              "Resource": "${karpenter.nodeRoleArn}",
              "Action": "iam:PassRole",
              "Condition": {
                "StringEquals": {
                  "iam:PassedToService": [
                    "ec2.amazonaws.com",
                    "ec2.amazonaws.com.cn"
                  ]
                }
              }
            },
            {
              "Effect": "Allow",
              "Resource": "arn:aws:iam::${account.id}:instance-profile/*",
              "Action": [
                "iam:CreateInstanceProfile"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:RequestTag/eks:eks-cluster-name": "${cluster.name}",
                  "aws:RequestTag/topology.kubernetes.io/region": "${region}"
                },
                "StringLike": {
                  "aws:RequestTag/karpenter.k8s.aws/ec2nodeclass": "*"
                }
              }
            },
            {
              "Effect": "Allow",
              "Resource": "arn:aws:iam::${account.id}:instance-profile/*",
              "Action": [
                "iam:TagInstanceProfile"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:ResourceTag/topology.kubernetes.io/region": "${region}",
                  "aws:RequestTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:RequestTag/eks:eks-cluster-name": "${cluster.name}",
                  "aws:RequestTag/topology.kubernetes.io/region": "${region}"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.k8s.aws/ec2nodeclass": "*",
                  "aws:RequestTag/karpenter.k8s.aws/ec2nodeclass": "*"
                }
              }
            },
            {
              "Effect": "Allow",
              "Resource": "arn:aws:iam::${account.id}:instance-profile/*",
              "Action": [
                "iam:AddRoleToInstanceProfile",
                "iam:RemoveRoleFromInstanceProfile",
                "iam:DeleteInstanceProfile"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:ResourceTag/kubernetes.io/cluster/${cluster.name}": "owned",
                  "aws:ResourceTag/topology.kubernetes.io/region": "${region}"
                },
                "StringLike": {
                  "aws:ResourceTag/karpenter.k8s.aws/ec2nodeclass": "*"
                }
              }
            },
            {
              "Effect": "Allow",
              "Resource": "arn:aws:eks:${region}:${account.id}:cluster/${cluster.name}",
              "Action": "eks:DescribeCluster"
            },
            {
              "Effect": "Allow",
              "Resource": "*",
              "Action": [
                "arc-zonal-shift:GetManagedResource"
              ],
              "Condition": {
                "StringEquals": {
                  "arc-zonal-shift:ResourceIdentifier": "arn:aws:eks:${region}:${account.id}:cluster/${cluster.name}"
                }
              }
            },
            {
              "Effect": "Allow",
              "Resource": "*",
              "Action": [
                "ec2:DescribeCapacityReservations",
                "ec2:DescribeImages",
                "ec2:DescribeInstances",
                "ec2:DescribeInstanceStatus",
                "ec2:DescribeInstanceTypeOfferings",
                "ec2:DescribeInstanceTypes",
                "ec2:DescribeLaunchTemplates",
                "ec2:DescribePlacementGroups",
                "ec2:DescribeSecurityGroups",
                "ec2:DescribeSpotPriceHistory",
                "ec2:DescribeSubnets"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": "${region}"
                }
              }
            },
            {
              "Effect": "Allow",
              "Resource": "arn:aws:ssm:${region}::parameter/aws/service/*",
              "Action": "ssm:GetParameter"
            },
            {
              "Effect": "Allow",
              "Resource": "*",
              "Action": "pricing:GetProducts"
            },
            {
              "Effect": "Allow",
              "Resource": "*",
              "Action": "iam:ListInstanceProfiles"
            },
            {
              "Effect": "Allow",
              "Resource": "arn:aws:iam::${account.id}:instance-profile/*",
              "Action": "iam:GetInstanceProfile"
            },
            {
              "Effect": "Allow",
              "Resource": "arn:aws:sqs:${region}:${account.id}:${karpenter.interruptionQueue}",
              "Action": [
                "sqs:DeleteMessage",
                "sqs:GetQueueUrl",
                "sqs:ReceiveMessage"
              ]
            }
          ]
        }
  # What it runs, for the sizing rule of the group it runs on (`controller
  # --check`; docs/architecture.md#node-layout, "Sizing the system group"):
  # where each workload's replicas and per-pod requests are in
  # platformValues below, which must set them explicitly.
  sizing:
    deployments:
      - name: karpenter
        replicas: replicas
        requests: controller.resources.requests
  platformValues:
    serviceAccount:
      create: true
      name: karpenter
      annotations:
        eks.amazonaws.com/role-arn: ${iam.roleArn}
    settings:
      clusterName: ${cluster.name}
      clusterEndpoint: ${cluster.endpoint}
      # The platform's SQS queue (EventBridge: Spot interruption, rebalance,
      # instance state change, AWS Health), rendered with the cluster.
      interruptionQueue: ${karpenter.interruptionQueue}
    # The one component that keeps two replicas (anti-affinity below) on the
    # small system group; the controller is leader elected.
    replicas: 2
    # Requests are trimmed so the platform fits 2 x t3.medium
    # (docs/architecture.md#node-layout, "Sizing the system group"); the limits stay at the
    # official install command's 1 CPU / 1Gi.
    controller:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
    # Phase 1: the controller runs on the default managed node group (with
    # the affinity below, which keeps it off the nodes Karpenter launches):
    # its label, and a toleration of its taint. Every other component with a
    # workload runs on the platform pool it launches (${platform.*}), after it.
    nodeSelector: ${system.nodeSelector}
    tolerations: ${system.tolerations}
    # Chart default already keeps Karpenter off Karpenter-launched nodes (karpenter.sh/nodepool DoesNotExist).
    # Locked here and narrowed to EKS managed node group nodes, as the migrating-from-CAS guide recommends.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: DoesNotExist
            - key: eks.amazonaws.com/nodegroup
              operator: Exists
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
    # Fixed by the platform at the researched defaults.
    # Controller log verbosity: debug, info or error.
    logLevel: info
