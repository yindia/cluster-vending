# The versions this build ships: the one place to change a component's
# chart version, the Kubernetes minors on offer, or the channels.
# The controller turns it into the shipped Release (named after its content)
# and the three ReleaseChannels; nothing else in the code names a version.
#
# Each component's chart, values and IAM are in definitions/<name>.yaml.

# Kubernetes minors on offer, newest first.
#
# channel: the channel whose clusters run this minor. Each of alpha, beta
# and stable is on exactly one minor, alpha's the newest and stable's the
# oldest. To move a channel, edit its line here: adding a minor moves only
# the channel you put on it. A minor on no channel stays supported, and
# its users are warned to move off it.
#
# default: what a cluster on no channel gets when it names no version
# (exactly one minor). upgradeTo: the minor after this one (deprecation
# scans check against it).
kubernetes:
- minor: "1.37"
  nodeAmiPin: v20261107
  channel: alpha
  default: true
  endOfSupport: "2028-01-31"      # placeholder: set your own
- minor: "1.36"
  nodeAmiPin: v20261107
  channel: beta
  upgradeTo: "1.37"
  endOfSupport: "2027-09-30"
- minor: "1.35"
  nodeAmiPin: v20261107
  channel: stable
  upgradeTo: "1.36"
  endOfSupport: "2027-05-31"

# A minor can also lock Helm values of a component on that minor only
# (`values: {component: {...}}`); none does today.
#
# Chart version of every component on every minor above. A minor's own
# `components: {name: version}` overrides it on that minor only (a version
# group, istio-* or kyverno*, is overridden together).
components:
  aws-load-balancer-controller: "3.6.2"
  capsule: "0.15.2"
  external-secrets: "2.15.0"
  gpu-operator: "v26.7.2"
  istio-base: "1.32.0"
  istio-cni: "1.32.0"
  istio-ingress-gateway: "1.32.0"
  istiod: "1.32.0"
  karpenter: "1.15.1"
  kyverno: "3.10.0"
  kyverno-policies: "3.10.0"
  ztunnel: "1.32.0"

# The channels created on a new management cluster. A Pinned channel offers
# this build's release; an Automatic one follows the channel before it.
channels:
- {name: alpha, promotion: Pinned}
# releaseSoak: how long the channel before must have offered a release
# before an Automatic channel takes it.
- {name: beta, promotion: Automatic, releaseSoak: 168h}     # 7 days on alpha
- {name: stable, promotion: Automatic, releaseSoak: 336h}   # 14 days on beta
