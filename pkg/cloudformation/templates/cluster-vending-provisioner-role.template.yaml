AWSTemplateFormatVersion: '2010-09-09'
Conditions:
  CreateSpotServiceLinkedRole: !Equals
    - !Ref 'CreateSpotServiceLinkedRole'
    - 'true'
  HasExternalId: !Not
    - !Equals
      - !Ref 'ExternalId'
      - ''
  HasServerPrincipalArn: !Not
    - !Equals
      - !Ref 'ServerPrincipalArn'
      - ''
Description: >-
  cluster-vending provisioner role: the updater role, and creating and deleting the networks (VPC, subnets, gateways, routes, flow logs) and EKS clusters (node groups, add-ons, access, IAM roles, KMS keys,
  log groups, Karpenter queues) the cluster-vending platform manages in this account.
Outputs:
  RoleArn:
    Description: The role's ARN
    Value: !GetAtt 'Role.Arn'
  RoleName:
    Description: 'The role''s name: spec.aws.role of the CloudAccount'
    Value: !Ref 'Role'
Parameters:
  CreateSpotServiceLinkedRole:
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: >-
      Create the account's EC2 Spot service-linked role (AWSServiceRoleForEC2Spot), which Karpenter's Spot nodes need. Set true only when the account does not have it yet (aws iam get-role --role-name AWSServiceRoleForEC2Spot):
      CloudFormation fails to create a role that exists.
    Type: String
  ExternalId:
    AllowedPattern: ^$|^[A-Za-z0-9+=,.@:/_-]{32,1224}$
    Default: ''
    Description: 'The account''s external ID (cluster-vending account create fills it in): the management role must pass it to assume this role. Empty: none is required (accounts onboarded before external
      IDs).'
    MaxLength: 1224
    NoEcho: true
    Type: String
  ManagementRoleArn:
    AllowedPattern: ^arn:aws[a-z-]*:iam::\d{12}:role/.+$
    Description: ARN of the cluster-vending management role (the identity the controller and the Crossplane providers run as); the role trusts only it. cluster-vending account create fills it in from the
      API server.
    Type: String
  RoleName:
    AllowedPattern: ^cluster-vending-([A-Za-z0-9+=,.@_-]+-)?provisioner$
    Default: cluster-vending-provisioner
    Description: 'Name of the IAM role, and prefix of its policies: cluster-vending-provisioner, or cluster-vending-<anything>-provisioner for a stack of its own.'
    MaxLength: 64
    Type: String
  ServerPrincipalArn:
    AllowedPattern: ^$|^arn:aws[a-z-]*:iam::\d{12}:role/.+$
    Default: ''
    Description: >-
      ARN of the role the cluster-vending API server runs as, which reads the cluster results buckets (read-only). cluster-vending account create fills it in from the API server. Empty: the server has no
      AWS access, and only the management role is trusted.
    Type: String
Resources:
  ProvisionClustersPolicy:
    Properties:
      Description: 'cluster-vending provisioner role: provision clusters'
      ManagedPolicyName: !Sub '${RoleName}-provision-clusters'
      PolicyDocument:
        Statement:
          - Action:
              - eks:CreateCluster
              - eks:DeleteCluster
              - eks:CreateNodegroup
              - eks:DeleteNodegroup
              - eks:CreateAddon
              - eks:DeleteAddon
              - eks:CreateAccessEntry
              - eks:DeleteAccessEntry
              - eks:AssociateAccessPolicy
              - eks:DisassociateAccessPolicy
              - eks:CreatePodIdentityAssociation
              - eks:DeletePodIdentityAssociation
              - eks:AssociateIdentityProviderConfig
              - eks:DisassociateIdentityProviderConfig
            Effect: Allow
            Resource:
              - '*'
            Sid: ProvisionEKS
          - Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:CreateOpenIDConnectProvider
              - iam:DeleteOpenIDConnectProvider
            Effect: Allow
            Resource:
              - '*'
            Sid: ProvisionIAM
          - Action:
              - iam:ListInstanceProfileTags
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadInstanceProfileTags
          - Action:
              - iam:RemoveRoleFromInstanceProfile
              - iam:DeleteInstanceProfile
            Condition:
              'Null':
                aws:ResourceTag/karpenter.k8s.aws/ec2nodeclass: 'false'
            Effect: Allow
            Resource:
              - '*'
            Sid: CleanKarpenterInstanceProfiles
          - Action:
              - iam:PassRole
            Condition:
              StringEquals:
                iam:PassedToService:
                  - eks.amazonaws.com
                  - ec2.amazonaws.com
                  - pods.eks.amazonaws.com
                  - vpc-flow-logs.amazonaws.com
            Effect: Allow
            Resource:
              - '*'
            Sid: PassRolesToServices
          - Action:
              - iam:CreateServiceLinkedRole
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - eks.amazonaws.com
                  - eks-nodegroup.amazonaws.com
                  - autoscaling.amazonaws.com
            Effect: Allow
            Resource:
              - '*'
            Sid: ServiceLinkedRoles
          - Action:
              - kms:CreateKey
              - kms:CreateAlias
              - kms:DeleteAlias
              - kms:PutKeyPolicy
              - kms:ScheduleKeyDeletion
            Effect: Allow
            Resource:
              - '*'
            Sid: ProvisionKMS
          - Action:
              - kms:CreateGrant
            Condition:
              Bool:
                kms:GrantIsForAWSResource: 'true'
            Effect: Allow
            Resource:
              - '*'
            Sid: KMSGrantsForEKS
          - Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
            Effect: Allow
            Resource:
              - '*'
            Sid: ProvisionLogs
          - Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - events:PutRule
              - events:DeleteRule
            Effect: Allow
            Resource:
              - '*'
            Sid: ProvisionKarpenterEvents
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
  ProvisionNetworkPolicy:
    Properties:
      Description: 'cluster-vending provisioner role: provision network'
      ManagedPolicyName: !Sub '${RoleName}-provision-network'
      PolicyDocument:
        Statement:
          - Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:CreateInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:AllocateAddress
              - ec2:ReleaseAddress
              - ec2:DisassociateAddress
              - ec2:CreateNatGateway
              - ec2:DeleteNatGateway
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:ReplaceRouteTableAssociation
              - ec2:CreateNetworkAcl
              - ec2:DeleteNetworkAcl
              - ec2:CreateNetworkAclEntry
              - ec2:DeleteNetworkAclEntry
              - ec2:ReplaceNetworkAclAssociation
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:CreateFlowLogs
              - ec2:DeleteFlowLogs
              - ec2:CreateLaunchTemplate
              - ec2:DeleteLaunchTemplate
              - ec2:DeleteLaunchTemplateVersions
              - ec2:RunInstances
            Effect: Allow
            Resource:
              - '*'
            Sid: ProvisionNetwork
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
  ProvisionResultsPolicy:
    Properties:
      Description: 'cluster-vending provisioner role: provision results'
      ManagedPolicyName: !Sub '${RoleName}-provision-results'
      PolicyDocument:
        Statement:
          - Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:ListBucket
              - s3:PutBucketTagging
              - s3:PutBucketPublicAccessBlock
              - s3:PutBucketOwnershipControls
              - s3:DeleteBucketOwnershipControls
              - s3:PutEncryptionConfiguration
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutLifecycleConfiguration
              - s3:GetBucket*
              - s3:GetEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetAccelerateConfiguration
              - s3:GetReplicationConfiguration
            Effect: Allow
            Resource:
              - arn:aws:s3:::cv-*
            Sid: ProvisionResultsBuckets
          - Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
            Effect: Allow
            Resource:
              - arn:aws:s3:::cv-*/*
            Sid: ReadWriteResultsObjects
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
  ReadClustersPolicy:
    Properties:
      Description: 'cluster-vending provisioner role: read clusters'
      ManagedPolicyName: !Sub '${RoleName}-read-clusters'
      PolicyDocument:
        Statement:
          - Action:
              - eks:Describe*
              - eks:List*
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadEKS
          - Action:
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:GetOpenIDConnectProvider
              - iam:ListRoles
              - iam:ListPolicies
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:ListRoleTags
              - iam:ListPolicyTags
              - iam:ListPolicyVersions
              - iam:ListInstanceProfilesForRole
              - iam:ListOpenIDConnectProviders
              - iam:ListOpenIDConnectProviderTags
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadIAM
          - Action:
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListResourceTags
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadKMS
          - Action:
              - logs:DescribeLogGroups
              - logs:ListTagsForResource
              - logs:ListTagsLogGroup
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadLogs
          - Action:
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ListQueueTags
              - events:DescribeRule
              - events:ListTargetsByRule
              - events:ListTagsForResource
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadKarpenterEvents
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
  ReadNetworkPolicy:
    Properties:
      Description: 'cluster-vending provisioner role: read network'
      ManagedPolicyName: !Sub '${RoleName}-read-network'
      PolicyDocument:
        Statement:
          - Action:
              - ec2:Describe*
              - ec2:GetEbsEncryptionByDefault
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadEC2
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
  Role:
    Properties:
      AssumeRolePolicyDocument: !If
        - HasExternalId
        - !If
          - HasServerPrincipalArn
          - Statement:
              - Action:
                  - sts:AssumeRole
                Condition:
                  StringEquals:
                    sts:ExternalId: !Ref 'ExternalId'
                Effect: Allow
                Principal:
                  AWS:
                    - !Ref 'ManagementRoleArn'
                    - !Ref 'ServerPrincipalArn'
            Version: '2012-10-17'
          - Statement:
              - Action:
                  - sts:AssumeRole
                Condition:
                  StringEquals:
                    sts:ExternalId: !Ref 'ExternalId'
                Effect: Allow
                Principal:
                  AWS:
                    - !Ref 'ManagementRoleArn'
            Version: '2012-10-17'
        - !If
          - HasServerPrincipalArn
          - Statement:
              - Action:
                  - sts:AssumeRole
                Effect: Allow
                Principal:
                  AWS:
                    - !Ref 'ManagementRoleArn'
                    - !Ref 'ServerPrincipalArn'
            Version: '2012-10-17'
          - Statement:
              - Action:
                  - sts:AssumeRole
                Effect: Allow
                Principal:
                  AWS:
                    - !Ref 'ManagementRoleArn'
            Version: '2012-10-17'
      Description: Assumed by the cluster-vending platform (provisioner)
      ManagedPolicyArns:
        - !Ref 'ReadNetworkPolicy'
        - !Ref 'ReadClustersPolicy'
        - !Ref 'UpdatePolicy'
        - !Ref 'ProvisionNetworkPolicy'
        - !Ref 'ProvisionClustersPolicy'
        - !Ref 'ProvisionResultsPolicy'
      RoleName: !Ref 'RoleName'
      Tags:
        - Key: cluster-vending.io/role
          Value: provisioner
        - Key: managed-by
          Value: cluster-vending
    Type: AWS::IAM::Role
  SpotServiceLinkedRole:
    Condition: CreateSpotServiceLinkedRole
    DeletionPolicy: Retain
    Properties:
      AWSServiceName: spot.amazonaws.com
      Description: EC2 Spot, for the platform's Karpenter nodes
    Type: AWS::IAM::ServiceLinkedRole
    UpdateReplacePolicy: Retain
  UpdatePolicy:
    Properties:
      Description: 'cluster-vending provisioner role: update'
      ManagedPolicyName: !Sub '${RoleName}-update'
      PolicyDocument:
        Statement:
          - Action:
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:ModifyVpcAttribute
              - ec2:ModifySubnetAttribute
              - ec2:ModifySecurityGroupRules
              - ec2:UpdateSecurityGroupRuleDescriptionsEgress
              - ec2:UpdateSecurityGroupRuleDescriptionsIngress
              - ec2:ReplaceRoute
              - ec2:ReplaceNetworkAclEntry
              - ec2:ModifyLaunchTemplate
              - ec2:CreateLaunchTemplateVersion
            Effect: Allow
            Resource:
              - '*'
            Sid: UpdateNetwork
          - Action:
              - eks:UpdateClusterConfig
              - eks:UpdateClusterVersion
              - eks:UpdateNodegroupConfig
              - eks:UpdateNodegroupVersion
              - eks:UpdateAddon
              - eks:UpdateAccessEntry
              - eks:UpdatePodIdentityAssociation
              - eks:TagResource
              - eks:UntagResource
            Effect: Allow
            Resource:
              - '*'
            Sid: UpdateEKS
          - Action:
              - iam:TagRole
              - iam:UntagRole
              - iam:TagPolicy
              - iam:UntagPolicy
              - iam:TagOpenIDConnectProvider
              - iam:UntagOpenIDConnectProvider
              - iam:UpdateRole
              - iam:UpdateAssumeRolePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:UpdateOpenIDConnectProviderThumbprint
            Effect: Allow
            Resource:
              - '*'
            Sid: UpdateIAM
          - Action:
              - kms:EnableKeyRotation
              - kms:TagResource
              - kms:UntagResource
              - kms:UpdateAlias
              - logs:PutRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:TagLogGroup
            Effect: Allow
            Resource:
              - '*'
            Sid: UpdateKMSAndLogs
          - Action:
              - sqs:SetQueueAttributes
              - sqs:TagQueue
              - sqs:UntagQueue
              - events:PutTargets
              - events:RemoveTargets
              - events:TagResource
              - events:UntagResource
            Effect: Allow
            Resource:
              - '*'
            Sid: UpdateKarpenterEvents
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
