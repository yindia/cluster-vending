AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  cluster-vending reader role: read-only access for the cluster-vending platform to the networks and EKS clusters of this account (import, the access check, observation). It cannot create, change or delete
  anything.
Outputs:
  RoleArn:
    Description: The role's ARN
    Value: !GetAtt 'Role.Arn'
  RoleName:
    Description: 'The role''s name: spec.aws.role of the CloudAccount'
    Value: !Ref 'Role'
Parameters:
  ManagementRoleArn:
    AllowedPattern: ^arn:aws[a-z-]*:iam::\d{12}:role/.+$
    Description: >-
      ARN of the cluster-vending management role (the identity the controller and the Crossplane providers run as); the role trusts only it. The platform team gives it: cluster-vending account template
      prints it.
    Type: String
Resources:
  ReadClustersPolicy:
    Properties:
      Description: 'cluster-vending reader role: read clusters'
      ManagedPolicyName: cluster-vending-reader-read-clusters
      PolicyDocument:
        Statement:
          - Action:
              - eks:Describe*
              - eks:List*
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadEKS
          - Action:
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:GetOpenIDConnectProvider
              - iam:ListRoles
              - iam:ListPolicies
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:ListRoleTags
              - iam:ListPolicyTags
              - iam:ListPolicyVersions
              - iam:ListInstanceProfilesForRole
              - iam:ListOpenIDConnectProviders
              - iam:ListOpenIDConnectProviderTags
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadIAM
          - Action:
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListResourceTags
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadKMS
          - Action:
              - logs:DescribeLogGroups
              - logs:ListTagsForResource
              - logs:ListTagsLogGroup
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadLogs
          - Action:
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ListQueueTags
              - events:DescribeRule
              - events:ListTargetsByRule
              - events:ListTagsForResource
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadKarpenterEvents
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
  ReadNetworkPolicy:
    Properties:
      Description: 'cluster-vending reader role: read network'
      ManagedPolicyName: cluster-vending-reader-read-network
      PolicyDocument:
        Statement:
          - Action:
              - ec2:Describe*
              - ec2:GetEbsEncryptionByDefault
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadEC2
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
  Role:
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              AWS: !Ref 'ManagementRoleArn'
        Version: '2012-10-17'
      Description: Assumed by the cluster-vending platform (reader)
      ManagedPolicyArns:
        - !Ref 'ReadNetworkPolicy'
        - !Ref 'ReadClustersPolicy'
      RoleName: cluster-vending-reader
      Tags:
        - Key: cluster-vending.io/role
          Value: reader
        - Key: managed-by
          Value: cluster-vending
    Type: AWS::IAM::Role
