AWSTemplateFormatVersion: '2010-09-09'
Conditions:
  HasExternalId: !Not
    - !Equals
      - !Ref 'ExternalId'
      - ''
  HasServerPrincipalArn: !Not
    - !Equals
      - !Ref 'ServerPrincipalArn'
      - ''
Description: >-
  cluster-vending reader role: read-only access for the cluster-vending platform to the networks and EKS clusters of this account (import, the access check, observation). It cannot create, change or delete
  anything.
Outputs:
  RoleArn:
    Description: The role's ARN
    Value: !GetAtt 'Role.Arn'
  RoleName:
    Description: 'The role''s name: spec.aws.role of the CloudAccount'
    Value: !Ref 'Role'
  TemplateVersion:
    Description: 'The version of this template: the platform compares it with what it needs and says when the stack is to be updated'
    Value: '2'
Parameters:
  ExternalId:
    AllowedPattern: ^$|^[A-Za-z0-9+=,.@:/_-]{32,1224}$
    Default: ''
    Description: 'The account''s external ID (cluster-vending account create fills it in): the management role must pass it to assume this role. Empty: none is required (accounts onboarded before external
      IDs).'
    MaxLength: 1224
    NoEcho: true
    Type: String
  ManagementRoleArn:
    AllowedPattern: ^arn:aws[a-z-]*:iam::\d{12}:role/.+$
    Description: ARN of the cluster-vending management role (the identity the controller and the Crossplane providers run as); the role trusts only it. cluster-vending account create fills it in from the
      API server.
    Type: String
  RoleName:
    AllowedPattern: ^cluster-vending-([A-Za-z0-9+=,.@_-]+-)?reader$
    Default: cluster-vending-reader
    Description: 'Name of the IAM role, and prefix of its policies: cluster-vending-reader, or cluster-vending-<anything>-reader for a stack of its own.'
    MaxLength: 64
    Type: String
  ServerPrincipalArn:
    AllowedPattern: ^$|^arn:aws[a-z-]*:iam::\d{12}:role/.+$
    Default: ''
    Description: >-
      ARN of the role the cluster-vending API server runs as, which reads the cluster results buckets (read-only). cluster-vending account create fills it in from the API server. Empty: the server has no
      AWS access, and only the management role is trusted.
    Type: String
Resources:
  ReadClustersPolicy:
    Properties:
      Description: 'cluster-vending reader role: read clusters'
      ManagedPolicyName: !Sub '${RoleName}-read-clusters'
      PolicyDocument:
        Statement:
          - Action:
              - eks:Describe*
              - eks:List*
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadEKS
          - Action:
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:GetOpenIDConnectProvider
              - iam:ListRoles
              - iam:ListPolicies
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:ListRoleTags
              - iam:ListPolicyTags
              - iam:ListPolicyVersions
              - iam:ListInstanceProfilesForRole
              - iam:ListOpenIDConnectProviders
              - iam:ListOpenIDConnectProviderTags
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadIAM
          - Action:
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListResourceTags
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadKMS
          - Action:
              - logs:DescribeLogGroups
              - logs:ListTagsForResource
              - logs:ListTagsLogGroup
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadLogs
          - Action:
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ListQueueTags
              - events:DescribeRule
              - events:ListTargetsByRule
              - events:ListTagsForResource
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadKarpenterEvents
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
  ReadNetworkPolicy:
    Properties:
      Description: 'cluster-vending reader role: read network'
      ManagedPolicyName: !Sub '${RoleName}-read-network'
      PolicyDocument:
        Statement:
          - Action:
              - ec2:Describe*
              - ec2:GetEbsEncryptionByDefault
            Effect: Allow
            Resource:
              - '*'
            Sid: ReadEC2
        Version: '2012-10-17'
    Type: AWS::IAM::ManagedPolicy
  Role:
    Properties:
      AssumeRolePolicyDocument: !If
        - HasExternalId
        - !If
          - HasServerPrincipalArn
          - Statement:
              - Action:
                  - sts:AssumeRole
                Condition:
                  StringEquals:
                    sts:ExternalId: !Ref 'ExternalId'
                Effect: Allow
                Principal:
                  AWS:
                    - !Ref 'ManagementRoleArn'
                    - !Ref 'ServerPrincipalArn'
            Version: '2012-10-17'
          - Statement:
              - Action:
                  - sts:AssumeRole
                Condition:
                  StringEquals:
                    sts:ExternalId: !Ref 'ExternalId'
                Effect: Allow
                Principal:
                  AWS:
                    - !Ref 'ManagementRoleArn'
            Version: '2012-10-17'
        - !If
          - HasServerPrincipalArn
          - Statement:
              - Action:
                  - sts:AssumeRole
                Effect: Allow
                Principal:
                  AWS:
                    - !Ref 'ManagementRoleArn'
                    - !Ref 'ServerPrincipalArn'
            Version: '2012-10-17'
          - Statement:
              - Action:
                  - sts:AssumeRole
                Effect: Allow
                Principal:
                  AWS:
                    - !Ref 'ManagementRoleArn'
            Version: '2012-10-17'
      Description: Assumed by the cluster-vending platform (reader)
      ManagedPolicyArns:
        - !Ref 'ReadNetworkPolicy'
        - !Ref 'ReadClustersPolicy'
      RoleName: !Ref 'RoleName'
      Tags:
        - Key: cluster-vending.io/role
          Value: reader
        - Key: cluster-vending.io/template-version
          Value: '2'
        - Key: managed-by
          Value: cluster-vending
    Type: AWS::IAM::Role
