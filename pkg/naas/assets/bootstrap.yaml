# Namespace workload administration, never Capsule ownership or security admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: naas-workload-admin
rules:
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets, replicasets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ['']
  resources: [pods, services, configmaps, persistentvolumeclaims]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: ['']
  resources: [pods/log, events, resourcequotas, limitranges]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [pods/exec, pods/attach]
  verbs: [get, create]
---
# Read-only workload visibility. No Secrets, exec/attach, token requests or RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: naas-workload-viewer
rules:
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets, replicasets]
