# SHARED WORKLOAD-CLUSTER BOOTSTRAP — installed by the versioned Capsule pin.
# Install these shared GlobalTenantResource definitions once per NaaS-enabled
# workload cluster, through the platform bootstrap/release flow.
# Then our per-subtenant controller creates/updates ONLY Capsule Tenant CRs.
# Capsule (not our management controller) creates Namespace, NetworkPolicy,
# Istio policies, LimitRange, workload ServiceAccounts and final RoleBindings.
# Istio and the native policy-enforcing CNI enforce the generated policies.
#
# Prerequisites not installed here: Capsule 0.15.2, existing cert-manager, Istio
# ambient CRDs/controllers, qualified native CNI, and protected admission guards.
# The release pin disables the chart manager RBAC and pins its controller SA to
# capsule-system/capsule. Explicit controller roles below retain pinned upstream
# strict cleanup permissions, but impersonation is a namespaced Role permitting
# ONLY naas-system/provisioner. That trusted SA is mapped as a Capsule user/admin
# by the release pin; no human administrator or cluster-admin binding is added.
#
# These templates DO NOT prove runtime isolation or automatically grant access.
# The management observer verifies baseline resources and qualification results,
# then changes ONLY the Capsule Tenant's protected access-ready label to true.
# dependsOn is replication readiness, NOT per-subtenant packet/policy validation.
# Guard workloads with protected namespace readiness before granting access.
#
# Namespace and security baseline use deletion: Orphan to avoid deleting data or
# security controls on selector/profile removal. Access bindings use Remove so
# withdrawal of access-ready revokes generated developer bindings eventually.
# Namespace key removal/offboarding needs its own reviewed lifecycle.
# Freeze of management writes alone does NOT pause Capsule replication. See plan.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: naas-workload-editor
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - services
  - configmaps
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  - events
  verbs:
  - get
  - list
  - watch
---
apiVersion: capsule.clastix.io/v1beta2
kind: GlobalTenantResource
metadata:
  name: naas-namespace-bootstrap
spec:
  scope: Tenant
  settings: {}
  resyncPeriod: 60s
  tenantSelector:
    matchLabels:
      cloud.cluster-vending.io/naas-profile: restricted-ambient-v1
  serviceAccount:
    name: provisioner
    namespace: naas-system
  resources:
  - policy:
      creation: Owner
      protect: true
      force: false
      deletion: Orphan
    generators:
    - missingKey: error
      template: |
        {{- range $key := $.tenant.spec.data.naas.namespaceKeys }}
        ---
        apiVersion: v1
        kind: Namespace
        metadata:
          name: {{ printf "%s-%s" $.tenant.metadata.name $key | printf "%q" }}
          ownerReferences:
            - apiVersion: capsule.clastix.io/v1beta2
              kind: Tenant
              name: {{ printf "%q" $.tenant.metadata.name }}
              uid: {{ printf "%q" $.tenant.metadata.uid }}
          labels:
            capsule.clastix.io/tenant: {{ printf "%q" $.tenant.metadata.name }}
            cloud.cluster-vending.io/tenant: {{ index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant" | printf "%q" }}
            cloud.cluster-vending.io/subtenant-id: {{ index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id" | printf "%q" }}
            cloud.cluster-vending.io/naas-profile: restricted-ambient-v1
            cloud.cluster-vending.io/naas-ready: {{ index $.tenant.metadata.labels "cloud.cluster-vending.io/access-ready" | printf "%q" }}
            istio.io/dataplane-mode: ambient
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: {{ printf "%q" $.tenant.spec.data.naas.pssVersion }}
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/audit-version: {{ printf "%q" $.tenant.spec.data.naas.pssVersion }}
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/warn-version: {{ printf "%q" $.tenant.spec.data.naas.pssVersion }}
        {{- end }}
---
apiVersion: capsule.clastix.io/v1beta2
kind: GlobalTenantResource
metadata:
  name: naas-isolation-baseline
spec:
  scope: Namespace
  settings: {}
  resyncPeriod: 60s
  tenantSelector:
    matchLabels:
      cloud.cluster-vending.io/naas-profile: restricted-ambient-v1
  serviceAccount:
    name: provisioner
    namespace: naas-system
  resources:
  - policy:
      creation: Owner
      protect: true
      force: false
      deletion: Orphan
    generators:
    - missingKey: error
      template: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: naas-deny-by-default
          namespace: '{{ $.namespace.metadata.name }}'
          labels:
            cloud.cluster-vending.io/tenant: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
              }}'
            cloud.cluster-vending.io/subtenant-id: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
              }}'
        spec:
          podSelector: {}
          policyTypes:
          - Ingress
          - Egress
          ingress: []
          egress: []
        ---
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: naas-allow-subtenant-hbone
          namespace: '{{ $.namespace.metadata.name }}'
          labels:
            cloud.cluster-vending.io/tenant: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
              }}'
            cloud.cluster-vending.io/subtenant-id: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
              }}'
        spec:
          podSelector: {}
          policyTypes:
          - Ingress
          - Egress
          ingress:
          - from:
            - namespaceSelector:
                matchLabels:
                  capsule.clastix.io/tenant: '{{ $.tenant.metadata.name }}'
            ports:
            - protocol: TCP
              port: 15008
          egress:
          - to:
            - namespaceSelector:
                matchLabels:
                  capsule.clastix.io/tenant: '{{ $.tenant.metadata.name }}'
            ports:
            - protocol: TCP
              port: 15008
        ---
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: naas-allow-cluster-dns
          namespace: '{{ $.namespace.metadata.name }}'
          labels:
            cloud.cluster-vending.io/tenant: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
              }}'
            cloud.cluster-vending.io/subtenant-id: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
              }}'
        spec:
          podSelector: {}
          policyTypes:
          - Egress
          egress:
          - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
            ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
        ---
        apiVersion: security.istio.io/v1
        kind: PeerAuthentication
        metadata:
          name: naas-require-mtls
          namespace: '{{ $.namespace.metadata.name }}'
          labels:
            cloud.cluster-vending.io/tenant: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
              }}'
            cloud.cluster-vending.io/subtenant-id: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
              }}'
        spec:
          mtls:
            mode: STRICT
        ---
        apiVersion: security.istio.io/v1
        kind: AuthorizationPolicy
        metadata:
          name: naas-allow-owned-namespaces
          namespace: '{{ $.namespace.metadata.name }}'
          labels:
            cloud.cluster-vending.io/tenant: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
              }}'
            cloud.cluster-vending.io/subtenant-id: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
              }}'
        spec:
          action: ALLOW
          rules:
          - from:
            - source:
                namespaces:
          {{- range $key := $.tenant.spec.data.naas.namespaceKeys }}
                - {{ printf "%s-%s" $.tenant.metadata.name $key | printf "%q" }}
        {{- end }}
        ---
        apiVersion: v1
        kind: LimitRange
        metadata:
          name: naas-container-defaults
          namespace: '{{ $.namespace.metadata.name }}'
          labels:
            cloud.cluster-vending.io/tenant: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
              }}'
            cloud.cluster-vending.io/subtenant-id: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
              }}'
        spec:
          limits:
          - type: Container
            defaultRequest:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
            default:
              memory: 256Mi
              ephemeral-storage: 2Gi
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: app
          namespace: '{{ $.namespace.metadata.name }}'
          labels:
            cloud.cluster-vending.io/tenant: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
              }}'
            cloud.cluster-vending.io/subtenant-id: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
              }}'
        automountServiceAccountToken: false
  - policy:
      creation: Merge
      protect: true
      force: false
      deletion: Orphan
    generators:
    - missingKey: error
      template: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: default
          namespace: '{{ $.namespace.metadata.name }}'
          labels:
            cloud.cluster-vending.io/tenant: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant"
              }}'
            cloud.cluster-vending.io/subtenant-id: '{{ index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id"
              }}'
        automountServiceAccountToken: false
---
apiVersion: capsule.clastix.io/v1beta2
kind: GlobalTenantResource
metadata:
  name: naas-developer-access
spec:
  scope: Namespace
  settings: {}
  resyncPeriod: 60s
  tenantSelector:
    matchLabels:
      cloud.cluster-vending.io/naas-profile: restricted-ambient-v1
      cloud.cluster-vending.io/access-ready: 'true'
  serviceAccount:
    name: provisioner
    namespace: naas-system
  resources:
  - policy:
      creation: Owner
      protect: true
      force: false
      deletion: Remove
    generators:
    - missingKey: error
      template: |
        {{- if eq (index $.tenant.metadata.labels "cloud.cluster-vending.io/access-ready") "true" }}
        {{- $owned := false }}
        {{- range $owner := index $.namespace.metadata "ownerReferences" }}
        {{- if and (eq $owner.apiVersion "capsule.clastix.io/v1beta2") (eq $owner.kind "Tenant") (eq $owner.name $.tenant.metadata.name) (eq $owner.uid $.tenant.metadata.uid) }}
        {{- $owned = true }}
        {{- end }}
        {{- end }}
        {{- if $owned }}
        {{- range $key := $.tenant.spec.data.naas.namespaceKeys }}
        {{- if eq $.namespace.metadata.name (printf "%s-%s" $.tenant.metadata.name $key) }}
        {{- range $binding := $.tenant.spec.data.naas.accessBindings }}
        {{- if or (eq $binding.role "naas-workload-admin") (eq $binding.role "naas-workload-viewer") }}
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: {{ printf "naas-access-%s" $binding.id | printf "%q" }}
          namespace: {{ $.namespace.metadata.name | printf "%q" }}
          labels:
            cloud.cluster-vending.io/tenant: {{ index $.tenant.metadata.labels "cloud.cluster-vending.io/tenant" | printf "%q" }}
            cloud.cluster-vending.io/subtenant-id: {{ index $.tenant.metadata.labels "cloud.cluster-vending.io/subtenant-id" | printf "%q" }}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: {{ $binding.role | printf "%q" }}
        subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: Group
          name: {{ $binding.group | printf "%q" }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
  dependsOn:
  - name: naas-isolation-baseline

